[project]
name = "openpeoplerouter"
version = "0.1.0"
description = "An open, bring-your-own-key people discovery router for AI agents"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["fastmcp>=3.0,<4", "httpx>=0.28,<1", "pydantic>=2.12,<3", "pyyaml>=6,<7", "python-dotenv>=1,<2"]

[project.scripts]
openpeoplerouter = "openpeoplerouter.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openpeoplerouter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
