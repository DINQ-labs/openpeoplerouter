adapters:
  rocketreach.contact.find:
    accepts:
    - - linkedin_url
    - - full_name
      - company
    in:
      linkedin_url: query.li_url
      full_name: query.name
      company: query.current_employer
    out:
      emails: contacts(where(emails, 'grade', 'A', 'B'), 'email', 'type', 'grade')
      phones: contacts(phones, 'number', 'type')
      full_name: name
      title: current_title
      company: current_employer
      linkedin_url: linkedin_url
      email: first_value(contacts(where(emails, 'grade', 'A', 'B'), 'email'))
    miss: where(emails, 'grade', 'A', 'B') == []
  apollo.contact.find:
    accepts:
    - - linkedin_url
    - - full_name
      - domain
    - - full_name
      - company
    in:
      linkedin_url: query.linkedin_url
      full_name: query.name
      domain: query.domain
      company: query.organization_name
    out:
      emails: contacts(list(person.email))
      phones: contacts(person.phone_numbers, 'sanitized_number', 'type')
      full_name: person.name
      title: person.title
      company: person.organization.name
      linkedin_url: person.linkedin_url
      email: person.email
      verified: person.email_status == 'verified'
    miss: person.email == null
  contactout.contact.find:
    accepts:
    - - linkedin_url
    - - full_name
      - company
    in:
      linkedin_url: body.linkedin_url
      full_name: body.full_name
    in_expr:
      body.company: list(company)
    out:
      emails: contacts(coalesce(profile.work_email, profile.email, profile.personal_email))
      phones: contacts(profile.phone)
      full_name: profile.full_name
      title: profile.headline
      company: profile.company.name
      linkedin_url: profile.url
      email: first_value(contacts(coalesce(profile.work_email, profile.email, profile.personal_email)))
    miss: coalesce(profile.work_email, profile.email, profile.personal_email, profile.phone)
      == null
  apollo.people.enrich:
    accepts:
    - - email
    - - linkedin_url
    - - full_name
      - domain
    - - full_name
      - company
    in:
      email: query.email
      linkedin_url: query.linkedin_url
      full_name: query.name
      domain: query.domain
      company: query.organization_name
    out:
      full_name: person.name
      title: person.title
      company: person.organization.name
      company_domain: host(person.organization.website_url)
      location: person.city
      linkedin_url: person.linkedin_url
      emails: contacts(list(person.email))
    miss: person.name == null
  rocketreach.people.enrich:
    accepts:
    - - linkedin_url
    - - full_name
      - company
    in:
      linkedin_url: query.li_url
      full_name: query.name
      company: query.current_employer
    out:
      full_name: name
      title: current_title
      company: current_employer
      location: location
      linkedin_url: linkedin_url
      emails: contacts(where(emails, 'grade', 'A', 'B'), 'email', 'type', 'grade')
    miss: name == null
  contactout.people.enrich:
    accepts:
    - - linkedin_url
    - - email
    in:
      linkedin_url: body.linkedin_url
      email: body.email
    out:
      full_name: profile.full_name
      title: profile.headline
      company: profile.company.name
      company_domain: profile.company.domain
      location: profile.location
      linkedin_url: profile.url
      emails: contacts(coalesce(profile.work_email, profile.email, profile.personal_email))
    miss: profile.full_name == null
  tikhub.people.enrich:
    accepts:
    - - linkedin_url
    in:
      linkedin_url: query.url
    out:
      full_name: data.name
      title: data.position
      company: coalesce(data.current_company_name, data.current_company.name)
      location: coalesce(data.city, data.location)
      linkedin_url: coalesce(data.input_url, data.url)
      emails: contacts(missing)
    miss: data.id == null
  tikhub.x.people.enrich:
    accepts:
    - - x_handle
    in_expr:
      query.screen_name: handle_of(x_handle)
    out:
      full_name: data.name
      title: data.desc
      location: data.location
      emails: contacts(missing)
    miss: data.profile == null
  apollo.people.search:
    accepts:
    - - query
    - - title
    - - company_domain
    in:
      query: query.q_keywords
    in_expr:
      query.person_titles[]: title
      query.q_organization_domains: company_domain
      query.person_locations[]: location
      query.person_seniorities[]: seniority
      query.per_page: limit
    out:
      people: rows(people, 'name|first_name+last_name', 'linkedin_url', 'organization.primary_domain')
      count: pagination.total_entries
    miss: people == []
  aviato.people.enrich:
    accepts:
    - - linkedin_url
    - - email
    in:
      linkedin_url: query.linkedinURL
      email: query.email
    out:
      full_name: fullName
      linkedin_url: URLs.linkedin
    miss: fullName == null
  aviato.people.email.find:
    accepts:
    - - linkedin_url
    in:
      linkedin_url: query.linkedinURL
    const:
      query.type: work
    out:
      email: emails[0].email
      emails: contacts(emails[0].email)
    miss: emails == []
  aviato.people.phone.find:
    accepts:
    - - linkedin_url
    - - email
    in:
      linkedin_url: query.linkedinURL
      email: query.email
    out:
      phones: contacts(phones, 'phoneNumber', 'type')
    miss: phones == []
  aviato.people.search:
    accepts:
    - - q
    in_expr:
      body.dsl: obj('filters', list(obj('headline', obj('operation', 'fts', 'value',
        q))), 'limit', limit, 'offset', 0, 'sort', [])
    out:
      people: rows(items, 'fullName', 'URLs.linkedin', '')
      count: count.value
    miss: items == []
  aviato.people.search.simple:
    accepts:
    - - full_name
    in:
      full_name: query.fullName
    in_expr:
      query.perPage: limit
    const:
      query.page: '1'
      query.enrich: 'false'
    out:
      people: rows(items, 'fullName', 'URLs.linkedin', '')
      count: totalResults
    miss: items == []
  companyenrich.people.search:
    accepts:
    - - company_domain
      - title
    - - company_domain
    in:
      company_domain: body.domains
      title: body.positionQuery
    in_expr:
      body.domains: list(company_domain)
      body.positionQuery: list(title)
      body.pageSize: limit
      body.page: '1'
    out:
      people: rows(items, 'name|first_name+last_name', 'socials.linkedin_url', '')
      count: totalItems
    miss: items == []
  companyenrich.people.search.scroll:
    accepts:
    - - company_domain
      - title
    - - company_domain
    in:
      company_domain: body.domains
      title: body.positionQuery
    in_expr:
      body.domains: list(company_domain)
      body.positionQuery: list(title)
      body.pageSize: limit
    out:
      people: rows(items, 'name|first_name+last_name', 'socials.linkedin_url', '')
      count: totalItems
      next_cursor: nextCursor
    miss: items == []
  companyenrich.people.lookup:
    accepts:
    - - email
    in:
      email: body.email
    out:
      full_name: name
      first_name: first_name
      last_name: last_name
      title: position
      linkedin_url: socials.linkedin_url
      location: location.address
    miss: name == null
  crustdata.people.search:
    accepts:
    - - full_name
    in:
      full_name: body.filters.value
    in_expr:
      body.filters: obj('field', 'basic_profile.name', 'type', '=', 'value', full_name)
      body.limit: limit
    out:
      people: rows(profiles, 'basic_profile.name', 'basic_profile.linkedin_profile_url|basic_profile.linkedin_url',
        '')
      count: total_count
      next_cursor: next_cursor
    miss: profiles == []
  exa.people.search:
    accepts:
    - - q
    in:
      q: body.query
    in_expr:
      body.query: join(q, csv(keywords))
      body.numResults: limit
    const:
      body.category: people
    out:
      people: rows(results, 'title|entities[0].properties.name', 'url', '')
      count: len(results)
    miss: results == []
  fiber-ai.people.contacts.reveal:
    accepts:
    - - linkedin_url
    in:
      linkedin_url: body.linkedinUrl
    const:
      body.enrichmentType:
        getWorkEmails: true
        getPersonalEmails: false
        getPhoneNumbers: false
      body.validateEmails: true
    out:
      email: output.profile.emails[0].email
      emails: contacts(output.profile.emails[0].email)
      verified: output.profile.success == true
    miss: output.profile.emails == []
  fiber-ai.people.contacts.turbo:
    accepts:
    - - linkedin_url
    in:
      linkedin_url: body.linkedinUrl
    out:
      email: output.profile.emails[0].email
      emails: contacts(output.profile.emails[0].email)
      verified: output.profile.emails[0].status == 'valid'
    miss: output.profile.emails == []
  fiber-ai.people.enrich:
    accepts:
    - - linkedin_url
    in_expr:
      body.profileIdentifier: obj('identifier', 'linkedinUrl', 'value', linkedin_url)
    out:
      full_name: output.data[0].name
      first_name: output.data[0].first_name
      last_name: output.data[0].last_name
      title: output.data[0].headline
      location: output.data[0].locality
      linkedin_url: output.data[0].url
    miss: output.data == []
  fiber-ai.people.identity.resolve:
    accepts:
    - - email
    in:
      email: body.email
    out:
      profiles: profiles(output.data[0].url)
      linkedin_url: output.data[0].url
      full_name: output.data[0].name
      count: len(profiles(output.data[0].url))
    miss: output.data[0].url == null
  fiber-ai.people.search:
    accepts:
    - - company_domain
    in_expr:
      body.currentCompanies: list(obj('domain', company_domain))
      body.pageSize: limit
    out:
      people: rows(output.data, 'name|full_name|first_name+last_name', 'linkedin_url|linkedinUrl',
        'company_domain|domain')
      next_cursor: output.nextCursor
    miss: output.data == []
  findymail.search.name:
    accepts:
    - - full_name
      - domain
    - - first_name
      - last_name
      - domain
    in:
      full_name: body.name
      domain: body.domain
    out:
      email: contact.email
      emails: contacts(contact.email)
      first_name: split_first(contact.name)
      last_name: split_last(contact.name)
    miss: contact.email == null
  findymail.search.business-profile:
    accepts:
    - - linkedin_url
    in:
      linkedin_url: body.linkedin_url
    out:
      email: contact.email
      emails: contacts(contact.email)
      first_name: split_first(contact.name)
      last_name: split_last(contact.name)
    miss: contact.email == null
  findymail.search.domain:
    accepts:
    - - company_domain
      - title
    in:
      company_domain: body.domain
    in_expr:
      body.roles: list(title)
    out:
      people: rows(contacts, 'name|first_name', '', 'domain')
      count: len(contacts)
    miss: contacts == []
  findymail.search.employees:
    accepts:
    - - company_domain
      - title
    in:
      company_domain: body.website
      title: body.job_titles
    in_expr:
      body.job_titles: list(title)
      body.count: limit
    out:
      people: rows(., 'name', 'linkedinUrl', 'companyWebsite')
      count: len(.)
    miss: . == []
  findymail.search.phone:
    accepts:
    - - linkedin_url
    in:
      linkedin_url: body.linkedin_url
    out:
      phones: contacts(list(obj('value', phone, 'type', line_type)), 'value', 'type')
    miss: phone == null
  findymail.search.reverse-email:
    accepts:
    - - email
    in:
      email: body.email
    out:
      profiles: profiles(linkedin_url)
      linkedin_url: linkedin_url
      full_name: contact.name
      count: len(profiles(linkedin_url))
    miss: linkedin_url == null
  hunter.x.combined-find:
    accepts:
    - - email
    in:
      email: query.email
    out:
      full_name: data.person.name.fullName
      first_name: data.person.name.givenName
      last_name: data.person.name.familyName
      title: data.person.employment.title
      company: data.company.name
      company_domain: data.company.domain
      location: data.person.location
    miss: data.person.name.fullName == null
  hunter.people.email.find:
    accepts:
    - - full_name
      - domain
    - - first_name
      - last_name
      - domain
    in:
      full_name: query.full_name
      domain: query.domain
    out:
      email: data.email
      emails: contacts(data.email)
      confidence: data.score / 100
      first_name: data.first_name
      last_name: data.last_name
      verified: data.verification.status == 'valid'
    miss: data.email == null
  hunter.people.email.verify:
    accepts:
    - - email
    in:
      email: query.email
    out:
      valid: data.status == 'valid'
      status: data.status
      score: data.score
    miss: data.status == null
  hunter.companies.emails:
    accepts:
    - - company_domain
    in:
      company_domain: query.domain
    in_expr:
      query.limit: limit
    out:
      people: rows(data.emails, 'first_name+last_name', 'linkedin', '')
      count: meta.results
    miss: data.emails == []
  hunter.people.enrich:
    accepts:
    - - email
    - - linkedin_handle
    in:
      email: query.email
      linkedin_handle: query.linkedin_handle
    out:
      full_name: data.name.fullName
      first_name: data.name.givenName
      last_name: data.name.familyName
      title: data.employment.title
      company: data.employment.name
      company_domain: data.employment.domain
      linkedin_url: data.linkedin.handle
      location: coalesce(data.location, data.geo.country)
    miss: data.name.fullName == null
  icypeas.people.identity.resolve:
    accepts:
    - - email
    in:
      email: body.email
    out:
      profiles: profiles(result)
      linkedin_url: result
      full_name: results[0].fullname
      count: len(profiles(result))
    miss: result == null
  icypeas.people.search:
    accepts:
    - - company_domain
      - title
    - - company_domain
    - - title
    in:
      company_domain: body.query.currentCompanyWebsite.include
      title: body.query.currentJobTitle.include
    in_expr:
      body.query.currentCompanyWebsite.include: list(company_domain)
      body.query.currentJobTitle.include: list(title)
      body.query.location.include: list(coalesce(location, country_name(country)))
      body.pagination.size: limit
      body.query.keyword.include: list(keywords)
    out:
      people: rows(leads, 'firstname+lastname', 'profileUrl', 'lastCompanyWebsite')
      count: total
      next_cursor: pagination.token
    miss: leads == []
  icypeas.people.enrich:
    accepts:
    - - linkedin_url
    in:
      linkedin_url: query.url
    out:
      full_name: join(result.firstname, result.lastname)
      first_name: result.firstname
      last_name: result.lastname
      title: result.headline
      company: result.worksFor[0].name
      linkedin_url: result.url
      location: result.address.addressLocality
    miss: result == null
  leadmagic.x.personal-email-finder:
    accepts:
    - - linkedin_url
    in:
      linkedin_url: body.profile_url
    out:
      email: first_personal_email
      emails: contacts(first_personal_email)
    miss: first_personal_email == null
  leadmagic.x.role-finder:
    accepts:
    - - company_domain
      - title
    in:
      title: body.job_title
      company_domain: body.company_domain
    out:
      people: rows(list(obj('name', name, 'profile_url', profile_url, 'first_name',
        first_name, 'last_name', last_name, 'company_name', company_name)), 'name',
        'profile_url', '')
      count: len(list(name))
    miss: name == null
  leadmagic.x.employee-finder:
    accepts:
    - - company_domain
    in:
      company_domain: body.company_domain
    in_expr:
      body.limit: limit
    out:
      people: rows(data, 'full_name|first_name+last_name', 'profile_url', 'website')
      count: total_count
    miss: data == []
  leadmagic.people.email.find:
    accepts:
    - - full_name
      - domain
    - - first_name
      - last_name
      - domain
    in:
      full_name: body.full_name
      domain: body.domain
    out:
      email: email
      emails: contacts(email)
      first_name: first_name
      last_name: last_name
      verified: status == 'valid'
    miss: email == null
  leadmagic.people.email.verify:
    accepts:
    - - email
    in:
      email: body.email
    out:
      valid: email_status == 'valid'
      status: email_status
    miss: email_status == null
  leadmagic.people.enrich:
    accepts:
    - - linkedin_url
    in:
      linkedin_url: body.profile_url
    out:
      full_name: full_name
      first_name: first_name
      last_name: last_name
      title: professional_title
      company: company_name
      company_domain: company_website
      linkedin_url: profile_url
      location: location
    miss: full_name == null
  leadmagic.people.phone.find:
    accepts:
    - - linkedin_url
    - - email
    in:
      linkedin_url: body.profile_url
      email: body.work_email
    out:
      phones: contacts(list(obj('value', mobile_number, 'type', 'mobile')), 'value',
        'type')
    miss: mobile_number == null
  leadmagic.people.search:
    accepts:
    - - company_domain
      - title
    - - company_domain
    in:
      company_domain: body.company_domain
      title: body.titles
    in_expr:
      body.titles: list(title)
      body.limit: limit
    const:
      body.include_contact_details: false
    out:
      people: rows(people, 'name|full_name|first_name+last_name', 'profile_url|linkedin_url',
        'company_domain|domain')
      count: count
      next_cursor: next_cursor
    miss: people == []
  leadsforge.people.search:
    accepts:
    - - company_domain
    in:
      company_domain: body.companyDomains.include
    in_expr:
      body.companyDomains.include: list(company_domain)
      body.limit: limit
      body.keywords.include: list(keywords)
    out:
      people: rows(leads, 'firstName+lastName', 'linkedinUrl|linkedin', 'company.domain')
      next_cursor: cursor
    miss: leads == []
  leadsforge.people.email.find:
    accepts:
    - - first_name
      - last_name
      - domain
    - - full_name
      - domain
    - - linkedin_url
    in:
      first_name: body.firstName
      last_name: body.lastName
      domain: body.companyDomain
      linkedin_url: body.linkedinURL
    out:
      email: email
      emails: contacts(email)
      verified: status == 'succeeded'
    miss: email == null
  leadsforge.people.phone.find:
    accepts:
    - - first_name
      - last_name
      - domain
    - - full_name
      - domain
    - - linkedin_url
    in:
      first_name: body.firstName
      last_name: body.lastName
      domain: body.companyDomain
      linkedin_url: body.linkedinURL
    out:
      phones: contacts(phoneNumber)
    miss: phoneNumber == null
  lusha.people.enrich:
    accepts:
    - - first_name
      - last_name
      - domain
    - - full_name
      - domain
    in_expr:
      body.contacts: list(obj('firstName', first_name, 'lastName', last_name, 'companyDomain',
        domain))
    const:
      body.reveal:
      - emails
    out:
      full_name: results[0].fullName
      first_name: results[0].firstName
      last_name: results[0].lastName
      title: results[0].jobTitle
      company: results[0].company.name
      linkedin_url: results[0].socialLinks.linkedin
      location: results[0].location.raw
    miss: results[0].error != null
  lusha.people.search:
    accepts:
    - - title
    in:
      title: body.filters.contacts.include.jobTitles
    in_expr:
      body.filters.contacts.include.jobTitles: list(title)
      body.pagination.size: at_least(limit, 10)
      body.pagination.page: '0'
    out:
      people: rows(results, 'firstName+lastName', 'socialLinks.linkedin', 'company.domain')
      count: pagination.total
    miss: results == []
  pdl.x.person-identify:
    accepts:
    - - email
    in:
      email: query.email
    out:
      profiles: profiles(matches[0].data.linkedin_url)
      linkedin_url: matches[0].data.linkedin_url
      full_name: matches[0].data.full_name
      count: len(profiles(matches[0].data.linkedin_url))
    miss: matches[0].data.linkedin_url == null
  pdl.people.enrich:
    accepts:
    - - email
    - - linkedin_url
    - - full_name
      - domain
    in:
      email: query.email
      linkedin_url: query.profile
      full_name: query.name
      domain: query.company
    out:
      full_name: data.full_name
      first_name: data.first_name
      last_name: data.last_name
      title: data.job_title
      company: data.job_company_name
      company_domain: data.job_company_website
      linkedin_url: data.linkedin_url
      location: data.location_name
    miss: data.full_name == null
  apollo.people.identity.resolve:
    accepts:
    - - email
    - - linkedin_url
    - - full_name
      - domain
    - - full_name
      - company
    in:
      email: query.email
      linkedin_url: query.linkedin_url
      full_name: query.name
      domain: query.domain
      company: query.organization_name
    out:
      profiles: profiles(person.linkedin_url, person.github_url, person.twitter_url,
        person.facebook_url, person.blog_url)
      full_name: person.name
      linkedin_url: person.linkedin_url
      count: len(profiles(person.linkedin_url, person.github_url, person.twitter_url,
        person.facebook_url, person.blog_url))
    miss: person.linkedin_url == null
  contactout.people.identity.resolve:
    accepts:
    - - linkedin_url
    - - email
    in:
      linkedin_url: body.linkedin_url
      email: body.email
    out:
      profiles: profiles(profile.url, profile.github, profile.twitter)
      full_name: profile.full_name
      linkedin_url: profile.url
      count: len(profiles(profile.url, profile.github, profile.twitter))
    miss: profile.full_name == null
  akta.companies.search:
    accepts:
    - - domain
    in:
      domain: query.query
    out:
      companies: rows(data, 'name', '', 'website')
      count: count
    miss: data == []
  apollo.companies.enrich:
    accepts:
    - - domain
    in:
      domain: query.domain
    out:
      name: organization.name
      domain: organization.primary_domain
      website: organization.website_url
      description: organization.short_description
      industry: organization.industry
      employees: organization.estimated_num_employees
      founded: organization.founded_year
      location: join(organization.city, organization.country)
      linkedin_url: organization.linkedin_url
    miss: organization.name == null
  aviato.companies.enrich:
    accepts:
    - - domain
    in:
      domain: query.website
    out:
      name: name
      website: URLs.website
      linkedin_url: URLs.linkedin
