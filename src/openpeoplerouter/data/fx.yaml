credit_rates_usd:
  scrapecreators:
    usd: 0.00188
    basis: Freelance pay-as-you-go $47 / 25,000 credits (Business tier is $497 / 500,000
      = $0.000994)
    source: https://scrapecreators.com/
    checked: '2026-07-28'
  leadmagic:
    usd: 0.025
    basis: Basic $49.99/mo / 2,000 credits per month (annual billing $490/yr / 24,000
      = $0.0204)
    source: https://leadmagic.io/pricing
    checked: '2026-07-28'
  hunter:
    usd: 0.0245
    basis: Starter $49/mo / 2,000 credits; one shared pool -- a search costs 1 credit,
      a verification 0.5 credit, so verification effectively $0.0123
    source: https://hunter.io/pricing
    checked: '2026-07-28'
  diffbot:
    usd: 0.001196
    basis: Startup $299/mo / 250,000 credits
    source: https://www.diffbot.com/pricing/
    checked: '2026-07-28'
  lusha:
    usd: 0.1248
    basis: Starter $49.90/mo / 400 credits (email reveal = 1 credit, phone reveal
      = 10). GET /v3/account/usage returns a free pricing object of per-action credit
      COUNTS, not dollars -- multiply those counts by this rate
    source: https://www.lusha.com/pricing/
    checked: '2026-07-28'
  akta:
    usd: 0.05
    basis: pay-as-you-go $0.05/credit as stated in docs ($0.04 on subscription)
    source: https://docs.akta.pro/getting-started/pricing
    checked: '2026-07-28'
  coresignal:
    usd: 0.0196
    basis: Mini $49/mo / 2,500 credits (Growth tier is listed at $0.007/credit)
    source: https://coresignal.com/pricing/
    checked: '2026-07-28'
  thecompaniesapi:
    usd: 0.0019
    basis: Startup $95/mo / 50,000 credits (overage listed at $2.50 per 1,000 = $0.0025)
    source: https://www.thecompaniesapi.com/pricing
    checked: '2026-07-28'
  pdl:
    usd: null
    note: Plan-specific; configure your own provider pricing if needed.
  apollo:
    usd: 0.02
    basis: credit blocks on the Basic plan
    source: docs
    checked: '2026-09-03'
  fiber-ai:
    usd: 0.02
    basis: Prospector $300/mo / 15,000 credits included = $0.02/credit (Growth $900
      / 50,000 = $0.018; annual billing ~17% cheaper). Bulk API Search is a separate
      product with its own credit pool
    source: https://www.fiber.ai/pricing.md
    checked: '2026-08-17'
  crunchbase:
    usd: null
    basis: no published API pricing
    note: the Basic API was retired and remaining API access is quoted by sales; no
      credit unit is published
    source: https://data.crunchbase.com/docs/crunchbase-basic-getting-started
    checked: '2026-07-28'
  companyenrich:
    usd: 0.0098
    basis: 'Starter $49/mo / 5,000 credits included = $0.0098/credit, which is identical
      to the vendor''s own published per-credit overage rate on that tier. Upper bound:
      Pro is $149/50,000 = $0.00298 and Scale $549/500,000 = $0.0011'
    source: https://companyenrich.com/pricing
    checked: '2026-08-20'
  oceanio:
    usd: null
    basis: credit counts per endpoint are published and live-verified (0.05 lookup
      / 0.1 enrich / 0.2 search per result, 1 per verified email, 10 per verified
      phone), but the plan price they divide into is not machine-readable
    note: https://www.ocean.io/pricing returned 403 to every automated fetch on 2026-08-20
      (bot challenge); public plan listings cite an entry tier around $79/month but
      disagree on the included credit count (420 vs 500), a $0.158-$0.188 spread.
      Fill this in from the vendor's own page or a checkout quote before enabling
      platform metering
    source: https://app.ocean.io/docs/getting-started/credits
    checked: '2026-08-20'
  predictleads:
    usd: 0.04
    basis: 'pay-as-you-go ladder: the first paid band is 101-5,000 calls/mo at $0.04
      per credit ($40 minimum monthly charge); higher bands are cheaper ($0.02 at
      5k+, $0.01 at 10k+, $0.004 at 100k+, $0.002 at 500k+), so this is the upper
      bound. The first 100 credits each month are free and do not roll over'
    source: https://predictleads.com/pricing
    checked: '2026-08-20'
  findymail:
    usd: 0.0198
    basis: Starter $99/mo / 5,000 finder credits (the only self-serve tier published;
      above it is Enterprise custom pricing). 1 credit = 1 verified email; a phone
      is 10 credits; unused credits roll over up to 2x the monthly allowance
    source: https://www.findymail.com/pricing
    checked: '2026-08-20'
  branddev:
    usd: 0.0025
    basis: entry paid tier $25/mo / 10,000 API credits per month ($149/200,000 = $0.000745
      and $499/1,000,000 = $0.000499 on the higher tiers; entry-tier overage is sold
      at $15 per 10,000 = $0.0015). A brand record is 10 credits = $0.025, fonts 5
      = $0.0125, a screenshot 1 = $0.0025
    note: credit cost per endpoint was read live off key_metadata.credits_consumed
      on 2026-08-20, not transcribed; credits are consumed on successful responses
      only
    source: https://brand.dev/pricing
    checked: '2026-08-20'
  icypeas:
    usd: 0.019
    basis: Basic $19/mo (+VAT) / 1,000 credits — the cheapest publicly listed tier,
      and the pricing page states the same $0.019 per found email. Bigger tiers are
      much cheaper per credit (Premium $39/4,000 = $0.00975, Advanced $89/10,000 =
      $0.0089, Hypergrowth $499/100,000 = $0.00499), so this is the upper bound. Credits
      roll over; per-route credit counts are published (1 per found email, 0.1 per
      verification, 10 per reverse lookup, 0.02 per lead-database row)
    source: https://www.icypeas.com/pricing
    checked: '2026-08-20'
  leadsforge:
    usd: 0.0245
    basis: 'Essential $49/mo / 2,000 credits per month (annual billing $588/yr / 28,000
      = $0.021). One shared pool: email = 1 credit, LinkedIn profile URL = 1, mobile
      number = 10, company lookalike = 1 per company, company follower = 1 per follower.
      Lead search itself is free. GET /public/v1/balance returns those per-action
      credit counts live, for free'
    source: https://www.leadsforge.ai/pricing
    checked: '2026-08-20'
  influencersclub:
    usd: null
    note: Plan-specific; configure your own provider pricing if needed.
  crustdata:
    usd: 0.3
    basis: our pay-as-you-go auto-top-up adds 500 credits for $150 = $0.30/credit;
      this is treg's configured replacement cost. The initial free 100-credit grant
      is not a sustainable rate
    source: Crustdata team billing dashboard auto-top-up configuration
    checked: '2026-08-25'
  aviato:
    usd: 0.01
    basis: our automatic recharge adds 1,000 credits for $10 = $0.01/credit; confirmed
      by a paid $10 receipt from the vendor's Stripe account
    source: Aviato team automatic-recharge configuration and paid receipt
    checked: '2026-08-25'
  seranking:
    usd: 0.000179
    basis: 'credits are sold annually: 12M for $2,148/yr on the entry tier = $0.000179/credit
      (the 120M tier is $10,200/yr = $0.000085)'
    source: https://seranking.com/pricing.html
    checked: '2026-07-28'
  serpstat:
    usd: 0.0005
    basis: Team plan $100/mo (annual billing) includes 200K API credits/mo; 100/200,000.
      Monthly billing is $129 -> $0.000645; the 250K/mo export-rows allowance is a
      SEPARATE pool
    source: https://serpstat.com/page/pricing-plans/
    checked: '2026-07-31'
  coingecko:
    usd: 0.00029
    basis: 'Basic $29/mo billed yearly / 100,000 call credits per month (confirmed
      from our own dashboard 2026-08-15; license: Commercial). Most endpoints cost
      1 credit per call; the endpoint files record exceptions'
    source: https://www.coingecko.com/en/api/pricing
    checked: '2026-08-15'
  marketstack:
    usd: 0.000999
    basis: 'Basic $9.99/mo / 10,000 requests per month included (confirmed from our
      own dashboard 2026-08-15; Commercial Use included on Basic). The monthly-cap
      rung of the pricing ladder: fee / cap, vendor-published on both sides. Overage
      is billed by the vendor at $0.0039996/call, so sustained volume past the cap
      costs MORE than this rate — the recovery report will show it'
    source: https://marketstack.com/product
    checked: '2026-08-15'
  finnhub:
    usd: 0
    kind: treg_trial
    trial_calls_per_team_day: 50
    basis: 'treg trial rate. Served at $0 on treg''s FREE Finnhub key (60 req/min)
      - a capped taste, NOT the vendor''s price (their commercial tier is $3,500/mo
      billed annually). Allowance: 50 calls per team per day; past it the call is
      refused with a connect-your-own-key hint. A hot pool is the buy signal'
    source: https://finnhub.io/pricing
    checked: '2026-08-15'
  twelvedata:
    usd: 0
    kind: treg_trial
    trial_calls_per_team_day: 20
    basis: treg trial rate. Served at $0 on treg's free Basic key - which is 800 calls/day
      TOTAL across every team, hence the small allowance. 20 calls per team per day;
      their business tier with external-display rights is Venture $499/mo
    source: https://twelvedata.com/pricing-business
    checked: '2026-08-15'
  tiingo:
    usd: 0
    kind: treg_trial
    trial_calls_per_team_day: 20
    basis: treg trial rate. Served at $0 on treg's free Starter key (1,000 req/day
      total across every team). 20 calls per team per day; Tiingo's redistribution
      licensing is a sales bundle
    source: https://www.tiingo.com/about/pricing
    checked: '2026-08-15'
  alphavantage:
    usd: 0.001
    kind: treg_shared_plan
    fee_usd_month: 49.99
    basis: treg shared-plan rate. MACHINERY PILOT — treg holds NO Alpha Vantage subscription
      and no alphavantage endpoints exist, so this rate prices nothing; it exists
      to keep the shared-plan validator and recovery-report machinery exercised until
      the first real shared-plan provider ships. Vendor sells flat $49.99/mo at 75
      req/min (= 3.24M calls/mo capacity; floor $0.0000154/call); no per-call vendor
      price exists. Rate set for break-even at 50,000 calls/mo (1.5% utilization);
      reviewed monthly against audited volume
    source: https://www.alphavantage.co/premium/
    checked: '2026-08-14'
  rocketreach:
    usd: 0.06
    basis: Pro plan, 833 lookups for $49/month
    source: docs
    checked: '2026-09-03'
  contactout:
    usd: 0.05
    basis: per revealed contact on the team plan
    source: docs
    checked: '2026-09-03'
  tikhub:
    usd: 0.001
    basis: pay-as-you-go request pricing
    source: docs
    checked: '2026-09-03'
  apify:
    usd: 0.01
    basis: actor compute unit, averaged over Crunchbase runs
    source: observed
    checked: '2026-09-03'
