    index_item_unit:
      usd: 0.0008
      basis: same $399.99 plan includes 500K index item units; 399.99/500,000 (upper
        bound; pool shares the one subscription)
      source: https://majestic.com/plans-pricing
      checked: '2026-07-31'
  moz:
    quota_row:
      usd: 0.006667
      basis: Links API Starter $20/mo for 3,000 rows; 20/3,000 (upper bound -- the
        $75/15,000 tier and the published $5/1,000 overage both work out to $0.005/row)
      source: https://moz.com/products/api/pricing
      checked: '2026-07-31'
  findymail:
    verifier_credit:
      usd: null
      basis: the Starter plan grants 5,000 verifier credits as a BONUS alongside its
        5,000 finder credits, with no standalone price and no verifier-only plan,
        so no per-verification dollar figure can be derived honestly. POST /verify
        therefore displays natively ('1 verifier credit') and is not platform-eligible
        until Findymail publishes a verifier price
      source: https://www.findymail.com/pricing
      checked: '2026-08-20'
