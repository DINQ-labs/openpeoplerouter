vendor: aviato
name: Aviato
base_url: https://data.api.aviato.co
auth:
  kind: header
  name: Authorization
  format: Bearer {secret}
  credential: AVIATO_API_KEY
docs: https://data.aviato.co/
endpoints:
- id: aviato.people.enrich
  capability: people.enrich
  name: Enrich a person by profile URL or email
  summary: Get a person's work history, education, skills, investments and social
    identities
  method: GET
  path: /person/enrich
  input:
    queryParams:
      id:
        type: string
        required: false
        note: Aviato person id
      linkedinID:
        type: string
        required: false
      linkedinEntityId:
        type: string
        required: false
      linkedinURL:
        type: string
        required: false
        note: public, Sales Navigator or Recruiter URL
      email:
        type: string
        required: false
      preview:
        type: boolean
        required: false
        note: return minimal id/name/URLs without charging a credit
      full:
        type: boolean
        required: false
        note: include company/fund investments and founded companies
      rescrape:
        type: boolean
        required: false
        note: refresh stale data; use with maxDataAgeDays
      maxDataAgeDays:
        type: integer
        required: false
      require:
        type: array[string]
        required: false
        note: fields that must be present or a free 404 is returned
    note: supply one identifier. Use preview=true to resolve the person without spending
      a credit.
  docs_url: https://docs.data.aviato.co/api-reference/person/enrich
  cost:
    type: per_success
    value: 5
    currency: credit
    per: 1
    unit: call
    source: observed
    source_url: https://data.aviato.co/
    checked: '2026-08-25'
    confidence: verified
    settle: modifiers
    modifiers:
      preview:
        location: query
        when: truthy
        set_credits: 0
      email:
        location: query
        when: present
        add_credits: 3
      rescrape:
        location: query
        when: truthy
        add_credits: 2
        reserve_only: true
    note: 5 credits for profile-based enrichment; an email lookup costs 8 credits;
      preview=true and a require-driven miss are free. Live profile and email rescrape
      probes stayed at 5 and 8 credits. Treg holds the documented 2-credit rescrape
      rider and releases it during settlement.
