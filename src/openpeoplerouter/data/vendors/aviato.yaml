- id: aviato.companies.enrich.bulk
  capability: companies.enrich
  name: Bulk enrich companies
  summary: Enrich up to 100 companies in one synchronous request
  method: POST
  path: /company/bulk-enrich
  input:
    bodyType: json
    body:
      lookups:
        type: array[object]
        required: true
        note: 1-100 lookup objects; each can use Aviato company identifiers such as
          website or linkedinURL
      rescrape:
        type: boolean
        required: false
        note: refresh records older than maxDataAgeDays
      maxDataAgeDays:
        type: integer
        required: false
        note: stale-data threshold; requires rescrape=true
      require:
        type: array[string]
        required: false
        note: top-level fields that must be present; failed gates are not billed
    note: this is synchronous bulk enrichment. Each successful lookup returns the
      normal company object. Public docs do not offer company preview mode.
  docs_url: https://docs.data.aviato.co/api-reference/company/bulk-enrich
  cost:
    type: per_success
    value: 15
    currency: credit
    per: 1
    unit: record
    source: observed
    source_url: https://data.aviato.co/
    checked: '2026-08-25'
    confidence: verified
    settle: modifiers
    modifiers:
      rescrape:
        location: body
        when: truthy
        add_credits: 5
        reserve_only: true
    note: 15 credits per successfully enriched company. Live one-row and mixed two-row
      rescrape=true probes charged 15 credits per successful row, not the documented
      20. Treg holds 20 per input and settles 15 per successful row. A failed lookup
      is free.
  tool: true
