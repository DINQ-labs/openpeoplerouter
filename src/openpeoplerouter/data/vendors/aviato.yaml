- id: aviato.people.search
  capability: people.search
  name: Search people with Aviato DSL
  summary: Search people using nested role, company, location and relationship filters
  method: POST
  path: /person/search
  input:
    bodyType: json
    body:
      dsl:
        type: object
        required: true
        note: '{filters,limit,offset,sort?}; filter objects use column paths and {operation,value,quantifier?}'
    note: DSL limit is at most 250 and offset at most 10,000.
  docs_url: https://docs.data.aviato.co/api-reference/person/search
  cost:
    type: per_success
    value: 0.25
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://data.aviato.co/
    checked: '2026-08-24'
    confidence: documented
    note: '0.25 credits per successful DSL search call. Current route limit: 600 requests/minute
      and 36,000/hour.'
- id: aviato.people.search.simple
  capability: people.search
  name: Search people with simple query parameters
  summary: Search people without constructing Aviato DSL
  method: GET
  path: /person/simple/search
  input:
    queryParams:
      page:
        type: integer
        required: true
        note: page number
      perPage:
        type: integer
        required: true
        note: maximum 100
      enrich:
        type: boolean
        required: false
        note: when true, enriches and charges 1 person credit per result; false returns
          minimal rows
      fullName:
        type: string
        required: false
        note: fuzzy name query
      headline:
        type: string
        required: false
        note: headline keyword search
      country:
        type: array[string]
        required: false
      currentTitles:
        type: array[string]
        required: false
      currentCompanyNames:
        type: array[string]
        required: false
      skills:
        type: array[string]
        required: false
        note: all specified skills must be present
    note: Use enrich=false for discovery. Aviato documents enrich=true at +1 credit/result,
      but repeat live probes returned id-only rows and charged only the base.
  docs_url: https://docs.data.aviato.co/api-reference/person/simple-search
  cost:
    type: per_success
    value: 0.25
    currency: credit
    per: 1
    unit: call
    source: observed
    checked: '2026-08-25'
    confidence: verified
    settle: base
    modifiers:
      enrich:
        location: query
        when: truthy
        add_credits_per_result: 1
    note: 0.25 credits per successful search call. Aviato documents enrich=true at
      +1 credit/result, so treg keeps that rider in the reserve. Live 5-row and 3-row
      enrich=true probes on 2026-08-25 returned unenriched id-only rows and each charged
      only the 0.25-credit base; treg therefore settles at the base and releases the
      rider. No numeric route limit is published.
