- id: branddev.brand.transaction-identifier
  capability: companies.transaction.identify
  name: Identify a company from a card transaction descriptor
  summary: Turn a raw card or bank statement descriptor into a named company with
    logo, colors and industry
  method: GET
  path: /brand/transaction_identifier
  input:
    queryParams:
      transaction_info:
        type: string
        required: true
        note: the raw descriptor exactly as it appears on the statement, URL-encoded
      timeoutMS:
        type: integer
        required: false
    note: 'the fintech route: ''TST* STARBUCKS SEATTLE'' resolves to starbucks.com.
      Descriptors that match nothing return a brand record with a low-confidence domain
      rather than an error, so check the domain before trusting it'
  docs_url: https://docs.brand.dev/guides/enrich-transaction-codes
  cost:
    type: per_success
    value: 10
    currency: credit
    per: 1
    unit: call
    source: observed
    source_url: https://brand.dev/pricing
    checked: '2026-08-20'
    confidence: verified
    note: observed credits_consumed = 10
  tool: true
- id: branddev.brand.naics
  capability: companies.industry.resolve
  name: NAICS industry codes by domain or description
  summary: Map a domain or a free-text company description to 2022 NAICS industry
    codes with a confidence label
  method: GET
  path: /brand/naics
  input:
    queryParams:
      input:
        type: string
        required: true
        note: a domain OR a free-text description of the business; minimum 4 characters
      timeoutMS:
        type: integer
        required: false
    note: 'returns one or more {code, name, confidence: high|medium|low} rows. Every
      brand record also carries an inline `industries.eic` tag pair, so call this
      only when you specifically need NAICS'
  docs_url: https://docs.brand.dev/guides/classification/NAICS
  cost:
    type: per_success
    value: 10
    currency: credit
    per: 1
    unit: call
    source: observed
    source_url: https://brand.dev/pricing
    checked: '2026-08-20'
    confidence: verified
    note: observed credits_consumed = 10
  tool: true
- id: branddev.brand.styleguide
  capability: companies.brand.styleguide
  name: Extract a website's design system by domain — CSS
  summary: Colors, type scale, spacing, shadows and component styles (button, card,
    input) lifted from a live site, each with ready-to-paste CSS
  method: GET
  path: /brand/styleguide
  input:
    queryParams:
      domain:
        type: string
        required: true
        note: bare domain, no scheme
      maxAgeMs:
        type: integer
        required: false
        note: maximum acceptable age of the cached styleguide in ms; lower forces
          a fresh render
      timeoutMS:
        type: integer
        required: false
    note: 'the programmatic-theming call: enough to render an app in a customer''s
      brand without a designer. Values are measured off the rendered page, so a heavily
      JS-themed site can report the pre-hydration palette'
  docs_url: https://docs.brand.dev/api-reference/brand-intelligence/styleguide
  cost:
