    value: 10
    currency: credit
    per: 1
    unit: call
    source: observed
    source_url: https://brand.dev/pricing
    checked: '2026-08-20'
    confidence: verified
    note: observed credits_consumed = 10
  tool: true
- id: branddev.brand.fonts
  capability: companies.brand.fonts
  name: Detect a website's fonts by domain — files per weight
  summary: Every font family a site loads, with fallback stacks, share of elements
    and words, and direct links to the font files by weight
  method: GET
  path: /brand/fonts
  input:
    queryParams:
      domain:
        type: string
        required: true
        note: bare domain, no scheme
      maxAgeMs:
        type: integer
        required: false
        note: maximum acceptable age of the cached result in ms
      timeoutMS:
        type: integer
        required: false
    note: 5 credits, the cheapest of the brand-asset routes (maxSpeed is ignored here).
      `fontLinks` gives the woff2 URL per weight, which is what makes the result actually
      usable in a rendered mock-up
  docs_url: https://docs.brand.dev/api-reference/brand-intelligence/fonts
  cost:
    type: per_success
    value: 5
    currency: credit
    per: 1
    unit: call
    source: observed
    source_url: https://brand.dev/pricing
    checked: '2026-08-20'
    confidence: verified
    note: observed credits_consumed = 5 — half the brand-retrieval price
  tool: true
- id: branddev.brand.screenshot
  capability: companies.website.screenshot
  name: Screenshot a company's website by domain
  summary: A 1920x1080 viewport or full-page PNG of a company's site, returned as
    a cached CDN URL
  method: GET
  path: /brand/screenshot
  input:
    queryParams:
      domain:
        type: string
        required: true
        note: bare domain, no scheme
      fullScreenshot:
        type: boolean
        required: false
        note: true captures the whole page (screenshotType 'fullPage') instead of
          the 1920x1080 viewport
      page:
        type: string
        required: false
        note: capture a named sub-page instead of the homepage — an enum (pricing,
          blog, careers, contact, login, signup …); an unknown value returns a free
          405
      maxAgeMs:
        type: integer
        required: false
      timeoutMS:
        type: integer
        required: false
    note: 1 credit — the cheapest route on the provider. The response is a URL on
      the provider's media CDN, not image bytes, so the call stays small
  docs_url: https://docs.brand.dev/guides/take-webpage-screenshot
  cost:
    type: per_success
    value: 1
    currency: credit
    per: 1
    unit: call
    source: observed
    source_url: https://brand.dev/pricing
    checked: '2026-08-20'
    confidence: verified
    note: observed credits_consumed = 1, for both the viewport and the fullScreenshot=true
      variant
  tool: true
- id: branddev.brand.ai.query
  capability: companies.website.extract
  name: Extract named datapoints from a company site by domain
  summary: Define the fields you want — name, description, type and an example each
    — and get them extracted from the company's own website, with the URLs used
  method: POST
  path: /brand/ai/query
  input:
    body:
      domain:
        type: string
        required: true
        note: bare domain, no scheme
      data_to_extract:
        type: array[object]
        required: true
        note: each item needs ALL FOUR of datapoint_name, datapoint_description, datapoint_example
          and datapoint_type; datapoint_type is one of text | number | date | boolean
          | list | url
      specific_pages:
        type: object
        required: false
        note: restrict the crawl to named page types instead of letting it pick
      timeoutMS:
        type: integer
        required: false
    note: one flat price whatever the number of datapoints, so batch every field you
      need into one call. The response echoes `urls_analyzed`, which is what makes
      an answer auditable
  docs_url: https://docs.brand.dev/api-reference/web-extraction/extract
  cost:
    type: per_success
    value: 10
    currency: credit
    per: 1
    unit: call
    source: observed
    source_url: https://brand.dev/pricing
    checked: '2026-08-20'
    confidence: verified
    note: observed credits_consumed = 10 for a one-datapoint request; the pricing
      page prices structured extraction at 10 credits per call
  tool: true
- id: branddev.brand.ai.products
  capability: companies.products
  name: Extract products and prices from a company site by domain
  summary: Build a structured product/plan catalog from a company's site — name, price,
    currency, billing frequency, pricing model, features, audience and URL
  method: POST
  path: /brand/ai/products
  input:
    body:
      domain:
        type: string
        required: false
        note: bare domain — provide EITHER domain or directUrl, never both (sending
          neither, or both, returns a free 400)
      directUrl:
        type: string
        required: false
        note: a specific pricing or product page to parse instead of letting the crawler
          find one
      timeoutMS:
        type: integer
        required: false
    note: 'the competitive-pricing call: it reads a public pricing page into rows
      you can diff over time. Returns a bare {products: [...]} object with no status
      wrapper'
  docs_url: https://docs.brand.dev/api-reference/web-extraction/products
  cost:
    type: per_success
    value: 10
    currency: credit
    per: 1
    unit: call
    source: observed
    source_url: https://brand.dev/pricing
    checked: '2026-08-20'
    confidence: verified
    note: observed credits_consumed = 10 regardless of how many products come back
  tool: true
