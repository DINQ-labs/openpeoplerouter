vendor: branddev
name: Brand.dev
base_url: https://api.brand.dev/v1
auth:
  kind: header
  name: Authorization
  format: Bearer {secret}
  credential: BRANDDEV_API_KEY
docs: https://brand.dev
endpoints:
- id: branddev.brand.retrieve
  capability: companies.enrich
  name: Brand profile by domain — logos, colors, socials, headcount
  summary: Retrieve logos, colors, fonts, slogan, description, socials, address, headcount
    and industry for a domain
  method: GET
  path: /brand/retrieve
  input:
    queryParams:
      domain:
        type: string
        required: true
        note: bare domain, no scheme or www
      maxSpeed:
        type: boolean
        required: false
        note: true serves the cached record and returns in ~1s instead of ~10s — same
          price
      maxAgeMs:
        type: integer
        required: false
        note: maximum acceptable age of the cached record in ms; lower forces a fresh
          crawl and a slower call
      timeoutMS:
        type: integer
        required: false
        note: abort the call after this many ms
      force_language:
        type: string
        required: false
        note: return the description in this language; full language names, not codes
          ('english', 'french', 'japanese' …)
    note: exactly one lookup identifier per call — this route takes `domain`; use
      the sibling retrieve-by-* routes for name / email / ticker / ISIN. Calling it
      with NO parameters returns a free 400 and is the registry's probe.
  docs_url: https://docs.brand.dev/api-reference/brand-intelligence/brand
  cost:
    type: per_success
    value: 10
    currency: credit
    per: 1
    unit: call
    source: observed
    source_url: https://brand.dev/pricing
    checked: '2026-08-20'
    confidence: verified
    note: key_metadata.credits_consumed = 10 on the captured response; the pricing
      page's plan popovers say '10 credits per call' for brand retrieval. Failed/invalid
      calls consume 0
- id: branddev.brand.retrieve-by-name
  capability: companies.enrich
  name: Brand profile by company name — logos, colors, socials
  summary: Resolve a company name to its domain and return the full brand record —
    logos, colors, description, socials, industry
  method: GET
  path: /brand/retrieve-by-name
  input:
    queryParams:
      name:
        type: string
        required: true
        note: company name, at least 3 characters (2 returns a free 405)
      country_gl:
        type: string
        required: false
        note: ISO 3166-1 alpha-2 country code to disambiguate a name used in several
          markets
      maxSpeed:
        type: boolean
        required: false
        note: serve the cached record (~1s)
      maxAgeMs:
        type: integer
        required: false
      timeoutMS:
        type: integer
        required: false
    note: a name shorter than 3 characters is refused free. This family answers bad
      input with a plain-text 405 rather than a JSON 400 — treat both as free validation
      failures, not as outages
  docs_url: https://docs.brand.dev/api-reference/brand-intelligence/brand
  cost:
    type: per_success
    value: 10
    currency: credit
    per: 1
    unit: call
    source: observed
    source_url: https://brand.dev/pricing
    checked: '2026-08-20'
    confidence: verified
    note: observed credits_consumed = 10
- id: branddev.brand.retrieve-by-email
  capability: companies.enrich
  name: Company brand profile by work email
  summary: Turn a work email address into the employer's brand record — the signup-form
    enrichment call
  method: GET
  path: /brand/retrieve-by-email
  input:
    queryParams:
      email:
        type: string
        required: true
        note: a work email; free / disposable mailbox providers are rejected
      maxSpeed:
        type: boolean
        required: false
      maxAgeMs:
        type: integer
        required: false
      timeoutMS:
        type: integer
        required: false
    note: this enriches the COMPANY behind the address, never the person — no personal
      data is returned for the mailbox itself
  docs_url: https://docs.brand.dev/api-reference/brand-intelligence/brand
  cost:
    type: per_success
    value: 10
    currency: credit
    per: 1
    unit: call
    source: observed
    source_url: https://brand.dev/pricing
    checked: '2026-08-20'
    confidence: verified
    note: observed credits_consumed = 10
- id: branddev.brand.retrieve-simplified
  capability: companies.brand.assets
  name: Brand logos, colors and backdrops by domain
  summary: The visual half of the brand record — logos, backdrops and the color palette
    — without the description, socials or firmographics
  method: GET
  path: /brand/retrieve-simplified
  input:
    queryParams:
      domain:
        type: string
        required: true
        note: bare domain, no scheme or www
      maxAgeMs:
        type: integer
        required: false
        note: maximum acceptable age of the cached record in ms
      timeoutMS:
        type: integer
        required: false
    note: 'same price as the full record — pick this one for a smaller payload (about
      half the bytes), not to save money. Verified 2026-08-20: this route IGNORES
      maxSpeed (it is accepted on /brand/retrieve), so there is no latency dial here'
  docs_url: https://docs.brand.dev/api-reference/brand-intelligence/brand
  cost:
    type: per_success
    value: 10
    currency: credit
    per: 1
    unit: call
    source: observed
    source_url: https://brand.dev/pricing
    checked: '2026-08-20'
    confidence: verified
    note: observed credits_consumed = 10
  tool: true
- id: branddev.brand.retrieve-by-ticker
  capability: companies.enrich
  name: Brand profile by stock ticker — logo and colors
  summary: Resolve a listed company's ticker to its domain and brand record — logo
    and colors for a portfolio or watchlist UI
  method: GET
  path: /brand/retrieve-by-ticker
  input:
    queryParams:
      ticker:
        type: string
        required: true
        note: exchange ticker symbol
      maxSpeed:
        type: boolean
        required: false
      maxAgeMs:
        type: integer
        required: false
      timeoutMS:
        type: integer
        required: false
    note: unrecognised query params are IGNORED rather than rejected, so a misspelled
      parameter fails silently and still costs a call — copy the names above exactly
  docs_url: https://docs.brand.dev/api-reference/brand-intelligence/brand
  cost:
    type: per_success
    value: 10
    currency: credit
    per: 1
    unit: call
    source: observed
    source_url: https://brand.dev/pricing
    checked: '2026-08-20'
    confidence: verified
    note: observed credits_consumed = 10
  tool: true
