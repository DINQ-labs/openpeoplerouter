      the enrich response rather than round-tripping ids.
  docs_url: https://docs.companyenrich.com/reference/get_companies
  cost:
    type: per_call
    value: 1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://companyenrich.com/pricing
    checked: '2026-08-20'
    confidence: verified
    note: 1 credit per call, VERIFIED against the live credit meter 2026-08-20.
  tool: true
- id: companyenrich.companies.workforce
  capability: companies.headcount_trend
  name: Company headcount by department, with history
  summary: Returns workforce insights for a single company — observed employee count,
    range bucket, and headcounts grouped by root departments
  method: GET
  path: /companies/workforce
  input:
    queryParams:
      domain:
        type: string
        required: false
        note: company domain — supply EXACTLY ONE of domain or id
      id:
        type: string
        required: false
        note: CompanyEnrich company UUID — supply EXACTLY ONE of domain or id
    note: the strongest signal in this provider. Returns observed_employee_count,
      employee_count_range, department_headcount across 14 root departments (engineering_technical,
      sales, c_suite, …), unclassified_headcount, and a `history` array of the same
      shape per month — that history is what makes growth rates computable without
      repeated polling.
  docs_url: https://docs.companyenrich.com/reference/get_companies-workforce
  cost:
    type: per_success
    value: 5
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://companyenrich.com/pricing
    checked: '2026-08-20'
    confidence: verified
    note: 5 credits per SUCCESSFUL call. VERIFIED 2026-08-20 against the live credit
      meter.
  tool: true
