- id: companyenrich.companies.similar
  capability: companies.similar
  name: Lookalike companies for a seed domain or id
  summary: Finds similar companies to the given company by id or domain — at most
    100 companies are returned per request
  method: POST
  path: /companies/similar
  input:
    body:
      domains:
        type: array[string]
        required: false
        note: 1-10 seed domains; the result is similar to the SET, so several seeds
          sharpen the profile
      domain:
        type: string
        required: false
        note: DEPRECATED single-seed form — use `domains`
      page:
        type: integer
        required: false
        note: 1-based page number
      pageSize:
        type: integer
        required: false
        note: 1-100. THIS IS THE PRICE — 5 credits per company returned
      similarityWeight:
        type: number
        required: false
        note: -1 to 1, default 0; higher weights raw similarity over the structured
          filters
      minScore:
        type: number
        required: false
        note: 0-1 floor on the similarity score
      countries:
        type: array[string]
        required: false
        note: narrow the lookalikes by geography — every companyenrich.companies.search
          filter is accepted here too
      employees:
        type: array[string]
        required: false
        note: narrow by size bucket
    note: THE MOST EXPENSIVE ROW-PRICED ROUTE — 5 credits per company, so a default
      pageSize of 10 is 50 credits. Call companyenrich.companies.similar.count first
      (free) and set pageSize explicitly, every time.
  docs_url: https://docs.companyenrich.com/reference/post_companies-similar
  cost:
    type: per_result
    value: 5
    currency: credit
    per: 1
    unit: record
    source: docs
    source_url: https://companyenrich.com/pricing
    checked: '2026-08-20'
    confidence: verified
    note: '5 credits PER COMPANY RETURNED, and 5 credits even when nothing matches.
      VERIFIED 2026-08-20: pageSize 1 moved the credit meter by exactly 5.'
  tool: true
