vendor: companyenrich
name: CompanyEnrich
base_url: https://api.companyenrich.com
auth:
  kind: header
  name: Authorization
  format: Bearer {secret}
  credential: COMPANYENRICH_API_KEY
docs: https://app.companyenrich.com
endpoints:
- id: companyenrich.people.search
  capability: people.search
  name: Search people by title, seniority, department or company
  summary: Searches people based on given criteria using page-based pagination
  method: POST
  path: /people/search
  input:
    body:
      page:
        type: integer
        required: false
        note: 1-based; page * pageSize may not exceed 10,000 — past that use the scroll
          route
      pageSize:
        type: integer
        required: false
        note: 1-100, default 10. THIS IS THE PRICE — 2 credits per PERSON returned,
          so a default page costs 20 credits
      domains:
        type: array[string]
        required: false
        note: employer domains, up to 2,500 — the usual way to enumerate a company's
          staff
      positionQuery:
        type: array[string]
        required: false
        note: free-text matches on the person's CURRENT job title; resolve real titles
          first with the free /positions/autocomplete
      seniority:
        type: array[string]
        required: false
        note: one or more of owner, founder, c-suite, partner, vp, head, director,
          manager, senior, entry, intern. NOTE the hyphen in `c-suite` — an underscore
          is rejected with a bodyless HTTP 400
      department:
        type: array[string]
        required: false
        note: hierarchical department slugs, e.g. c-suite/finance-executive, engineering-technical/data-science
      countries:
        type: array[string]
        required: false
        note: ISO 3166-1 alpha-2 codes
      query:
        type: string
        required: false
        note: free-text match on the employer's name and domain, max 250 chars
      companyFilter:
        type: object
        required: false
        note: a nested company lookup — search people at companies matching firmographic
          criteria rather than a fixed domain list
      atCurrentCompanyAfter:
        type: string
        required: false
        note: UTC date — only people who joined their current employer after it; the
          job-change signal
      atCurrentCompanyBefore:
        type: string
        required: false
        note: UTC date — only people who joined before it
      atCurrentPositionAfter:
        type: string
        required: false
        note: UTC date — only people promoted into their current role after it
      atCurrentPositionBefore:
        type: string
        required: false
        note: UTC date
      education:
        type: object
        required: false
        note: school/degree filter
      exclude:
        type: object
        required: false
        note: people or companies to drop from the results
    queryParams:
      expand:
        type: array[string]
        required: false
        note: '`education` adds the education block at extra credit cost per person'
    note: BILLS PER RESULT — 2 credits per person, with a 2-credit minimum when nothing
      matches. There is no free count route for people (unlike companies), so keep
      pageSize at 1 while you tune filters. Results carry name, location, socials.linkedin_url
      and the full `experiences` array with position, seniority and department per
      role — but NOT an email address; that is a separate, dearer call (companyenrich.people.email).
  docs_url: https://docs.companyenrich.com/reference/post_people-search
  cost:
    type: per_result
    value: 2
    currency: credit
    per: 1
    unit: record
    source: docs
    source_url: https://companyenrich.com/pricing
    checked: '2026-08-20'
    confidence: verified
    note: '2 credits PER PERSON RETURNED — pageSize is the price — with a 2-credit
      minimum on an empty result. VERIFIED 2026-08-20: pageSize 1 moved the credit
      meter by exactly 2.'
- id: companyenrich.people.search.scroll
  capability: people.search
  name: Scroll people search results past 10,000 rows
  summary: Searches people based on given criteria using cursor-based pagination
  method: POST
  path: /people/search/scroll
  input:
    body:
      pageSize:
        type: integer
        required: false
        note: 1-100. THIS IS THE PRICE — 2 credits per person returned
      cursor:
        type: string
        required: false
        note: omit for the first page, then pass `next_cursor` from the previous response
      domains:
        type: array[string]
        required: false
        note: employer domains, up to 2,500
      positionQuery:
        type: array[string]
        required: false
        note: matches on current job title
    note: identical filter set to companyenrich.people.search — every field there
      applies — with a cursor instead of a page number and no 10,000-row ceiling.
      For anything large, the async people export reserves credits up front and is
      safer.
  docs_url: https://docs.companyenrich.com/reference/post_people-search-scroll
  cost:
    type: per_result
    value: 2
    currency: credit
    per: 1
    unit: record
    source: docs
    source_url: https://companyenrich.com/pricing
    checked: '2026-08-20'
    confidence: verified
    note: 2 credits per person returned, 2-credit minimum on an empty page. VERIFIED
      live 2026-08-20.
- id: companyenrich.people.lookup
  capability: people.enrich
  name: Reverse email lookup — who is behind this address
  summary: Looks up a person by email address — resolves the company from the email
    domain first, then matches the person by email local-part patterns
  method: POST
  path: /people/lookup
  input:
    body:
      email:
        type: string
        required: true
        note: a work email address; free-mail domains will not resolve to a company
    queryParams:
      expand:
        type: array[string]
        required: false
        note: '`education` adds the education block at extra credit cost'
    note: 'READ THE MECHANISM BEFORE TRUSTING THE ANSWER. This is not a mailbox lookup
      — the provider resolves the employer from the domain and then guesses which
      employee the local part refers to, from that company''s address patterns. Verified
      live 2026-08-20: `patrick@stripe.com` returned a Stripe employee named Patrick,
      but NOT the Patrick that address belongs to. Treat the result as a candidate,
      and confirm it against the returned experiences before acting on it.'
  docs_url: https://docs.companyenrich.com/reference/post_people-lookup
  cost:
    type: per_success
    value: 5
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://companyenrich.com/pricing
    checked: '2026-08-20'
    confidence: verified
    note: 5 credits per SUCCESSFUL call. VERIFIED against the live credit meter 2026-08-20.
- id: companyenrich.companies.enrich
  capability: companies.enrich
  name: Enrich a company by domain
  summary: Enriches a company using its domain name as lookup parameter
  method: GET
  path: /companies/enrich
  input:
    queryParams:
      domain:
        type: string
        required: true
        note: company domain, no protocol or www; max 1024 chars
      expand:
        type: array[string]
        required: false
        note: repeat the parameter per expansion. `workforce` adds the department
          headcount block and costs 5 EXTRA credits
    note: the preferred lookup — one domain maps to exactly one company. A domain
      with no company behind it returns HTTP 404, not an empty body. The response
      carries firmographics, description, industries, NAICS, socials, technologies
      and funding.
  docs_url: https://docs.companyenrich.com/reference/get_companies-enrich
  cost:
    type: per_call
    value: 1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://companyenrich.com/pricing
    checked: '2026-08-20'
    confidence: verified
    note: 1 credit per call. VERIFIED live 2026-08-20 by reading GET /me before and
      after — the credit meter moved by exactly 1. `expand=workforce` adds 5 credits.
- id: companyenrich.companies.enrich.by_properties
  capability: companies.enrich
  name: Enrich a company by name or social profile
  summary: Enriches a company using its properties — best match is used in case of
    ambiguity
  method: POST
  path: /companies/enrich
  input:
    body:
      name:
        type: string
        required: false
        note: company name
      linkedinUrl:
        type: string
        required: false
        note: company LinkedIn page URL
      linkedinId:
        type: string
        required: false
        note: numeric LinkedIn company id
      twitterUrl:
        type: string
        required: false
        note: company X/Twitter profile URL
      facebookUrl:
        type: string
        required: false
        note: company Facebook page URL
      instagramUrl:
        type: string
        required: false
        note: company Instagram profile URL
      youTubeUrl:
        type: string
        required: false
        note: company YouTube channel URL
    queryParams:
      expand:
        type: array[string]
        required: false
        note: '`workforce` costs 5 EXTRA credits'
    note: at least ONE of the seven properties must be supplied. Use this only when
      you do not have a domain — the domain route is deterministic, this one is a
      best-match and can resolve to the wrong company for a generic name. Supplying
      both a name and a social URL narrows it considerably.
  docs_url: https://docs.companyenrich.com/reference/post_companies-enrich
  cost:
    type: per_call
    value: 1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://companyenrich.com/pricing
    checked: '2026-08-20'
    confidence: verified
    note: 1 credit per call, VERIFIED against the live credit meter 2026-08-20.
- id: companyenrich.companies.search
  capability: companies.search
  name: Search companies by firmographics, tech stack or keywords
  summary: Searches companies based on given criteria — name, domain, industry, employees,
    revenue, founded year, and more
  method: POST
  path: /companies/search
  input:
    body:
      page:
        type: integer
        required: false
        note: 1-based page number; page * pageSize may not exceed 10,000 — past that
          use the scroll route
      pageSize:
        type: integer
        required: false
        note: 1-100, default 10. THIS IS THE PRICE — 1 credit per company returned
      query:
        type: string
        required: false
        note: free-text match on company name and domain, max 250 chars
      semanticQuery:
        type: string
        required: false
        note: natural-language description of the companies you want; costs 2 credits
          per company instead of 1
      semanticWeight:
        type: number
        required: false
        note: 0-1, default 0.7 — higher favours semantic similarity over the structured
          filters
      technologies:
        type: array[string]
        required: false
        note: technology-stack names; resolve them first with the free /technologies/autocomplete
      keywords:
        type: array[string]
        required: false
        note: description keywords; resolve them first with the free /keywords/autocomplete
      countries:
        type: array[string]
        required: false
        note: ISO 3166-1 alpha-2 codes
      regions:
        type: array[string]
        required: false
        note: region ids from the free GET /geo/regions
      states:
        type: array[integer]
        required: false
        note: state ids from the free POST /geo/states
      cities:
        type: array[integer]
        required: false
        note: city ids from the free POST /geo/cities
      employees:
        type: array[string]
        required: false
        note: employee-count buckets, e.g. 1-10, 5K-10K, over-10K
      reportedEmployees:
        type: array[string]
        required: false
        note: same buckets, but the externally reported figure
      workforceSize:
        type: array[object]
        required: false
        note: absolute headcount ranges, finer-grained than the buckets
      workforceGrowth:
        type: object
        required: false
        note: filter by headcount growth rate over a window
      revenue:
        type: array[string]
        required: false
        note: revenue buckets, e.g. over-1b
      category:
        type: array[string]
        required: false
        note: b2b, b2c, b2g, saas, marketplace, service-provider …
      type:
        type: array[string]
        required: false
        note: private, public, nonprofit, educational, government
      naicsCode:
        type: array[integer]
        required: false
        note: 2-6 digit NAICS; a short code matches all its children
      foundedYear:
        type: object
        required: false
        note: 'range object, e.g. {min: 2015, max: 2022}'
      fundingRounds:
        type: array[string]
        required: false
        note: seed, series-a, …
      fundingAmount:
        type: object
        required: false
        note: range object in USD
      fundingYear:
        type: object
        required: false
        note: range object
      require:
        type: array[string]
        required: false
        note: features that MUST be present on the company record
      exclude:
        type: object
        required: false
        note: domains/companies to drop; the per-search exclude cap is plan-bound
          (500 Starter → 50,000 Scale)
      categoryOperator:
        type: string
        required: false
        note: and | or — how multiple `category` values combine
      keywordsOperator:
        type: string
        required: false
        note: and | or
      technologiesOperator:
        type: string
        required: false
        note: and | or
      lists:
        type: array[integer]
        required: false
        note: restrict to saved list ids (dashboard feature, plan-gated)
    queryParams:
      expand:
        type: array[string]
        required: false
        note: '`workforce` costs 5 EXTRA credits PER COMPANY returned — expensive
          on a search'
    note: 'ALWAYS call companyenrich.companies.search.count first: it is free and
      tells you the match total, so you never buy an unexpectedly large page. An empty
      result set still bills the 1-credit minimum. Deep pagination past 10,000 rows
      requires the scroll route.'
  docs_url: https://docs.companyenrich.com/reference/post_companies-search
  cost:
    type: per_result
    value: 1
    currency: credit
    per: 1
    unit: record
    source: docs
    source_url: https://companyenrich.com/pricing
    checked: '2026-08-20'
    confidence: verified
    note: '1 credit PER COMPANY RETURNED — `pageSize` is the price. 1-credit minimum
      when nothing matches. A `semanticQuery` search is 2 credits per company instead.
      VERIFIED 2026-08-20: pageSize 1 moved the meter by exactly 1.'
- id: companyenrich.companies.enrich.batch
  capability: companies.enrich
  name: Enrich up to 50 companies by domain in one call
  summary: Enriches a list of companies using their domain names — up to 50 domains
    per request
  method: POST
  path: /companies/enrich/batch
  input:
    body:
      domains:
        type: array[string]
        required: true
        note: 1-50 company domains. THIS IS THE PRICE DIAL — 1 credit per domain enriched
    queryParams:
      expand:
        type: array[string]
        required: false
        note: '`workforce` costs 5 EXTRA credits per company'
    note: returns a plain ARRAY of company objects (not an envelope). This is the
      synchronous batch — it answers in the same request. For more than 50 domains
      use the async bulk job (companyenrich.companies.enrich.bulk.start), which takes
      up to 10,000.
  docs_url: https://docs.companyenrich.com/reference/post_companies-enrich-batch
  cost:
    type: per_result
    value: 1
    currency: credit
    per: 1
    unit: record
    source: docs
    source_url: https://companyenrich.com/pricing
    checked: '2026-08-20'
    confidence: verified
    note: '1 credit per domain enriched. VERIFIED 2026-08-20: a 2-domain batch moved
      the credit meter by exactly 2.'
  tool: true
- id: companyenrich.companies.get
  capability: companies.enrich
  name: A company record by CompanyEnrich id
  summary: Gets a company information by its CompanyEnrich ID
  method: GET
  path: /companies
  input:
    queryParams:
      id:
        type: string
        required: true
        note: the UUID returned in the `id` field of any enrich or search result
      expand:
