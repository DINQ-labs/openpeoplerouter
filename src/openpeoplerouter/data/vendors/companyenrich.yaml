      spend credits once on the real search. Returns {count, total} where `count`
      is capped at the plan''s page limit and `total` is the true match count.'
  docs_url: https://docs.companyenrich.com/reference/post_companies-search-count
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
