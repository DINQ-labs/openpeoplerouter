    value: 1
    currency: credit
    per: 1
    unit: record
    source: docs
    source_url: https://companyenrich.com/pricing
    checked: '2026-08-20'
    confidence: verified
    note: 1 credit per company returned, 1-credit minimum on an empty page. VERIFIED
      live 2026-08-20.
  tool: true
- id: companyenrich.companies.search.count
  capability: companies.search.count
  name: Count companies matching a filter (free)
  summary: Returns the total count of companies matching the given search criteria
    without retrieving the actual results
  method: POST
  path: /companies/search/count
  input:
    body:
      technologies:
        type: array[string]
        required: false
        note: same filter object as companyenrich.companies.search — every field there
          is accepted here
      countries:
        type: array[string]
        required: false
        note: ISO alpha-2 codes
    note: 'FREE and it takes the entire search filter object, so it is the correct
