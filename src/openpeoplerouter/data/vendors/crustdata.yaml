vendor: crustdata
name: Crustdata
base_url: https://api.crustdata.com
auth:
  kind: header
  name: Authorization
  format: Bearer {secret}
  credential: CRUSTDATA_API_KEY
  extra_headers:
    x-api-version: '2025-11-01'
docs: https://app.crustdata.com/team
endpoints:
- id: crustdata.people.search
  capability: people.search
  name: Search people by role, company or location
  summary: Search indexed professional profiles with structured filters
  method: POST
  path: /person/search
  input:
    bodyType: json
    body:
      filters:
        type: object
        required: false
        note: one condition or nested and/or group
      fields:
        type: array[string]
        required: false
        note: dot-path fields to return
      sorts:
        type: array[object]
        required: false
        note: each item is {column, order:'asc'|'desc'}
      limit:
        type: integer
        required: false
        note: results per page; this is the price dial
      cursor:
        type: string
        required: false
        note: next_cursor from the prior response
  docs_url: https://docs.crustdata.com/person-docs/search/introduction
  cost:
    type: per_result
    value: 0.03
    currency: credit
    per: 1
    unit: record
    source: docs
    source_url: https://docs.crustdata.com/general/pricing
    checked: '2026-08-24'
    confidence: documented
    note: 0.03 Crustdata credits per profile returned; no result is free.
- id: crustdata.companies.search
  capability: companies.search
  name: Search companies by firmographics or signals
  summary: Search the indexed company dataset with structured filters
  method: POST
  path: /company/search
  input:
    bodyType: json
    body:
      filters:
        type: object
        required: false
        note: one condition {field,type,value} or a nested {op:'and'|'or',conditions:[...]}
          group
      fields:
        type: array[string]
        required: false
        note: dot-path fields to return; specifying these keeps responses small
      sorts:
        type: array[object]
        required: false
        note: each item is {column, order:'asc'|'desc'}
      limit:
        type: integer
        required: false
        note: results per page, max 1000; this is the price dial
      cursor:
        type: string
        required: false
        note: next_cursor from the previous response
  docs_url: https://docs.crustdata.com/company-docs/search/introduction
  cost:
    type: per_result
    value: 0.03
    currency: credit
    per: 1
    unit: record
    source: docs
    source_url: https://docs.crustdata.com/general/pricing
    checked: '2026-08-24'
    confidence: documented
    note: 0.03 Crustdata credits per company returned; no result is free.
- id: crustdata.companies.autocomplete
  capability: companies.autocomplete
  name: Autocomplete company search values
  summary: Return valid values for one indexed company-search field
  method: POST
  path: /company/search/autocomplete
  input:
    bodyType: json
    body:
      field:
        type: string
        required: true
        note: supported company-search field in dot notation
      query:
        type: string
        required: true
        note: partial text; an empty string returns common values
      limit:
        type: integer
        required: false
        note: 1-100, default 20
      filters:
        type: object
        required: false
        note: optional company-search condition or nested condition group
  docs_url: https://docs.crustdata.com/company-docs/autocomplete/introduction
  cost:
    type: free
    value: 0
    currency: USD
    per: 1
    unit: call
  tool: true
- id: crustdata.companies.identify
  capability: companies.enrich
  name: Resolve a company from a domain, URL or name
  summary: Identify companies and return ranked candidate matches
  method: POST
  path: /company/identify
  input:
    bodyType: json
    body:
      domains:
        type: array[string]
        required: false
        note: company domains to resolve
      names:
        type: array[string]
        required: false
        note: company names to resolve when a domain is unavailable
      professional_network_profile_urls:
        type: array[string]
        required: false
        note: company profile URLs
    note: supply at least one supported identifier collection; domains are the least
      ambiguous
  docs_url: https://docs.crustdata.com/company-docs/identify/introduction
  cost:
    type: free
    value: 0
    currency: USD
    per: 1
    unit: call
  tool: true
- id: crustdata.companies.enrich
  capability: companies.enrich
  name: Enrich companies by domain, profile URL or id
  summary: Return detailed company profiles with firmographics, funding and hiring
    data
  method: POST
  path: /company/enrich
  input:
    bodyType: json
    body:
      domains:
        type: array[string]
        required: false
        note: company domains
      professional_network_profile_urls:
        type: array[string]
        required: false
        note: company profile URLs
      names:
        type: array[string]
        required: false
        note: company names; use a stronger identifier when possible
      fields:
        type: array[string]
        required: false
        note: field groups to return; technographics adds 2 credits when data is returned
    note: supply one identifier family. Base enrichment is 2 credits per matched company;
      technographics can raise it to 4.
  docs_url: https://docs.crustdata.com/company-docs/enrichment/introduction
  cost:
    type: per_result
    value: 4
    currency: credit
    per: 1
    unit: record
    source: docs
    source_url: https://docs.crustdata.com/general/pricing
    checked: '2026-08-25'
    confidence: documented
    note: 'Maximum 4 credits per matched company: base enrichment is 2; technographics
      adds 2 only when requested data is returned. A two-company live call charged
      4 credits total. The current platform key returned 403 for a technographics
      request, so that optional rider remains documented. Platform billing settles
      the exact X-Credits-Used response header.'
  tool: true
- id: crustdata.people.autocomplete
  capability: people.autocomplete
  name: Autocomplete people search values
  summary: Return valid values for one indexed person-search field
  method: POST
  path: /person/search/autocomplete
  input:
    bodyType: json
    body:
      field:
        type: string
        required: true
        note: supported person-search field in dot notation
      query:
        type: string
        required: true
        note: partial text; an empty string returns common values
      limit:
        type: integer
        required: false
        note: 1-100, default 20
      filters:
        type: object
        required: false
        note: optional person-search condition or nested condition group
  docs_url: https://docs.crustdata.com/person-docs/autocomplete/introduction
  cost:
    type: free
    value: 0
    currency: USD
    per: 1
    unit: call
  tool: true
- id: crustdata.people.enrich
  capability: people.enrich
  name: Enrich people by profile URL or business email
  summary: Return full professional profiles with optional contact and developer data
  method: POST
  path: /person/enrich
  input:
    bodyType: json
    body:
      professional_network_profile_urls:
        type: array[string]
        required: false
        note: public professional profile URLs
      business_emails:
        type: array[string]
        required: false
        note: business emails for reverse lookup
      fields:
        type: array[string]
        required: false
        note: optional field groups; email, phone and developer data add credits
    note: supply profile URLs or business emails. Base profile costs 1 credit; all
      add-ons can bring one record to 7.
  docs_url: https://docs.crustdata.com/person-docs/enrichment/introduction
  cost:
    type: per_result
    value: 7
    currency: credit
    per: 1
    unit: record
    source: docs
    source_url: https://docs.crustdata.com/general/pricing
    checked: '2026-08-25'
    confidence: documented
    note: 'Maximum 7 credits per matched person: base profile 1, business email +1,
      personal email +2, phone +2 and developer-platform data +1. Live calls confirmed
      the base, business-email, personal-email and developer riders. Phone requests
      with no returned phone charged only the base; the paid phone rider remains data-dependent
      and unobserved. Platform billing settles the exact X-Credits-Used response header.'
  tool: true
- id: crustdata.companies.jobs.search
  capability: companies.jobs.search
  name: Search indexed job listings
  summary: Search jobs by company, title, location, funding and posting metadata
  method: POST
  path: /job/search
  input:
    bodyType: json
    body:
      filters:
        type: object
        required: false
        note: one condition or nested condition group
      fields:
        type: array[string]
        required: false
        note: dot-path fields to include; always specify in production
      sorts:
        type: array[object]
        required: false
        note: each item is {column,order}
      limit:
        type: integer
        required: false
        note: 0-1000 rows; use 0 for aggregation-only requests
      cursor:
        type: string
        required: false
      aggregations:
        type: array[object]
        required: false
        note: count or group_by requests
  docs_url: https://docs.crustdata.com/job-docs/search/introduction
  cost:
    type: per_result
    value: 0.03
    currency: credit
    per: 1
    unit: record
    source: docs
    source_url: https://docs.crustdata.com/general/pricing
    checked: '2026-08-24'
    confidence: documented
    note: 0.03 Crustdata credits per job returned; aggregation-only and empty results
      consume no row credits.
  tool: true
