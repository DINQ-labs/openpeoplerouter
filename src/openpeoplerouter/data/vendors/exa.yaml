- id: exa.web.contents.get
  capability: web.contents.get
  name: Get page contents by URL
  summary: Get the full page contents, summaries, and metadata for a list of URLs.
  method: POST
  path: /contents
  input:
    bodyType: json
    body:
      urls:
        type: array[string]
        required: true
        note: one or more page URLs; each page is billed per content type requested
      text:
        type: boolean|object
        required: false
        note: 'true, or {maxCharacters: N} — the page as clean text. $0.001 per page'
      highlights:
        type: object
        required: false
        note: '{query, maxCharacters, numSentences} — the passages most relevant to
          `query`. $0.001 per page'
      summary:
        type: object
        required: false
        note: '{query} — an AI summary of the page focused on `query`. $0.001 per
          page'
      maxAgeHours:
        type: integer
        required: false
        note: serve cache if younger than this, else live-crawl; omit for Exa's default
          freshness
      livecrawlTimeout:
        type: integer
        required: false
        note: ms, default 10000
      subpages:
        type: integer
        required: false
        note: also crawl N linked subpages (each billed as a page)
    note: each result carries url, title, author, publishedDate and whichever of text
      / highlights / summary was asked for; `statuses` says per URL whether it came
      from cache or a live crawl, or failed. Request only the content types you need
      — each one is a separate $0.001 per page.
  docs_url: https://docs.exa.ai/reference/get-contents
  cost:
    type: per_result
    value: 1
    currency: USD
    per: 1000
    unit: page
    source: observed
    source_url: https://exa.ai/pricing
    checked: '2026-08-27'
    confidence: verified
    note: '$0.001 per page PER CONTENT TYPE: text, highlights and summary are each
      billed separately (OBSERVED 2026-08-27: text on one page → costDollars.total
      0.001; highlights+summary on one page → 0.002 as {highlights: 0.001, summary:
      0.001}). A failed URL is not billed. Platform billing settles the exact costDollars.total.'
  tool: true
- id: exa.web.similar
  capability: web.similar
  name: Find pages similar to a URL
  summary: Find similar links to the link provided and optionally return the contents
    of the pages.
  method: POST
  path: /findSimilar
  input:
    bodyType: json
    body:
      url:
        type: string
        required: true
        note: the page to find neighbours of — a product site to find competitors,
          an article to find coverage of the same story
      numResults:
        type: integer
        required: false
        note: 1-100, default 10; beyond 10 adds $0.001 each
      excludeSourceDomain:
        type: boolean
        required: false
        note: drop results from the input URL's own domain — usually what you want
      category:
        type: string
        required: false
        note: company | people | news | publication | personal site | financial report
      includeDomains:
        type: array[string]
        required: false
      excludeDomains:
        type: array[string]
        required: false
      startPublishedDate:
        type: string
        required: false
      contents:
        type: object
        required: false
        note: same shape as exa.web.search
    note: results carry url, title, publishedDate, author and a similarity `score`
  docs_url: https://docs.exa.ai/reference/find-similar-links
  cost:
    type: per_call
