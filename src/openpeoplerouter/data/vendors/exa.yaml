vendor: exa
name: Exa
base_url: https://api.exa.ai
auth:
  kind: header
  name: x-api-key
  format: '{secret}'
  credential: EXA_API_KEY
docs: https://dashboard.exa.ai/api-keys
endpoints:
- id: exa.people.search
  capability: people.search
  name: Search people by description
  summary: The search endpoint lets you intelligently search the web and extract contents
    from the results.
  method: POST
  path: /search
  input:
    bodyType: json
    body:
      query:
        type: string
        required: true
        note: 'describe the person in words — role, seniority, location, industry,
          anything a profile page would say. Free text, not filters: ''head of security
          at a fintech in berlin'' works, so does ''ai safety researchers in greater
          phoenix'''
      category:
        type: string
        required: true
        note: must be `people`
      numResults:
        type: integer
        required: false
        note: 1-100, default 10; beyond 10 adds $0.001 each
      includeDomains:
        type: array[string]
        required: false
        note: e.g. ["linkedin.com"] to keep to one profile host
      contents:
        type: object
        required: false
        note: '{highlights: true} returns the profile lines that matched the query'
    note: 'each result is a profile page: url (mostly linkedin.com/in/…), title (the
      person''s name), publishedDate, and an `entities` block with the structured
      person record Exa extracted (name, current title, company, location). No contact
      data — pair with a people.enrich or people.email.find provider for that. Scored
      72% R@1 / 94.5% R@10 on Exa''s open people-search benchmark; the structured
      providers under this capability need role+location filters instead of free text.'
  docs_url: https://docs.exa.ai/reference/search
  cost:
    type: per_call
    value: 7
    currency: USD
    per: 1000
    unit: call
    source: observed
    source_url: https://exa.ai/pricing
    checked: '2026-08-27'
    confidence: verified
    note: '$0.007 per call for up to 10 results (OBSERVED 2026-08-27: category people,
      5 results → costDollars.total 0.007), plus $0.001 per result beyond 10. Platform
      billing settles the exact costDollars.total.'
- id: exa.companies.search
  capability: companies.search
  name: Search companies by description
  summary: The search endpoint lets you intelligently search the web and extract contents
    from the results.
  method: POST
  path: /search
  input:
    bodyType: json
    body:
      query:
        type: string
        required: true
        note: describe the company in words — what it does, stage, geography
      category:
        type: string
        required: true
        note: must be `company`
      numResults:
        type: integer
        required: false
      includeDomains:
        type: array[string]
        required: false
      startPublishedDate:
        type: string
        required: false
      contents:
        type: object
        required: false
        note: '{summary: {query: "what does this company sell"}} adds a $0.001/page
          summary'
    note: 'each result is the company''s own site or profile page: url, title, and
      an `entities` block with the structured company record (name, description, location,
      industry, headcount range, founding year where known). Firmographic FILTERS
      (headcount, funding) belong to the structured providers under this capability;
      this one takes a description.'
  docs_url: https://docs.exa.ai/reference/search
  cost:
    type: per_call
    value: 7
    currency: USD
    per: 1000
    unit: call
    source: observed
    source_url: https://exa.ai/pricing
    checked: '2026-08-27'
    confidence: verified
    note: '$0.007 per call for up to 10 results (OBSERVED 2026-08-27: category company,
      5 results → costDollars.total 0.007), plus $0.001 per result beyond 10. Platform
      billing settles the exact costDollars.total.'
- id: exa.web.search
  capability: web.search
  name: Search the web
  summary: The search endpoint lets you intelligently search the web and extract contents
    from the results.
  method: POST
  path: /search
  input:
    bodyType: json
    body:
      query:
        type: string
        required: true
        note: natural-language or keyword query; Exa's neural index understands meaning,
          so phrase it as a description of the page you want
      numResults:
        type: integer
        required: false
        note: 1-100, default 10. The first 10 are covered by the base price; each
          result beyond 10 adds $0.001
      type:
        type: string
        required: false
        note: auto (default) | instant | fast | deep-lite | deep | deep-reasoning.
          auto/instant/fast bill the base; use exa.web.search.deep for the deep modes
      category:
        type: string
        required: false
        note: 'focus on one sub-index: company | people | news | publication | personal
          site | financial report. The people/company/news/publication categories
          have their own curated routes below'
      includeDomains:
        type: array[string]
        required: false
        note: only these hosts or host paths
      excludeDomains:
        type: array[string]
        required: false
      startPublishedDate:
        type: string
        required: false
        note: ISO 8601; only pages published after this
      endPublishedDate:
        type: string
        required: false
        note: ISO 8601
      userLocation:
        type: string
        required: false
        note: two-letter ISO country code to localise results, e.g. US
      contents:
        type: object
        required: false
        note: 'attach page content to each result: {text: true|{maxCharacters}, highlights:
          true|{query, maxCharacters}, summary: {query}}. Observed 2026-08-27: highlights
          on a search were not billed on top of the base; text/summary follow the
          $1/1k-page contents rate'
    note: results carry url, title, publishedDate, author, score and any requested
      contents. Keep numResults at 10 or below to stay at the base price.
  docs_url: https://docs.exa.ai/reference/search
  cost:
    type: per_call
    value: 7
    currency: USD
    per: 1000
    unit: call
    source: observed
    source_url: https://exa.ai/pricing
    checked: '2026-08-27'
    confidence: verified
    note: '$0.007 per call for up to 10 results, plus $0.001 per result beyond 10
      (OBSERVED 2026-08-27: numResults 10 → costDollars.total 0.007; numResults 20
      → 0.016, i.e. 19 returned = base + 9 riders). type fast and instant billed the
      same 0.007. Platform billing settles the exact costDollars.total the response
      reports, so the rider is charged as Exa charges it.'
  tool: true
- id: exa.web.search.deep
  capability: web.search.deep
  name: Deep web search
  summary: The search endpoint lets you intelligently search the web and extract contents
    from the results.
  method: POST
  path: /search
  input:
    bodyType: json
    body:
      query:
        type: string
        required: true
      type:
        type: string
        required: true
        note: deep-lite ($12/1k) | deep ($12/1k) | deep-reasoning ($15/1k). This route
          exists so the deep modes carry their own price; the base route is exa.web.search
      numResults:
        type: integer
        required: false
        note: 1-100, default 10; results beyond 10 add $0.001 each
      additionalQueries:
        type: array[string]
        required: false
        note: extra query variations the deep search fans out over
      includeDomains:
        type: array[string]
        required: false
      excludeDomains:
        type: array[string]
        required: false
      startPublishedDate:
        type: string
        required: false
      endPublishedDate:
        type: string
        required: false
      contents:
        type: object
        required: false
        note: same shape as exa.web.search
    note: the same /search route with a deep `type`; same result shape as exa.web.search
  docs_url: https://docs.exa.ai/reference/search
  cost:
    type: per_call
    value: 12
    currency: USD
    per: 1000
    unit: call
    source: observed
    source_url: https://exa.ai/pricing
    checked: '2026-08-27'
    confidence: verified
    note: '$0.012 per deep-lite or deep call (OBSERVED 2026-08-27: deep-lite, 5 results
      → costDollars.total 0.012); deep-reasoning is documented at $0.015 and unobserved.
      Results beyond 10 add $0.001 each. Platform billing settles the exact costDollars.total.'
  tool: true
