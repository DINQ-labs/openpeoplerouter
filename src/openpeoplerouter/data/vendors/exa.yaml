- id: exa.creators.search
  capability: creators.search
  name: Find influencers & creators by describing them
  summary: The search endpoint lets you intelligently search the web and extract contents
    from the results.
  method: POST
  path: /search
  input:
    bodyType: json
    body:
      query:
        type: string
        required: true
        note: describe the creators in words — niche, city/region, language, audience,
          brand mentions, follower scale ('Italian specialty-coffee baristas who post
          latte art', 'Belo Horizonte food guides recommending restaurants'). Keep
          city and niche words in the query; they are how Exa matches profile and
          post text
      includeDomains:
        type: array[string]
        required: true
        note: 'pin the platform: ["instagram.com"] | ["tiktok.com"] | ["youtube.com"]
          | ["x.com", "twitter.com"] | ["twitch.tv"]. Without it results drift to
          news and LinkedIn'
      numResults:
        type: integer
        required: false
        note: 1-100, default 10; beyond 10 adds $0.001 each
      contents:
        type: object
        required: false
        note: '{highlights: {query, maxCharacters: 400}} returns the matching caption/bio
          lines — the evidence a reviewer needs'
    note: 'Do NOT set category: people — that returns LinkedIn profiles, not creators.
      Results are profile and post URLs on the platform (instagram.com/<handle>/p/…);
      take the handle from the URL, dedupe on it. This is the SEMANTIC shape of creator
      discovery: it follows meaning (niche, brand mentions, city) but cannot enforce
      follower ranges or engagement. The STRUCTURED shape is influencersclub.creators.search
      (follower/engagement/location/language filters, audience data). Best results
      come from running both and merging on handle — on the LessieAI people-search-bench
      influencer track (2026-08-27) Exa rows qualified 100% and influencers.club rows
      63%, and the union scored 55 vs 38 for either alone.'
  docs_url: https://docs.exa.ai/reference/search
  cost:
    type: per_call
    value: 7
    currency: USD
    per: 1000
    unit: call
    source: observed
    source_url: https://exa.ai/pricing
    checked: '2026-08-27'
    confidence: verified
    note: '$0.007 per call for up to 10 results (OBSERVED 2026-08-27: includeDomains
      instagram.com, 15 results → costDollars.total 0.012 = base + 5 riders), plus
      $0.001 per result beyond 10. Highlights inside the call were not billed on top.
      Platform billing settles the exact costDollars.total.'
  tool: true
- id: exa.web.answer
  capability: web.answer
  name: Answer a question with citations
  summary: Get an LLM answer to a question informed by Exa search results. Fully compatible
    with OpenAI's chat completions endpoint.
  method: POST
  path: /answer
  input:
    bodyType: json
    body:
      query:
        type: string
        required: true
        note: a question or instruction; Exa searches, reads, and writes an answer
          with citations
      text:
        type: boolean
        required: false
        note: true also returns the full text of each cited page
      outputSchema:
        type: object
        required: false
        note: JSON Schema draft-7; when set, `answer` is a JSON object in that shape
          instead of prose
      stream:
        type: boolean
        required: false
        note: server-sent events; leave false through the proxy
    note: 'response is {answer, citations: [{url, title, publishedDate, author, text?}],
      costDollars}. This is the one Exa route that runs a model over the results;
      for raw results use exa.web.search.'
  docs_url: https://docs.exa.ai/reference/answer
  cost:
    type: per_call
    value: 5
    currency: USD
    per: 1000
    unit: call
    source: observed
    source_url: https://exa.ai/pricing
    checked: '2026-08-27'
    confidence: verified
    note: '$0.005 per answer (OBSERVED 2026-08-27: costDollars.total 0.005). Platform
      billing settles the exact costDollars.total.'
  tool: true
