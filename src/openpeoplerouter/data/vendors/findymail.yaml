vendor: findymail
name: Findymail
base_url: https://app.findymail.com/api
auth:
  kind: header
  name: Authorization
  format: Bearer {secret}
  credential: FINDYMAIL_API_KEY
docs: https://app.findymail.com/
endpoints:
- id: findymail.search.name
  capability: people.contact.find
  name: Find a work email from a name and company domain
  summary: Find someone's verified professional email from their full name and their
    company's domain
  method: POST
  path: /search/name
  input:
    body:
      name:
        type: string
        required: true
        note: the person's full name
      domain:
        type: string
        required: true
        note: the company domain, no protocol or www
      webhook_url:
        type: string
        required: false
        note: if set, the result is POSTed here instead of being awaited inline
    note: 'returns {contact: {...}} on a hit and a null/empty contact on a miss; a
      miss is NOT charged. The contact object always carries company, job_title, linkedin_url
      and city/region/country keys, but they come back empty or null when Findymail
      has no profile data for the person — only `email`, `name` and `domain` are dependable.
      Note the returned `domain` can be an alias of the one you asked for (stripe.com
      -> stri.pe)'
  docs_url: https://app.findymail.com/docs/
  cost:
    type: per_success
    value: 1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://www.findymail.com/pricing
    checked: '2026-08-20'
    confidence: documented
    note: 1 finder credit, charged only when a deliverable email is returned. Confirmed
      live 2026-08-20 (finder counter fell by exactly 1).
  provides:
  - email
- id: findymail.search.business-profile
  capability: people.contact.find
  name: Find a work email from a LinkedIn profile URL
  summary: Find someone's verified professional email from their public professional-network
    profile URL
  method: POST
  path: /search/business-profile
  input:
    body:
      linkedin_url:
        type: string
        required: true
        note: the person's public professional profile URL
      webhook_url:
        type: string
        required: false
        note: if set, the result is POSTed here instead of being awaited inline
    note: 'same {contact: {...}} response shape as /search/name; a miss is free'
  docs_url: https://app.findymail.com/docs/
  cost:
    type: per_success
    value: 1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://www.findymail.com/pricing
    checked: '2026-08-20'
    confidence: documented
    note: 1 finder credit on a hit; nothing on a miss
  provides:
  - email
- id: findymail.search.domain
  capability: people.search
  name: Find contacts at a domain by role (deprecated)
  summary: Find verified emails for people holding given roles at a company domain
  method: POST
  path: /search/domain
  input:
    body:
      domain:
        type: string
        required: true
        note: the company domain, no protocol or www
      roles:
        type: array[string]
        required: true
        note: roles to look for, e.g. ceo, cto, marketing
      webhook_url:
        type: string
        required: false
        note: if set, the result is POSTed here instead of being awaited inline
    note: 'returns {contacts: [...]}. DEPRECATED in Findymail''s own docs in favour
      of /search/employees, which takes explicit job titles and a result count — prefer
      that one for new work'
  docs_url: https://app.findymail.com/docs/
  cost:
    type: per_result
    value: 1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://www.findymail.com/pricing
    checked: '2026-08-20'
    confidence: documented
    note: 1 finder credit per verified email returned — the number of roles is the
      price dial
- id: findymail.search.employees
  capability: people.search
  name: Find employees at a company by job title
  summary: Find people working at a company website who hold the job titles you name
  method: POST
  path: /search/employees
  input:
    body:
      website:
        type: string
        required: true
        note: the company website or domain
      job_titles:
        type: array[string]
        required: true
        note: job titles to match
      count:
        type: integer
        required: false
        note: how many contacts to return, max 5 — THIS IS THE PRICE DIAL (1 finder
          credit per contact returned)
    note: returns an array of {name, linkedinUrl, companyWebsite, companyName, jobTitle}.
      Always set an explicit small `count`
  docs_url: https://app.findymail.com/docs/
  cost:
    type: per_result
    value: 1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://www.findymail.com/pricing
    checked: '2026-08-20'
    confidence: documented
    note: 1 finder credit per contact found; `count` caps the spend
- id: findymail.search.phone
  capability: people.contact.find
  name: Find a mobile phone number by LinkedIn URL
  summary: Find a person's direct phone number from their public professional profile
    URL
  method: POST
  path: /search/phone
  input:
    body:
      linkedin_url:
        type: string
        required: true
        note: the person's public professional profile URL
    note: returns {phone, line_type}. EU-resident contacts are excluded for GDPR reasons,
      so European targets will miss by policy rather than by coverage
  docs_url: https://app.findymail.com/docs/
  cost:
    type: per_success
    value: 10
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://www.findymail.com/pricing
    checked: '2026-08-20'
    confidence: documented
    note: TEN finder credits per phone found — the most expensive route here by an
      order of magnitude. Nothing is charged on a miss.
  provides:
  - phone
- id: findymail.search.reverse-email
  capability: people.identity.resolve
  name: Reverse email lookup — the person's LinkedIn profile
  summary: Resolve an email address back to the person's professional profile, optionally
    with the full profile
  method: POST
  path: /search/reverse-email
  input:
    body:
      email:
        type: string
        required: true
        note: the email address to resolve
      with_profile:
        type: boolean
        required: false
        note: true returns the enriched profile instead of just the profile URL —
          and DOUBLES the price to 2 credits
    note: returns {linkedin_url} by default, or an extended profile object when with_profile
      is true
  docs_url: https://app.findymail.com/docs/
  cost:
    type: per_success
    value: 1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://app.findymail.com/docs/
    checked: '2026-08-20'
    confidence: documented
    note: 1 finder credit for the profile URL, 2 when with_profile=true. Nothing on
      a miss. The 1-vs-2 split is stated in the API docs, not on the pricing page
      (which only publishes the flat 1 credit = 1 verified email rate).
- id: findymail.search.company
  capability: companies.enrich
  name: Enrich a company by domain, name or LinkedIn URL — size
  summary: Firmographics for a company from its domain, name or professional-network
    URL — size, industry, description
  method: POST
  path: /search/company
  input:
    body:
      domain: stripe.com
    note: supply at least one of domain / name / linkedin_url. Returns {name, domain,
      company_size, industry, linkedin_url, description}
  docs_url: https://app.findymail.com/docs/
  cost:
    type: per_success
    value: 1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://www.findymail.com/pricing
    checked: '2026-08-20'
    confidence: documented
    note: 1 finder credit when a company record is returned; nothing on a miss
- id: findymail.verify
  capability: people.email.verify
  name: Verify an email address is deliverable
  summary: Check whether an email address is deliverable, and which mail provider
    hosts it
  method: POST
  path: /verify
  input:
    body:
      email:
        type: string
        required: true
        note: the address to verify
    note: returns {email, verified, provider} — `provider` names the mailbox host
      (e.g. Google, Microsoft), which is useful for deliverability routing
  docs_url: https://app.findymail.com/docs/
  cost:
    type: per_call
    value: 1
    currency: unit
    per: 1
    unit: verifier_credit
    source: docs
    source_url: https://www.findymail.com/pricing
    checked: '2026-08-20'
    confidence: documented
    note: spends the SEPARATE verifier pool, not finder credits — confirmed live 2026-08-20
      (verifier counter 10 -> 9, finder counter unmoved). Verifier credits are granted
      as a plan bonus with no standalone published price, so this route has no USD
      rate.
  tool: true
- id: findymail.technologies
  capability: companies.tech_stack
  name: Detect a company's tech stack by domain
  summary: The technologies detected on a company's domain, each with category and
    a last-detected timestamp
  method: POST
  path: /technologies
  input:
    body:
      domain:
        type: string
        required: true
        note: company domain, no protocol or www
      technologies:
        type: array[string]
        required: false
        note: restrict the answer to these technology names — use /technologies/search
          (free) to get exact names first
    note: 'returns {domain, technologies: [{name, category, subcategory, last_detected_at}]}.
      The live stripe.com call returned 100+ rows, so filtering with `technologies`
      is worth it when you only care about a few'
  docs_url: https://app.findymail.com/docs/
  cost:
    type: per_success
    value: 1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://www.findymail.com/pricing
    checked: '2026-08-20'
    confidence: documented
    note: 1 finder credit when technologies are returned; nothing when the domain
      is unknown. Confirmed live 2026-08-20.
  tool: true
- id: findymail.technologies.search
  capability: companies.tech_stack.taxonomy
  name: Look up technology names (free)
  summary: Search Findymail's technology taxonomy to get exact technology names, categories
    and subcategories
  method: GET
  path: /technologies/search
  input:
    queryParams:
      q:
        type: string
        required: true
        note: search term, minimum 2 characters
    note: free and rate-limited to 10 requests/minute. Use it to resolve a fuzzy product
      name into the exact string the paid /technologies filter expects
  docs_url: https://app.findymail.com/docs/
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
  tool: true
- id: findymail.lookalike.search
  capability: companies.lookalike
  name: Find lookalike companies from a seed domain
  summary: Build a list of companies that look like a seed company, optionally constrained
    to the same country or size
  method: POST
  path: /lookalike/search
  input:
    body:
      seed:
        type: string
        required: true
        note: the seed company's domain
      same_country:
        type: boolean
        required: false
        note: restrict results to the seed's country
      same_size:
        type: boolean
        required: false
        note: restrict results to the seed's headcount band
      limit:
        type: integer
        required: false
        note: max companies to return, up to 10000 — THIS IS THE PRICE DIAL
      exclusion_list_ids:
        type: array[integer]
        required: false
        note: ids of saved exclusion lists whose domains should be dropped from the
          results
    note: 'returns {companies: [{domain, name, linkedin_url, company_size, country}],
      total, credits_used} — `credits_used` reports the actual charge back to you'
  docs_url: https://app.findymail.com/docs/
  cost:
    type: per_result
    value: 1
    currency: credit
    per: 10
    unit: call
    source: docs
    source_url: https://app.findymail.com/docs/
    checked: '2026-08-20'
    confidence: documented
    note: 1 finder credit per 10 results, rounded up — so the minimum useful call
      is 1 credit. The response echoes `credits_used`.
  tool: true
- id: findymail.intellimatch.search
  capability: companies.search
  name: Start a natural-language company/contact search (async)
  summary: Describe the companies or contacts you want in plain language and start
    a background job that builds the list
  method: POST
  path: /intellimatch/search
  input:
    body:
      query:
        type: string
        required: true
        note: plain-language description of the target list
      limit:
        type: integer
        required: false
        note: max records, up to 5000 — the price dial
      config:
        type: object
        required: false
        note: search configuration; enrichment options here change what is charged
    note: ASYNC — returns {hash}. Poll findymail.intellimatch.status with that hash,
      then read findymail.intellimatch.data. Both of those are free; the whole cost
      is incurred here
  docs_url: https://app.findymail.com/docs/
  cost:
    type: per_result
    value: null
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://app.findymail.com/docs/
    checked: '2026-08-20'
    confidence: unknown
    note: Findymail documents the cost as varying with `limit` and `config` (enrichment
      level) and publishes no single rate, so no value is asserted. Budget by reading
      GET /credits before and after.
  tool: true
- id: findymail.intellimatch.status
  capability: companies.search.status
  name: Check an async search job's progress
  summary: Progress of a natural-language search job — status plus processed, pending
    and failed job counts
  method: GET
  path: /intellimatch/status
  input:
    queryParams:
      hash:
        type: string
        required: true
        note: the hash returned by findymail.intellimatch.search
    note: returns {status, progress, total_jobs, processed_jobs, pending_jobs, failed_jobs}.
      An unknown hash answers HTTP 200 with {"status":"not_found"} rather than a 404
      — check the field, not the status code
  docs_url: https://app.findymail.com/docs/
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
  tool: true
- id: findymail.intellimatch.data
  capability: companies.search.results
  name: Read an async search job's results
  summary: Paginated records produced by a completed natural-language search job
  method: GET
  path: /intellimatch/data
  input:
    queryParams:
      hash:
        type: string
        required: true
        note: the hash returned by findymail.intellimatch.search
      page:
        type: integer
        required: false
        note: 1-based page number
      per_page:
        type: integer
        required: false
        note: records per page, max 500
    note: 'returns {data: [...], meta: {...}}. Free — the job was paid for at search
      time'
  docs_url: https://app.findymail.com/docs/
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
  tool: true
- id: findymail.signals
  capability: companies.signals
  name: Buying signals from your monitors — hiring, job postings
  summary: Signals your monitors have detected — job posts, hiring and other intent
    events, with the company and contact attached
  method: GET
  path: /signals
  input:
    queryParams:
      signal_type:
        type: string
        required: false
        note: restrict to one signal type
      monitor_id:
        type: integer
        required: false
        note: restrict to one monitor
      date_from:
        type: string
        required: false
        note: ISO date lower bound
      date_to:
        type: string
        required: false
        note: ISO date upper bound
      relevance_scores:
        type: string
        required: false
        note: comma-separated relevance scores to keep
      page:
        type: integer
        required: false
      per_page:
        type: integer
        required: false
        note: max 100
    note: only returns rows for monitors YOU created (POST /signals/monitors, free,
      not listed here); an account with no monitors gets an empty data array, which
      is what the live test saw
  docs_url: https://app.findymail.com/docs/
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
  tool: true
- id: findymail.lists
  capability: account.lists
  name: List your saved contact lists
  summary: The contact lists in your own Findymail account, with sharing and ownership
    flags
  method: GET
  path: /lists
  input:
    note: 'no parameters. Returns {lists: [{id, name, created_at, updated_at, shared_with_team,
      is_owner}]}'
  docs_url: https://app.findymail.com/docs/
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
  tool: true
- id: findymail.contacts.get
  capability: account.contacts
  name: Read contacts saved in your account
  summary: The contacts your searches have saved, optionally scoped to one list
  method: GET
  path: /contacts/get/{id}
  input:
    pathParams:
      id:
        type: integer
        required: true
        note: the list id to read, or 0 for every contact in the account
    note: 'returns a DataTables-shaped payload: {draw, recordsTotal, recordsFiltered,
      data: [{id, name, email, linkedin_url, company, job_title}]}. Every contact
      a paid search returned lands here, so this is how you re-read past results without
      paying again'
  docs_url: https://app.findymail.com/docs/
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
  tool: true
- id: findymail.credits
  capability: account.usage
  name: Check your credit balance
  summary: Remaining finder credits and verifier credits on the account behind the
    key
  method: GET
  path: /credits
  input:
    note: no parameters. Returns {credits, verifier_credits, email, id, pricing}.
      `credits` is the finder pool, `verifier_credits` the verification pool — they
      are separate and do not convert
  docs_url: https://app.findymail.com/docs/
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
  tool: true
