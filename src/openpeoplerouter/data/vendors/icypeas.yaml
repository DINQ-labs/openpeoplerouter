vendor: icypeas
name: Icypeas
base_url: https://app.icypeas.com/api
auth:
  kind: header
  name: Authorization
  format: '{secret}'
  credential: ICYPEAS_API_KEY
docs: https://app.icypeas.com
endpoints:
- id: icypeas.people.identity.resolve
  capability: people.identity.resolve
  name: Reverse email lookup — the person's profile URL
  summary: Reverse a professional email address to the person's public professional
    profile URL
  method: POST
  path: /reverse-email-lookup
  input:
    body:
      email:
        type: string
        required: true
        note: a professional (work) email address — personal mailboxes rarely resolve
    note: SYNCHRONOUS — the URL comes back in `result` with status FOUND or NOT_FOUND.
      THE MOST EXPENSIVE ROUTE HERE at 10 credits a hit; resolve in bulk only when
      the profile is genuinely worth it
  docs_url: https://api-doc.icypeas.com/reverse-email-lookup
  cost:
    type: per_success
    value: 10
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
    note: 10 credits per FOUND profile; a miss is free
- id: icypeas.people.search
  capability: people.search
  name: Search people by title, company, skills or location
  summary: Find people by job title, company, seniority, skills, school, location
    or years of experience
  method: POST
  path: /find-people
  input:
    body:
      query:
        type: object
        required: true
        note: 'filter object. Person filters: firstname, lastname, currentJobTitle,
          pastJobTitle, school, languages, skills, location, profileLocation, workLocation,
          keyword — each {include: [...], exclude: [...]}; totalYearsOfExperience
          and timeInCurrentCompany take a range like {">=": 5, "<=": 10}. Company
          filters come in currentCompany*/pastCompany* pairs: currentCompanyName,
          currentCompanyId, currentCompanyWebsite, currentCompanyUrn, currentCompany.type,
          currentCompany.industry, currentCompany.headcount (range), currentCompany.headcountGrowth
          ({min, max, timespan: 6months|12months|24months})'
      pagination:
        type: object
        required: false
        note: '{size, token}. size is 1-200, DEFAULT 100 — and it is the price dial,
          since every row returned costs 0.02 credit. Pass back the `token` from the
          previous response to page'
    note: SYNCHRONOUS — rows arrive in `leads` with the profile, current and past
      employer, location and headline. Locations are best given as alpha-2 country
      codes (FR, US); a comma narrows them ("Paris, France"). ALWAYS size the query
      with icypeas.people.search.count first — that route is free
  docs_url: https://api-doc.icypeas.com/leads-db/find-people
  cost:
    type: per_result
    value: 0.02
    currency: credit
    per: 1
    unit: result
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
    note: 0.02 credit per row returned — 100 results = 2 credits. `pagination.size`
      (max 200) sets the bill
- id: icypeas.people.enrich
  capability: people.enrich
  name: Enrich a person by profile URL — roles, education
  summary: Full professional profile — headline, description, current and past roles,
    education, languages, location
  method: GET
  path: /scrape/profile
  input:
    queryParams:
      url:
        type: string
        required: true
        note: the person's professional profile URL; get one from icypeas.people.profile.url
          if you only have a name
    note: SYNCHRONOUS — the profile arrives in `result`, with `worksFor` (current
      roles) and `alumniOf` (past roles) as arrays. The dearest of the scrape routes
      at 1.5 credits
  docs_url: https://api-doc.icypeas.com/scrape/scrape-profile-scraper
  cost:
    type: per_success
    value: 1.5
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
    note: 1.5 credits per found profile; a URL that resolves to nothing is free
- id: icypeas.companies.search
  capability: companies.search
  name: Search companies by industry, headcount growth or revenue
  summary: Find companies by industry, headcount, headcount growth, revenue, type,
    location or keyword
  method: POST
  path: /find-companies
  input:
    body:
      query:
        type: object
        required: true
        note: 'filter object: name, lid (profile vanity id), urn (numeric id), companyId
          (domain / URN / profile URL / vanity name), type (Privately Held, Public
          Company, Nonprofit, …), industry, location, keyword — each {include: [...],
          exclude: [...]}; headcount and revenue take ranges like {">": 10}; headcountGrowth
          takes {min, max, timespan: 6months|12months|24months}'
      pagination:
        type: object
        required: false
        note: '{size, token}. size is 1-200, default 100, and every row costs 0.02
          credit'
    note: SYNCHRONOUS — rows arrive in `leads` with name, profile id, description,
      headcount, industry, website and specialties. Size it with icypeas.companies.search.count
      first (free)
  docs_url: https://api-doc.icypeas.com/leads-db/find-companies
  cost:
    type: per_result
    value: 0.02
    currency: credit
    per: 1
    unit: result
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
    note: 0.02 credit per row returned — 100 results = 2 credits
- id: icypeas.companies.enrich
  capability: companies.enrich
  name: Enrich a company by profile URL — headcount and growth
  summary: Full company profile — description, headcount and growth, industry, address,
    website, specialties
  method: GET
  path: /scrape/company
  input:
    queryParams:
      url:
        type: string
        required: true
        note: the company's professional profile URL; get one from icypeas.companies.profile.url
          if you only have a domain
    note: SYNCHRONOUS — the company arrives in `result`, including a structured postal
      address and an employee-count history. At 0.5 credit this is the cheapest company
      record in this file
  docs_url: https://api-doc.icypeas.com/scrape/scrape-company-scraper
  cost:
    type: per_success
    value: 0.5
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
    note: 0.5 credit per found company; a miss is free
- id: icypeas.people.email.find
  capability: people.email.find
  name: Find a work email from a name and domain (async)
  summary: Find a single email address from a firstname, a lastname and a company
    domain name
  method: POST
  path: /email-search
  input:
    body:
      firstname:
        type: string
        required: false
        note: can be empty if lastname is set
      lastname:
        type: string
        required: false
        note: can be empty if firstname is set
      domainOrCompany:
        type: string
        required: true
        note: the domain OR the company name of the person
      custom:
        type: object
        required: false
        note: '{webhookUrl, externalId} — a per-search callback URL and your own tracking
          id'
    note: 'ASYNC — returns {item: {_id, status}} only. Feed that _id to icypeas.search.results.read
      to get the address. For more than a handful of people use icypeas.bulk.search
      instead (up to 5,000 rows per call)'
  docs_url: https://api-doc.icypeas.com/find-emails/email-discovery
  cost:
    type: per_result
    value: 1
    currency: credit
    per: 1
    unit: result
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
    note: 1 credit per FOUND email; a search that finds nothing is free
  tool: true
- id: icypeas.people.email.verify
  capability: people.email.verify
  name: Verify an email address is deliverable (async)
  summary: Check whether a specific email address exists and is deliverable, including
    catch-all detection
  method: POST
  path: /email-verification
  input:
    body:
      email:
        type: string
        required: true
        note: the address to verify
      custom:
        type: object
        required: false
        note: '{webhookUrl, externalId}'
    note: ASYNC — read the verdict with icypeas.search.results.read. The result carries
      a `certainty` level (e.g. ultra_sure) plus the MX records and mail provider
      behind the domain
  docs_url: https://api-doc.icypeas.com/find-emails/email-verification
  cost:
    type: per_call
    value: 0.1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
    note: 0.1 credit per address TESTED — charged whether or not the address turns
      out to be valid; ten verifications to a credit
  tool: true
- id: icypeas.companies.emails.role
  capability: companies.emails.role
  name: Find role-based emails at a domain — contact@, support@
  summary: Discover a company's role-based addresses — contact@, support@, info@,
    admin@ and the rest
  method: POST
  path: /domain-search
  input:
    body:
      domainOrCompany:
        type: string
        required: true
        note: the domain OR the company name to scan
      custom:
        type: object
        required: false
        note: '{webhookUrl, externalId}'
    note: ASYNC — read the addresses with icypeas.search.results.read. This finds
      GENERIC mailbox addresses, not named individuals; for a specific person use
      icypeas.people.email.find
  docs_url: https://api-doc.icypeas.com/find-emails/domain-scan
  cost:
    type: per_success
    value: 1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
    note: 1 credit if any email was found for the domain, however many addresses come
      back; nothing when the scan is empty
  tool: true
- id: icypeas.search.results.read
  capability: people.job.results
  name: Read any search's results by id (the poll route)
  summary: Collect the result of any single search, or the rows of a bulk search,
    by id
  method: POST
  path: /bulk-single-searchs/read
  input:
    body:
      id:
        type: string
        required: false
        note: the _id returned by a single search — the usual way to collect one result
      mode:
        type: string
        required: false
        note: '''single'' or ''bulk'' — list your searches instead of naming one id'
      file:
        type: string
        required: false
        note: with mode=bulk, the file id returned by icypeas.bulk.search — returns
          that bulk's rows in input order
      type:
        type: string
        required: false
        note: 'with mode=single, filter by task: email-search | email-verification
          | domain-search. Cannot be combined with mode=bulk'
      limit:
        type: integer
        required: false
        note: rows per page, default 10, MAX 100
      next:
        type: boolean
        required: false
        note: true = next page, false = previous page, used with `sorts`
      sorts:
        type: array
        required: false
        note: the pagination cursor echoed by the previous response — pass it back
          to page further
    note: THE POLL ROUTE, and free. Each row's `status` says where the search got
      to; FOUND / DEBITED mean the payload in `results` is final. Rate limited to
      30 calls/min, so poll a couple of seconds apart or register a webhook instead
  docs_url: https://api-doc.icypeas.com/fetch-results/search-item
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
    note: the rate card prices the search routes; every other route including this
      one is free
  tool: true
- id: icypeas.bulk.search
  capability: people.job.start
  name: Start a bulk email job (up to 5,000 rows)
  summary: Queue up to 5,000 rows of email discovery, email verification or domain
    scanning in one call
  method: POST
  path: /bulk-search
  input:
    body:
      name:
        type: string
        required: true
        note: your label for the job — how you find it later
      task:
        type: string
        required: true
        note: one of email-search | email-verification | domain-search
      data:
        type: array[array[string]]
        required: true
        note: one array per row. email-search rows are [firstname, lastname, domainOrCompany]
          (one of the two names may be empty); email-verification and domain-search
          rows hold a single value. MAX 5,000 rows
      custom:
        type: object
        required: false
        note: '{webhookUrlItem, webhookUrlBulkDone, externalIds, includeResultsInWebhook}
          — per-row and end-of-job callbacks, your own row ids, and whether results
          ride in the final webhook'
    note: 'Returns {file, status: ''in_progress''} immediately. Track it with icypeas.search.files.read
      and collect rows with icypeas.search.results.read using mode=bulk and that file
      id. Rate limited to 1 call/sec'
  docs_url: https://api-doc.icypeas.com/find-emails/bulk-search
  cost:
    type: per_result
    value: 1
    currency: credit
    per: 1
    unit: result
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
    note: the job itself is free to start; each ROW bills at its task's own rate —
      1 credit per found email (email-search), 1 credit per domain with a hit (domain-search),
      0.1 credit per address tested (email-verification). The figure here is the email-search
      rate, the dearest of the three, so a verification job costs a TENTH of what
      this implies
  tool: true
- id: icypeas.search.files.read
  capability: people.job.status
  name: Check bulk job progress
  summary: Progress and stats for your bulk searches — how many rows are done, found,
    aborted or short of credits
  method: POST
  path: /search-files/read
  input:
    body:
      limit:
        type: integer
        required: false
        note: files per request, default 10, MAX 50
      file:
        type: string
        required: false
        note: a single file id, to get just that job's stats
      status:
        type: string
        required: false
        note: '''in_progress'' or ''done'''
      next:
        type: boolean
        required: false
        note: true = next page, false = previous page
      sorts:
        type: array
        required: false
        note: the cursor echoed by the previous response — [{creationDate}] tuples
    note: An empty body {} lists every job. Watch `finished` (or status='done'), then
      collect the rows with icypeas.search.results.read. Rate limited to 15 calls/min
  docs_url: https://api-doc.icypeas.com/fetch-results/bulk-search-files
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
  tool: true
- id: icypeas.people.identity.resolve.bulk
  capability: people.identity.resolve
  name: Reverse up to 50 emails to profile URLs in one call
  summary: Reverse up to 50 professional email addresses to their profile URLs in
    one call
  method: POST
  path: /reverse-email-lookups
  input:
    body:
      data:
        type: array[string]
        required: true
        note: professional email addresses — MINIMUM 2, MAXIMUM 50 per request
    note: 'SYNCHRONOUS — results come back in `data`, one entry per input address,
      in order. Same 10-credit-per-hit rate as the single route, so a full 50-address
      call can cost 500 credits: check the addresses are worth it first'
  docs_url: https://api-doc.icypeas.com/reverse-email-lookup
  cost:
    type: per_result
    value: 10
    currency: credit
    per: 1
    unit: result
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
    note: 10 credits per FOUND profile; addresses that resolve to nothing are free
  tool: true
- id: icypeas.people.search.count
  capability: people.search.count
  name: Count people matching a search (free)
  summary: How many people match a query, before you pay to read any of them
  method: POST
  path: /find-people/count
  input:
    body:
      query:
        type: object
        required: true
        note: identical filter object to icypeas.people.search
    note: FREE and explicitly documented as such. Returns {total, success} — use it
      to tune a query until the count is sane, then spend credits on the rows
  docs_url: https://api-doc.icypeas.com/leads-db/find-people
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
    note: the rate card says retrieving the number of leads matching a query is free
  tool: true
- id: icypeas.companies.search.count
  capability: companies.search.count
  name: Count companies matching a search (free)
  summary: How many companies match a query, before you pay to read any of them
  method: POST
  path: /find-companies/count
  input:
    body:
      query:
        type: object
        required: true
        note: identical filter object to icypeas.companies.search
    note: FREE and explicitly documented as such
  docs_url: https://api-doc.icypeas.com/leads-db/find-companies
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
  tool: true
- id: icypeas.people.profile.url
  capability: people.profile.url
  name: Find a person's profile URL from name and company
  summary: Resolve a name plus a company or job title to that person's professional
    profile URL
  method: POST
  path: /url-search/profile
  input:
    body:
      firstname:
        type: string
        required: true
      lastname:
        type: string
        required: true
      companyOrDomain:
        type: string
        required: false
        note: company name or domain — can be omitted if jobTitle is given
      jobTitle:
        type: string
        required: false
        note: can be omitted if companyOrDomain is given
    note: 'SYNCHRONOUS — {result: <profile URL>, status: FOUND|NOT_FOUND}. This is
      the cheap way into the scrape route: find the URL here, then read the profile
      with icypeas.people.enrich'
  docs_url: https://api-doc.icypeas.com/scrape/user-profile-url-search
  cost:
    type: per_success
    value: 1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
    note: 1 credit per found URL; a miss is free
  tool: true
- id: icypeas.companies.profile.url
  capability: companies.profile.url
  name: Find a company's profile URL from its name or domain
  summary: Resolve a company name or domain to its professional profile URL
  method: POST
  path: /url-search/company
  input:
    body:
      companyOrDomain:
        type: string
        required: true
        note: company name, domain or website
    note: 'SYNCHRONOUS — {result: <company profile URL>, status: FOUND|NOT_FOUND}.
      Pair it with icypeas.companies.enrich to read the profile'
  docs_url: https://api-doc.icypeas.com/scrape/company-profile-url-search
  cost:
    type: per_success
    value: 1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
    note: 1 credit per found URL; a miss is free
  tool: true
- id: icypeas.profile.url.bulk
  capability: people.profile.url
  name: Find up to 50 profile URLs in one call
  summary: Resolve up to 50 people or 50 companies to their professional profile URLs
    in one call
  method: POST
  path: /url-search
  input:
    body:
      type:
        type: string
        required: true
        note: '''profile'' for people or ''company'' for companies — this one field
          decides which shape `data` takes'
      data:
        type: array[object]
        required: true
        note: MAX 50 rows. With type=profile each row is {firstname, lastname, companyOrDomain|jobTitle};
          with type=company each row is {companyOrDomain}
    note: SYNCHRONOUS — `data` comes back one entry per input row, in order. Serves
      BOTH people and companies (hence the single entry); the per-URL price is the
      same either way
  docs_url: https://api-doc.icypeas.com/scrape/user-profile-url-search
  cost:
    type: per_result
    value: 1
    currency: credit
    per: 1
    unit: result
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
    note: 1 credit per found URL, rows that miss are free — so a 50-row call costs
      at most 50 credits
  tool: true
- id: icypeas.scrape.bulk
  capability: people.enrich
  name: Enrich up to 50 profiles or companies by URL in one call
  summary: Read up to 50 people profiles, or up to 50 company profiles, from their
    URLs in one call
  method: POST
  path: /scrape
  input:
    body:
      type:
        type: string
        required: true
        note: '''profile'' for people or ''company'' for companies'
      data:
        type: array[string]
        required: true
        note: profile URLs matching `type`. MAX 50 per request
    note: SYNCHRONOUS — `data` comes back one entry per URL, in order, each with the
      same record shape as the single routes. Serves BOTH people and companies; the
      price follows the type (1.5 credits per profile, 0.5 per company)
  docs_url: https://api-doc.icypeas.com/scrape/scrape-profile-scraper
  cost:
    type: per_result
    value: 1.5
    currency: credit
    per: 1
    unit: result
    source: docs
    source_url: https://api-doc.icypeas.com/how-works/credit-cost
    checked: '2026-08-20'
    confidence: documented
    note: type=profile bills 1.5 credits per found profile, type=company only 0.5
      — the figure here is the dearer of the two, so a company batch costs a third
      of what it implies. Misses are free
  tool: true
