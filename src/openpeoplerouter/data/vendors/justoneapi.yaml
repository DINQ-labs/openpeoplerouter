  input:
    queryParams:
      keyword:
        type: string
        required: true
        note: Search keyword or ASIN to find Amazon products.
      country:
        type: string
        required: false
        enum:
        - US
        - AU
        - BR
        - CA
        - CN
        - FR
        - DE
        - IN
        - IT
        - MX
        - NL
        - SG
        - ES
        - TR
        - AE
        - GB
        - JP
        - SA
        - PL
        - SE
        - BE
        - EG
        - ZA
        - IE
        note: 'Country code for the Amazon marketplace. Available Values: - `US`:
          United States - `AU`: Australia - `BR`: Brazil - `CA`: Canada - `CN`: China
          - `FR`: France - `DE`: Germany - `IN`: India - `IT`: Italy - `MX`: Mexico
          - `NL`: Netherlands - `SG`: Singapore - `ES`: Spain - `TR`: Turkey - `AE`:
          United A One of: US, AU, BR, CA, CN, FR, DE, IN, IT, MX, NL, SG.'
      sortBy:
        type: string
        required: false
        enum:
        - RELEVANCE
        - LOWEST_PRICE
        - HIGHEST_PRICE
        - REVIEWS
        - NEWEST
        - BEST_SELLERS
        note: 'Sort order for Amazon product search results. Available Values: - `RELEVANCE`:
          Relevance - `LOWEST_PRICE`: Lowest Price - `HIGHEST_PRICE`: Highest Price
          - `REVIEWS`: Reviews - `NEWEST`: Newest - `BEST_SELLERS`: Best Sellers One
          of: RELEVANCE, LOWEST_PRICE, HIGHEST_PRICE, REVIEWS, NEWEST, BEST_SELLERS.'
      productCondition:
        type: string
        required: false
        enum:
        - ALL
        - NEW
        - USED
        - RENEWED
        - COLLECTIBLE
        note: 'Product condition filter for Amazon search results. Available Values:
          - `ALL`: All product conditions - `NEW`: New products - `USED`: Used products
          - `RENEWED`: Renewed products - `COLLECTIBLE`: Collectible products One
          of: ALL, NEW, USED, RENEWED, COLLECTIBLE.'
      isPrime:
        type: boolean
        required: false
        note: Whether to return only Prime-eligible products.
      dealsAndDiscounts:
        type: string
        required: false
        enum:
        - NONE
        - ALL_DISCOUNTS
        - TODAYS_DEALS
        note: 'Deals and discounts filter for Amazon search results. Available Values:
