- id: lusha.people.contacts.enrich
  capability: people.enrich
  name: Reveal emails and phone numbers for found contact ids
  summary: Reveal emails and phone numbers for contacts you already found in a prospecting
    search
  method: POST
  path: /v3/contacts/enrich
  input:
    bodyType: json
    body:
      ids:
        type: array[string]
        required: true
        note: '1-100 ids from a prospecting search — CORRECTED at verify time: the
          field is `ids`, not `contactIds` as the doc prose paraphrases it. Each revealed
          datapoint is billed, so send only the ids you want'
      reveal:
        type: array[string]
        required: false
        note: emails | phones | both — the price dial
      waterfallReveal:
        type: array[string]
        required: false
        note: subset of `reveal` Lusha may source from third-party providers when
          its own data misses
      tableId:
        type: string
        required: false
        note: persist the results into a Lusha Table
    note: 'the paid half of the prospecting flow, and the endpoint that makes Lusha''s
      pricing legible: cost scales with ids x datapoints revealed'
  docs_url: https://docs.lusha.com/apis/openapi/enrichment
  cost:
    type: per_result
    value: 1
    currency: credit
    per: 1
    unit: result
    source: observed
    source_url: https://www.lusha.com/pricing/
    checked: '2026-07-31'
    confidence: verified
    note: 'billed per revealed datapoint across the batch, email and phone charged
      separately. OBSERVED live 2026-07-28: revealing the email of one id reported
      billing.creditsCharged 1. A PHONE COSTS FIVE TIMES THAT — the live rate card
      (GET /v3/account/usage.pricing) gives revealEmail 1 per 1 and revealPhone 5
      per 1, re-read 2026-07-31, so `reveal: ["phones"]` on a 100-id batch is a 500-credit
      call. Unlike the search-and-enrich routes this one charges the reveal only,
      because the search was already paid for by the prospecting call.'
  tool: true
- id: lusha.account.usage
  capability: account.usage
  name: Check account credit balance and usage
  summary: See the Lusha plan's credit balance, usage so far and reset date (free)
  method: GET
  path: /v3/account/usage
  input:
    note: no parameters — the key rides in the api_key header. Returns credits {total,
      used, remaining}, rateLimits (daily/hourly/minute), the plan, AND a `pricing`
      object giving the per-action credit cost for this plan — the authoritative source
      for what the other five endpoints cost. Call it before budgeting a batch. Rate-limited
      to 5 req/min; Lusha's migration guide also writes the route unversioned as /account/usage
  docs_url: https://docs.lusha.com/apis/openapi/account-usage-api/get-account-usage
