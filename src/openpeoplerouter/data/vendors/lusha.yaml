  docs_url: https://docs.lusha.com/apis/openapi/webhooks/listsubscriptions
  tier: extended
  tool: true
- id: lusha.x.webhook-subscriptions-create
  capability: lusha.tools
  name: Create webhook subscriptions
  summary: Create one or more webhook subscriptions (bulk, up to 25 per request) that
    deliver signal events to your endpoint
  method: POST
  path: /api/subscriptions
  input:
    bodyType: json
    body:
      defaults:
        type: object
        required: false
        note: shared entityType/signalTypes/url applied to every subscription entry
          that omits its own
      subscriptions:
        type: array[object]
        required: true
        note: up to 25 per request; each needs entityId (a real contact or company
          id owned by this account) plus name; entityType/signalTypes/url come from
          `defaults` unless overridden per entry
    note: deliveries are signed with HMAC-SHA256 (X-Lusha-Signature, X-Lusha-Timestamp)
      and must be acknowledged within 10s with a 2xx + {received, timestamp, webhookId}
      body. NOT free-standing — each subscription is bound to one entityId, so it
      needs a real contact/company id on hand (e.g. from lusha.companies.search)
  docs_url: https://docs.lusha.com/apis/openapi/webhooks
  tier: extended
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    note: webhook management is not metered against the data-credit balance
  tool: true
