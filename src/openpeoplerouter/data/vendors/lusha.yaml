vendor: lusha
name: Lusha
base_url: https://api.lusha.com
auth:
  kind: header
  name: api_key
  format: '{secret}'
  credential: LUSHA_API_KEY
docs: https://dashboard.lusha.com/api
endpoints:
- id: lusha.people.enrich
  capability: people.enrich
  name: Find a person's work email and phone by LinkedIn or name
  summary: Enrich a person — work email, direct dial and mobile — from email, LinkedIn
    or name
  method: POST
  path: /v3/contacts/search-and-enrich
  input:
    bodyType: json
    body:
      contacts:
        type: array[object]
        required: true
        note: the people to look up, each identified by email, linkedinUrl, or firstName
          + lastName + companyName|companyDomain
      reveal:
        type: array[string]
        required: false
        note: 'which datapoints to unlock: emails, phones, or both — EACH REVEALED
          DATAPOINT IS BILLED, so ask only for what you need'
      waterfallReveal:
        type: array[string]
        required: false
        note: datapoints Lusha may fall through to third-party providers for when
          its own data misses; costs more
    note: the v3 replacement for the old GET /v2/person. Lusha's differentiator is
      verified DIRECT-DIAL and MOBILE numbers, not just emails — which is also why
      phones cost more than emails
  docs_url: https://docs.lusha.com/apis/openapi/enrichment
  cost:
    type: per_result
    value: 2
    currency: credit
    per: 1
    unit: result
    source: rate_card_api
    source_url: https://www.lusha.com/pricing/
    checked: '2026-08-13'
    confidence: verified
    note: 'VERIFIED live 2026-08-13. The live rate card (GET /v3/account/usage.pricing)
      prices contactSearch at 1 credit per 25 results and revealEmail at 1 per 1,
      so a fresh single-contact email enrich = 1 search + 1 reveal = 2 credits — confirmed
      by a fresh match reporting billing.creditsCharged 2 (resultsReturned 1). A phone
      reveal is +5 (revealPhone 5 per 1), an email +1. A contact Lusha cannot match
      is free (billing.creditsCharged 0, re-observed 2026-08-13). CAVEAT: re-revealing
      a contact already revealed to this account recently is discounted (an immediate
      repeat charged 1, not 2); value 2 is the fresh/upper-bound cost.'
- id: lusha.people.search
  capability: people.search
  name: Search people by title, company or intent (free preview)
  summary: Search Lusha's contacts by title, seniority, company, location or intent
    (free preview)
  method: POST
  path: /v3/contacts/prospecting
  input:
    bodyType: json
    body:
      pages:
        type: object
        required: true
        note: '{page: <0-based>, size: <up to 40>} — keep size small'
      filters:
        type: object
        required: true
        note: 'nested contact and company filters: job titles, seniority, departments,
          locations, company size, revenue, industry, technologies, intent topics
          and signals. GET /v3/contacts/prospecting/filters/{filterType} enumerates
          the accepted values for each filter'
    note: 'returns a requestId plus contact ids and NON-PII previews — this step is
      free. Feed the ids to lusha.people.contacts.enrich to spend credits only on
      the ones worth revealing. CORRECTED at verify time: the pagination field is
      `pagination` (min size 10), not `pages`, and it DOES consume 1 credit (contactSearch,
      per 25 results) despite the docs prose calling it a ''free preview'' — see cost
      block below.'
  docs_url: https://docs.lusha.com/apis/openapi/prospecting-search-and-enrich
  cost:
    type: per_result
    value: 1
    currency: credit
    per: 25
    unit: result
    source: observed
    checked: '2026-07-31'
    confidence: verified
    note: 'OBSERVED live 2026-07-28: billing.creditsCharged 1 for 10 results — 1 credit
      per up to 25 results (pricing.contactSearch), NOT free as the prose on this
      endpoint''s docs page claims. Re-confirmed 2026-07-31 against the live rate
      card (contactSearch: {credits: 1, perQuantity: 25}). Verify against GET /v3/account/usage.pricing
      before trusting the docs text on any Lusha endpoint'
- id: lusha.companies.enrich
  capability: companies.enrich
  name: Enrich a company by domain or name — headcount, funding
  summary: Enrich a company from domain or name — industry, headcount, revenue, funding,
    tech
  method: POST
  path: /v3/companies/search-and-enrich
  input:
    bodyType: json
    body:
      companies:
        type: array[object]
        required: true
        note: the companies to look up, each identified by domain (preferred), name,
          or Lusha company id
    note: the v3 replacement for the old GET /v2/company. Pass domains rather than
      names wherever you have them — a name alone is ambiguous. POST /v3/companies/enrich
      takes companyIds (max 100) when you already hold ids from a prospecting search
  docs_url: https://docs.lusha.com/apis/openapi/company-search-and-enrich
  cost:
    type: per_success
    value: 2
    currency: credit
    per: 1
    unit: call
    source: observed
    source_url: https://www.lusha.com/pricing/
    checked: '2026-07-31'
    confidence: verified
    note: 'TWO credits per company record returned, not one. OBSERVED live 2026-07-31:
      one domain in, one result out, billing.creditsCharged 2. The rate card lists
      revealCompany at 1 per 1, so search-and-enrich evidently bills the search (companySearch)
      AND the reveal — which means the rate card UNDER-STATES this route by half,
      and the two-step path (prospecting, then POST /v3/companies/enrich on the ids
      you keep) is the cheaper one when you already hold ids. A no-match is free,
      as on the contact side.'
- id: lusha.companies.search
  capability: companies.search
  name: Search companies by industry or tech (free preview)
  summary: Search Lusha's companies by industry, headcount, revenue or tech (free
    preview)
  method: POST
  path: /v3/companies/prospecting
  input:
    bodyType: json
    body:
      pages:
        type: object
        required: true
        note: '{page: <0-based>, size: <up to 40>}'
      filters:
        type: object
        required: true
        note: company filters — industry, size, revenue, location, technologies, signals.
          GET /v3/companies/prospecting/filters/{filterType} enumerates the accepted
          values
    note: 'same two-step shape as the contact side: free ids and previews here, credits
      spent by POST /v3/companies/enrich on the ids you keep. CORRECTED at verify
      time: pagination field is `pagination` (min size 10) not `pages`; filters.companies.include
      has no `industries` key (real fields per the OpenAPI schema: domains, names,
      ids, sizes, revenues, mainIndustriesIds, technologies, locations, sicCodes,
      naicsCodes, signals). It ALSO consumes 1 credit like the contact side (companySearch)
      despite being called free preview in the prose.'
  docs_url: https://docs.lusha.com/apis/openapi/prospecting-search-and-enrich/searchprospectingcompanies
  cost:
    type: per_result
    value: 1
    currency: credit
    per: 25
    unit: result
    source: observed
    checked: '2026-07-31'
    confidence: verified
    note: 'OBSERVED live 2026-07-28: billing.creditsCharged 1 for 1 result — 1 credit
      per up to 25 results (pricing.companySearch), not free as the docs prose claims.
      Re-confirmed 2026-07-31 against the live rate card (companySearch: {credits:
      1, perQuantity: 25}), so a size=10 page and a size=25 page cost the same: page
      in 25s'
- id: lusha.x.contacts-prospecting-filters
