    pathParams:
      filterType:
        type: string
        required: true
        note: 'which filter''s accepted values to list. CORRECTED at verify time from
          the real OpenAPI bundle (https://docs.lusha.com/_bundle/apis/@v3/openapi.yaml,
          unreachable from the client-rendered reference pages): the enum is departments
          | seniority | existingDataPoints | countries | locations (locations additionally
          requires a `query` param)'
    note: companion to POST /v3/contacts/prospecting — call this first to know what
      to pass into filters.contacts.include/exclude
