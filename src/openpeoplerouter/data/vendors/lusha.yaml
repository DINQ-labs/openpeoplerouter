- id: lusha.x.contacts-lookalike
  capability: people.lookalike
  name: Find lookalike contacts from 5-100 seed contacts
  summary: AI-powered recommendations for contacts who share similar roles, seniority
    and company profile to 5-100 seed contacts
  method: POST
  path: /v3/contacts/lookalike
  input:
    bodyType: json
    body:
      seeds:
        type: object
        required: true
        note: 'CORRECTED at verify time from the real OpenAPI bundle: seeds is a single
          object {linkedinUrls, contacts, emails, ids}, NOT an array of per-seed objects.
          Combined items across the sub-arrays must total 5-100'
      exclude:
        type: object
        required: false
        note: same ContactIdentifiersBatch shape as seeds
      dedupeSessionId:
        type: string
        required: false
        note: omit on the first call — Lusha generates one and returns it; reuse it
          for 'get more' pagination (retained 30 days)
      limit:
