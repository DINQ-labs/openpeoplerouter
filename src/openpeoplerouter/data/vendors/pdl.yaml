      first_name:
        type: string
        required: false
      last_name:
        type: string
        required: false
      middle_name:
        type: string
        required: false
      location:
        type: string
        required: false
      street_address:
        type: string
        required: false
      locality:
        type: string
        required: false
      region:
        type: string
        required: false
      country:
        type: string
        required: false
      postal_code:
        type: string
        required: false
      company:
        type: string
        required: false
      school:
        type: string
        required: false
      phone:
        type: string
        required: false
      email:
        type: string
        required: false
      email_hash:
        type: string
        required: false
      profile:
        type: string
        required: false
      lid:
        type: string
        required: false
      birth_date:
        type: string
        required: false
      min_likelihood:
        type: integer
        required: false
      required:
        type: string
        required: false
      titlecase:
        type: boolean
        required: false
      data_include:
        type: string
        required: false
        note: comma-separated response field list, e.g. 'names.clean,emails.address'
