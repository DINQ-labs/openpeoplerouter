  docs_url: https://docs.peopledatalabs.com/docs/reference-identify-api
  tier: extended
  cost:
    type: per_success
    value: 1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://www.peopledatalabs.com/pricing
