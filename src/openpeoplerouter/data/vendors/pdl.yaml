    confidence: documented
    note: flat 1 credit per call regardless of profiles returned; PDL does not publish
      a flat $/credit
- id: pdl.people.enrich
  capability: people.enrich
  name: Enrich a person by email, LinkedIn or name + company
  summary: Enrich a person from email, LinkedIn or name + company — job history, skills,
    contact
  method: GET
  path: /person/enrich
  input:
    queryParams:
      email:
        type: string
        required: false
        note: strongest single identifier
      phone:
        type: string
        required: false
        note: E.164 preferred
      profile:
        type: string
        required: false
        note: social profile URL — LinkedIn, GitHub, Twitter, Facebook
      lid:
        type: string
        required: false
        note: LinkedIn numeric profile id
      email_hash:
        type: string
        required: false
        note: MD5 or SHA-256 of the email, when you cannot send it in the clear
      name:
        type: string
        required: false
        note: full name; use with company or location to disambiguate
      first_name:
        type: string
        required: false
      last_name:
        type: string
        required: false
      company:
        type: string
        required: false
        note: employer name or domain
      school:
        type: string
        required: false
      location:
        type: string
        required: false
        note: free-text location of the person
      country:
        type: string
        required: false
      min_likelihood:
        type: integer
        required: false
        note: 1-10 match-confidence floor; PDL returns 404 below it. 6+ is the usual
          production setting
      required:
        type: string
        required: false
        note: fields the response must contain or it is treated as a miss, e.g. 'emails
          AND profiles'
      titlecase:
        type: boolean
        required: false
      pretty:
        type: boolean
        required: false
    note: 'PDL''s minimum-input rule, verbatim: profile OR email OR phone OR email_hash
      OR lid OR ((first_name AND last_name, or name) AND (locality OR region OR company
      OR school OR location OR postal_code)). A bare name is never enough on its own'
  docs_url: https://docs.peopledatalabs.com/docs/reference-person-enrichment-api
  miss:
    status: 404
    means: no person matched (or none above min_likelihood) — an expected outcome
      (and free, per the cost note), not an API failure; do not retry the same identifiers
  cost:
    type: per_success
    value: 1
    currency: credit
    per: 1
    unit: call
    source: observed
    source_url: https://www.peopledatalabs.com/pricing
    checked: '2026-07-31'
    confidence: verified
    note: 1 PDL credit per person returned (HTTP 200); a 404 is free. OBSERVED live
      2026-07-31 - the response carried x-call-credits-spent 1 and x-call-credits-type
      enrich. Enriching the same person twice costs 2 credits, PDL does not de-duplicate.
      cost.usd stays null because there is no public $/credit - the rate is plan-negotiated
      - so this is a verified CREDIT count, not a verified dollar figure.
- id: pdl.companies.enrich
  capability: companies.enrich
  name: Enrich a company by website, name or ticker
  summary: Enrich a company from website, name or ticker — industry, size, founded,
    location
  method: GET
  path: /company/enrich
  input:
    queryParams:
      website:
        type: string
        required: false
        note: company domain — the strongest identifier
      name:
        type: string
        required: false
        note: company name; ambiguous on its own, pair with location
      profile:
        type: string
        required: false
        note: LinkedIn company URL
      ticker:
        type: string
        required: false
        note: stock ticker for public companies
      location:
        type: string
        required: false
        note: free-text HQ location, to disambiguate a name
      locality:
        type: string
        required: false
      region:
        type: string
        required: false
      country:
        type: string
        required: false
      street_address:
        type: string
        required: false
      postal_code:
        type: string
        required: false
      min_likelihood:
        type: integer
        required: false
        note: 1-10 match-confidence floor; defaults to 2 here, lower than you might
          expect
      pretty:
        type: boolean
        required: false
    note: at least one of pdl_id | name | website | ticker | profile (pdl_id overrides
      the rest); website gives the highest match rate. The other fields only disambiguate
  docs_url: https://docs.peopledatalabs.com/docs/reference-company-enrichment-api
  cost:
    type: per_success
    value: 1
    currency: credit
    per: 1
    unit: call
    source: docs
    source_url: https://www.peopledatalabs.com/pricing
    checked: '2026-07-28'
    confidence: documented
    note: 1 PDL credit per company returned; a 404 is free.
- id: pdl.companies.search
  capability: companies.search
  name: Search companies by industry, headcount or location
  summary: Search PDL companies by industry, headcount, location or tags — pays per
    record
  method: GET
  path: /company/search
  input:
    queryParams:
      sql:
        type: string
        required: false
        note: SQL WHERE clause over the Company schema, e.g. "SELECT * FROM company
          WHERE industry='computer software' AND size='51-200'"
      query:
        type: string
        required: false
        note: Elasticsearch JSON query — the alternative to sql
      size:
        type: integer
        required: false
        note: records to return, 1-100, default 1 — you pay 1 credit per record
      scroll_token:
        type: string
        required: false
        note: cursor from the previous response
      titlecase:
        type: boolean
        required: false
      pretty:
        type: boolean
        required: false
    note: exactly one of sql | query. Unlike person search, company search caps `size`
      at 100 on BOTH methods, and the spec does not offer scroll_token here. Rate
      limit 10 req/min
  docs_url: https://docs.peopledatalabs.com/docs/reference-company-search-api
  cost:
    type: per_result
    value: 1
    currency: credit
    per: 1
    unit: record
    source: observed
    source_url: https://www.peopledatalabs.com/pricing
    checked: '2026-07-31'
    confidence: verified
    note: '1 PDL credit PER RECORD returned; `size` is the cost dial. OBSERVED live
      2026-07-31 - a size=1 call returning 1 record carried x-call-credits-spent 1,
      x-call-credits-type search_company, and left the enrich allowance (x-totallimit-remaining)
      untouched: search bills a different meter.'
