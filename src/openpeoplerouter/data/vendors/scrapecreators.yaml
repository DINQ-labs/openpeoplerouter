- id: scrapecreators.x.v1-facebook-adlibrary-company-ads
  capability: meta-ads.library.advertiser
  name: Facebook ad library company ads by page id or name
  summary: Fetches all ads currently running for a specific company from the Meta
    Ad Library.
  method: GET
  path: /v1/facebook/adLibrary/company/ads
  input:
    queryParams:
      pageId:
        type: string
        required: false
        note: The companies ad library page id. You can get this with my Search For
          Companies Endpoint. Can either use this or companyName
      companyName:
        type: string
        required: false
        note: The name of the company. Can either use this or pageId
      country:
        type: string
        required: false
        note: This can only be one country. It has to be the 2 letter code for the
          country. It defaults to ALL.
      status:
        type: string
        required: false
        note: Status of the ad. Defaults to ACTIVE.
      media_type:
        type: string
        required: false
        note: Media type of the ad. Defaults to ALL. Meme refers to ads with image
          and text. Not sure why they call it meme.
      language:
        type: string
        required: false
        note: Language to filter ads on. Needs to be 2 letter language code, ie EN,
          ES, FR, etc
      sort_by:
        type: string
        required: false
        note: Sort by impressions (high to low), or Most Recent (relevancy_monthly_grouped).
          Defaults to impressions.
      start_date:
        type: string
        required: false
        note: 'Start date to search for. Format: YYYY-MM-DD'
      end_date:
        type: string
        required: false
        note: 'End date to search for. Format: YYYY-MM-DD'
      cursor:
        type: string
        required: false
        note: Cursor to paginate through results
      trim:
        type: boolean
        required: false
        note: Set to true for a trimmed down version of the response
