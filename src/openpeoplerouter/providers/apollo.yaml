id: apollo
title: Apollo
about: B2B database of people and companies, with search, enrichment, emails and phone numbers.
site: https://www.apollo.io
docs: https://docs.apollo.io/reference/apollo-api
pricing: https://docs.apollo.io/docs/api-pricing
api: https://api.apollo.io/api/v1
key:
  env: APOLLO_API_KEY
  header: x-api-key
operations:
  people-enrichment:
    title: People enrichment
    about: Match one person by email, LinkedIn URL, name with employer, or Apollo id. Reveal flags unlock personal
      emails and phones.
    request: POST /people/match
    docs: https://docs.apollo.io/reference/people-enrichment
    params:
      first_name:
        about: 'The first name of the person. This is typically used in combination with the last_name parameter.
          Example: jordan'
      last_name:
        about: 'The last name of the person. This is typically used in combination with the first_name parameter.
          Example: blake'
      name:
        about: The full name of the person. This will typically be a first name and last name separated by a space.
          If you use this parameter, you do not need to use the first_name and last_name parameters.…
      email:
        about: 'The email address of the person. Example: jordan@ymail.org'
      hashed_email:
        about: 'The hashed email of the person. The email should adhere to either the MD5 or SHA-256 hash format.
          Example: 8d935115b9ff4489f2d1f9249503cadf (MD5) or…'
      organization_name:
        about: 'The name of the person''s employer. This can be the current employer or a previous employer. Example:
          northstar analytics'
      domain:
        about: 'The domain name for the person''s employer. This can be the current employer or a previous employer.
          Do not include www., the @ symbol, or similar. Example: apollo.io or microsoft.com'
      id:
        about: The Apollo ID for the person. Each person in the Apollo database is assigned a unique ID. To find
          IDs, call the people API search endpoint and identify the values for person_id. Example:…
      linkedin_url:
        about: 'The URL for the person''s LinkedIn profile. Example: https://www.linkedin.com/in/jordan-blake-4a7c21'
      run_waterfall_email:
        type: boolean
        about: Set to true to enable email waterfall enrichment
      run_waterfall_phone:
        type: boolean
        about: Set to true to enable phone waterfall enrichment
      reveal_personal_emails:
        type: boolean
        about: Set to true if you want to enrich the person's data with personal emails. This potentially consumes
          credits as part of your Apollo pricing plan. The default value is false. If a person resides in a…
      reveal_phone_number:
        type: boolean
        about: Set to true if you want to enrich the person's data with all available phone numbers, including mobile
          phone numbers. This potentially consumes credits as part of your Apollo pricing plan. The…
      webhook_url:
        about: If you set the reveal_phone_number parameter to true, this parameter becomes mandatory. Otherwise,
          do not use this parameter. Enter the webhook URL that specifies where Apollo should send a JSON…
      poll_only:
        type: boolean
        about: Set to true to receive phone or waterfall enrichment results by polling instead of a webhook. When
          poll_only is true, omit webhook_url — Apollo returns a request_id you can pass to the poll webhook…
    price:
      credits: 1
      per: success
      note: 1 credit for profile and email
      8 more when a mobile phone is returned: null
    jobs:
      enrich_person:
        needs:
        - - email
        - - linkedin_url
        - - full_name
          - company_domain
        - - full_name
          - company
        send:
          email: email
          linkedin_url: linkedin_url
          full_name: name
          company_domain: domain
          company: organization_name
        result: person
        fields:
          name: name
          first_name: first_name
          last_name: last_name
          title: title
          headline: headline
          company: organization.name
          company_domain: organization.primary_domain
          location: join(', ', [city, state, country][?@])
          country: country
          linkedin_url: linkedin_url
          email: email
          image: photo_url
          experience: employment_history
      find_contact:
        needs:
        - - linkedin_url
        - - full_name
          - company_domain
        - - full_name
          - company
        send:
          linkedin_url: linkedin_url
          full_name: name
          company_domain: domain
          company: organization_name
        result: person
        fields:
          email: email
          email_status: email_status
          name: name
          title: title
          company_domain: organization.primary_domain
  bulk-people-enrichment:
    title: Bulk people enrichment
    about: Up to 10 people per request, same matching and credits as single enrichment.
    request: POST /people/bulk_match
    params:
      run_waterfall_email:
        type: boolean
        about: Set to true to enable email waterfall enrichment
      run_waterfall_phone:
        type: boolean
        about: Set to true to enable phone waterfall enrichment
      reveal_personal_emails:
        type: boolean
        about: Set to true if you want to enrich all matched people with personal emails. This potentially consumes
          credits as part of your Apollo pricing plan. The default value is false. If a person resides in a…
      reveal_phone_number:
        type: boolean
        about: Set to true if you want to enrich the data of all matched people with all available phone numbers,
          including mobile phone numbers. This potentially consumes credits as part of your Apollo pricing…
      webhook_url:
        about: If you set the reveal_phone_number parameter to true, this parameter becomes mandatory. Otherwise,
          do not use this parameter. Enter the webhook URL that specifies where Apollo should send a JSON…
      poll_only:
        type: boolean
        about: Set to true to receive phone or waterfall enrichment results by polling instead of a webhook. When
          poll_only is true, omit webhook_url — Apollo returns a request_id you can pass to the poll webhook…
      details:
        in: body
        type: array
        required: true
        about: Provide info for each person you want to enrich as an object within this array. Add up to 10 people.
    price:
      credits: 1
      per: success
      note: per person matched
  organization-enrichment:
    title: Organization enrichment
    about: One company by domain, LinkedIn URL or website.
    request: GET /organizations/enrich
    docs: https://docs.apollo.io/reference/organization-enrichment
    params:
      domain:
        about: The domain of the company that you want to enrich. Do not include www., the @ symbol, or similar.
