      linkedin_url:
        about: The URL for the company's LinkedIn profile. Use domain, linkedin_url, or website to identify the
          company. You can also provide name to improve match accuracy. Example:…
      name:
        about: 'The name of the company that you want to enrich. Provide this with domain, linkedin_url, or website
          to improve match accuracy. Example: apollo'
      website:
        about: The full website URL of the company that you want to enrich. Use domain, linkedin_url, or website
          to identify the company. You can also provide name to improve match accuracy. Example:…
    price:
      credits: 1
      per: success
    jobs:
      enrich_company:
        needs:
        - - domain
        - - linkedin_url
        send:
          domain: domain
          linkedin_url: linkedin_url
        result: organization
        fields:
          name: name
          domain: primary_domain
          website: website_url
          description: short_description
          industry: industry
          employees: estimated_num_employees
          founded: founded_year
          location: join(', ', [city, state, country][?@])
          country: country
          linkedin_url: linkedin_url
          logo: logo_url
          technologies: technology_names
          revenue: annual_revenue
          funding: total_funding
  bulk-organization-enrichment:
    title: Bulk organization enrichment
    about: Up to 10 companies by domain per request.
    request: POST /organizations/bulk_enrich
    params:
      domains[]:
        type: array
        about: The domain of each company that you want to enrich. Do not include www., the @ symbol, or similar.
          Use this parameter to match companies by domain only. To match by LinkedIn URL, name, or website in…
      details:
