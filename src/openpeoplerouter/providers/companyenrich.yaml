  people-search:
    title: Search
    about: 'Cost: 2 credits per person returned. 2 credits minimum if no results are found. Notice: Up to 10.000
      results can be returned from this endpoint (page * pageSize can not exceed 10.000). If you need…'
    request: POST /people/search
    params:
      expand:
        type: array
        about: 'Expandable response fields. Repeat the parameter to request multiple expansions. Supported values:
          - education: costs 1 credit per person and adds the education field to PersonInfo.'
      page:
        in: body
        type: integer
        about: The page number to return. Must be greater than 0
      pageSize:
        in: body
        type: integer
        about: The number of results to return in each page. Must be between 1 and 100
      companyFilter:
        in: body
        type: object
        about: The filters to be applied on the companies to find people for
      query:
        in: body
        about: The search query to apply on the company name and domain
      positionQuery:
        in: body
        type: array
        about: The list of search queries to apply on the person's current job position/title
      atCurrentCompanyAfter:
        in: body
        about: Filter by current company join date - only include people who joined after this UTC date
      atCurrentCompanyBefore:
        in: body
        about: Filter by current company join date - only include people who joined before this UTC date
      atCurrentPositionAfter:
        in: body
        about: Filter by current position start date - only include people who started after this UTC date
      atCurrentPositionBefore:
        in: body
        about: Filter by current position start date - only include people who started before this UTC date
      exclude:
        in: body
        type: object
        about: Exclusion filters to apply on the people. If a person matches any of the filters here, it will be
          excluded from the results.
      countries:
        in: body
        type: array
        about: The 2 letter country codes to filter by
      domains:
        in: body
        type: array
        about: The domains to find people for. Up to 2,500 domains are allowed.
      seniority:
        in: body
