id: companyenrich
title: CompanyEnrich
about: Company enrichment, search and lookalikes, plus people search, person lookup by email and work emails.
site: https://companyenrich.com
docs: https://docs.companyenrich.com
pricing: https://companyenrich.com/pricing
api: https://api.companyenrich.com
key:
  env: COMPANYENRICH_API_KEY
  bearer: true
operations:
  companies-autocomplete:
    title: Autocomplete
    about: 'Cost: FREE - No credits deducted Returns a list of companies matching the given partial domain name.
      This is useful for autocompleting domain names in your application. Up to 10 companies are…'
    request: GET /companies/autocomplete
    params:
      query:
        required: true
        about: The query to autocomplete
    price:
      credits: 1
      per: call
  companies-enrich-bulk:
    title: Get job status
    about: 'Cost: FREE - No credits deducted Returns the current status of a bulk enrichment job. Once completed,
      includes the results_url to download the enrichment results.'
    request: GET /companies/enrich/bulk/{jobId}
    params:
      jobId:
        in: path
        required: true
    price:
      credits: 1
      per: call
  enrich-bulk-jobs:
    title: List jobs
    about: 'Cost: FREE - No credits deducted Returns a paginated list of all bulk enrichment jobs for the authenticated
      user. Supports optional filtering by job status.'
    request: GET /companies/enrich/bulk/jobs
    params:
      page:
        type: integer
        about: 'Page number (default: 1).'
      pageSize:
        type: integer
        about: 'Number of items per page (default: 20, max: 100).'
      status:
        choices:
        - pending
        - processing
        - completing
        - completed
        - failed
        - null
        about: Filter jobs by status.
    price:
      credits: 1
      per: call
  companies-enrich:
    title: Enrich by domain
    about: 'Cost: 1 credit per call Enriches a company using its domain name as lookup parameter. We map each domain
      to a unique company so lookups via domain are fast and reliable. It is the preferred way to…'
    request: GET /companies/enrich
    params:
      domain:
        required: true
      expand:
        type: array
        about: 'Expandable response fields. Repeat the parameter to request multiple expansions. Supported values:
          - workforce: costs 5 credits per company and adds the workforce field to CompanyInfo.'
      waitForEnrichment:
        type: boolean
        about: Whether to wait for on-demand enrichment when the company is not stored yet. When false, stored company
          data is returned immediately; a company that is not stored yet results in a 404 without…
    price:
      credits: 1
      per: call
    not_found: 404
    jobs:
      enrich_company:
        needs:
        - - domain
        send:
          domain: domain
        result: '@'
        fields:
          name: name
          domain: domain
          website: website
          description: description
          industry: industry
          employees: employees
          founded: founded_year
          location: join(', ', [location.city.name, location.country.name][?@])
          country: location.country.code
          linkedin_url: socials.linkedin_url
          logo: logo_url
          technologies: technologies
          revenue: revenue
          funding: financial.total_funding
  post-companies-enrich:
    title: Enrich by properties
    about: 'Cost: 1 credit per call Enriches a company using its properties. You need to provide at least one of
      the following properties: - Name - LinkedinUrl - LinkedinId - TwitterUrl - FacebookUrl -…'
    request: POST /companies/enrich
    params:
      expand:
        type: array
        about: 'Expandable response fields. Repeat the parameter to request multiple expansions. Supported values:
          - workforce: costs 5 credits per company and adds the workforce field to CompanyInfo.'
      name:
        in: body
        about: The name of the company to enrich
      linkedinUrl:
        in: body
        about: The LinkedIn URL of the company to enrich
      linkedinId:
        in: body
        about: The LinkedIn ID of the company to enrich
      twitterUrl:
        in: body
        about: The Twitter URL of the company to enrich
      facebookUrl:
        in: body
        about: The Facebook URL of the company to enrich
      instagramUrl:
        in: body
        about: The Instagram URL of the company to enrich
      youTubeUrl:
        in: body
        about: The YouTube URL of the company to enrich
    price:
      credits: 1
      per: call
  companies-search-async:
    title: Get export job status
    about: 'Cost: FREE - No credits deducted Returns the current status of a search export job. Once completed,
      includes the results_url to download the export results.'
    request: GET /companies/search/async/{jobId}
    params:
      jobId:
        in: path
        required: true
    price:
      credits: 1
      per: call
  search-async-jobs:
    title: List export jobs
    about: 'Cost: FREE - No credits deducted Returns a paginated list of all search export jobs for the authenticated
      user. Supports optional filtering by job status.'
    request: GET /companies/search/async/jobs
    params:
      page:
        type: integer
        about: 'Page number (default: 1).'
      pageSize:
        type: integer
        about: 'Number of items per page (default: 20, max: 100).'
      status:
        choices:
        - pending
        - processing
        - completing
        - completed
        - failed
        - null
        about: Filter jobs by status.
    price:
      credits: 1
      per: call
  companies-workforce:
    title: Workforce
    about: 'Cost: 5 credits per successful call Returns workforce insights for a single company. You must provide
      exactly one lookup parameter: id or domain. The response includes observed employee count, an…'
    request: GET /companies/workforce
    params:
      id:
        about: CompanyEnrich company ID. Provide either id or domain.
      domain:
        about: Company domain. Provide either id or domain.
    price:
      credits: 1
      per: call
  company-by-id:
    title: Get by ID
    about: 'Cost: 1 credits per call Gets a company information by its CompanyEnrich ID. You can obtain this ID
      by calling the Enrich endpoint or other endpoints returning company information.'
    request: GET /companies
    params:
      id:
        required: true
      expand:
        type: array
        about: 'Expandable response fields. Repeat the parameter to request multiple expansions. Supported values:
          - workforce: costs 5 credits per company and adds the workforce field to CompanyInfo.'
    price:
      credits: 1
      per: call
  geo-countries:
    title: Get country by code
    about: Searches a country by its ISO 3166-1 alpha-2 code.
    request: GET /geo/countries/{countryCode}
    params:
      countryCode:
        in: path
        required: true
    price:
      credits: 1
      per: call
  geo-regions:
    title: Get regions
    about: Returns all regions.
    request: GET /geo/regions
    price:
      credits: 1
      per: call
  industries:
    title: List industries
    about: Obtain a list of all company industries
    request: GET /industries
    price:
      credits: 1
      per: call
  jobs:
    title: Get job details
    about: 'Cost: FREE - No credits deducted Returns details for a specific job by ID.'
    request: GET /jobs/{jobId}
    params:
      jobId:
        in: path
        required: true
    price:
      credits: 1
      per: call
  job-by-id:
    title: List all jobs
    about: 'Cost: FREE - No credits deducted Returns a paginated list of all jobs (bulk enrichment, etc.) for the
      authenticated user. Supports optional filtering by job status and type.'
    request: GET /jobs
    params:
      page:
        type: integer
        about: 'Page number (default: 1).'
      pageSize:
        type: integer
        about: 'Number of items per page (default: 20, max: 100).'
      status:
        choices:
        - pending
        - processing
        - completing
        - completed
        - failed
        - null
        about: Filter jobs by status.
      type:
        about: Filter jobs by type (bulk_enrichment, etc.).
    price:
      credits: 1
      per: call
  keywords-autocomplete:
    title: Lookup keywords
    request: GET /keywords/autocomplete
    params:
      query:
        required: true
    price:
      credits: 1
      per: call
  account:
    title: Get current user information
    about: 'Cost: FREE - No credits deducted Returns information about the authenticated user, including their API
      key, credit balance, and account capabilities. This endpoint requires authentication via an API…'
    request: GET /me
    price:
      usd: 0
      per: call
  people-education:
    title: Education
    about: 'Cost: 1 credit per successful call Returns the education history for a person by their CompanyEnrich
      ID. The response is an empty array when the person has no education records.'
    request: GET /people/education
    params:
      id:
        type: integer
        required: true
        about: The CompanyEnrich ID of the person
    price:
      credits: 1
      per: call
  people-email-bulk:
    title: Get bulk email enrichment job status (BETA)
    about: 'BETA: This endpoint is currently in beta and may change based on provider coverage, job orchestration,
