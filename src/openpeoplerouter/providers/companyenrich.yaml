      count:
        in: body
        type: integer
        required: true
        about: The number of companies to export.
      webhook_url:
        in: body
        about: The webhook URL to receive the notification when processing completes.
      search:
        in: body
        type: object
        about: The filters to be applied on the companies
      similar:
        in: body
        type: object
        about: The filters used to find similar companies
    price:
      credits: 1
      per: call
  companies-search-count:
    title: Count
    about: 'Cost: FREE - No credits deducted Returns the total count of companies matching the given search criteria
