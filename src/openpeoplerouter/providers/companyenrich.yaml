    request: POST /companies/search/count
    params:
      lists:
        in: body
        type: array
        about: The list IDs to filter by
      semanticQuery:
        in: body
        about: The semantic search query to find companies with. More natural language version of the standard query.
      semanticWeight:
        in: body
        type: number
        about: The semantic weight to apply to the results. Must be between 0 and 1. 0.7 is default. Larger values
          will prioritize semantic similarity, smaller values will prioritize traditional search factors.
      exclude:
        in: body
        type: object
        about: Exclusion filters to apply on the companies. If a company matches any of the filters here, it will
