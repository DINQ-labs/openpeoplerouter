  employee-clean-enrich:
    title: Enrich Clean Employee
    request: GET /v2/employee_clean/enrich
    params:
      linkedin_url:
        required: true
        about: Employee LinkedIn URL
      fields:
        type: array
        about: List of fields to return. If not specified, all fields will be returned. Fields the record does not
          store are left out, so a record can come back as an empty object.
    price:
      credits: 1
      per: success
      note: collect and enrich cost credits per record; searches return ids
    not_found: 404
    jobs:
      enrich_person:
        needs:
        - - linkedin_url
        send:
          linkedin_url: linkedin_url
        result: '@'
        fields:
          name: full_name
          first_name: name_first
          last_name: name_last
          headline: headline
          title: job_title
          company: experience[?order_in_profile == `1`] | [0].company_name
          location: location_raw_address
          country: location_country_iso_2
          linkedin_url: websites_linkedin
          image: picture_url
          experience: experience
          education: education
