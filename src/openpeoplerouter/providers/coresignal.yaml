id: coresignal
title: Coresignal
about: Employee and company records from public professional profiles, with history, headcount and job postings,
  searchable by filters or Elasticsearch.
site: https://coresignal.com
docs: https://docs.coresignal.com
pricing: https://coresignal.com/pricing/
api: https://api.coresignal.com/cdapi
key:
  env: CORESIGNAL_API_KEY
  header: apikey
operations:
  company-base-by-id:
    title: Read Base Company
    request: GET /v2/company_base/collect/{company_id}
    params:
      company_id:
        in: path
        type: integer
        required: true
        about: Company ID as mentioned in coresignal’s database
      fields:
        type: array
        about: List of fields to return. If not specified, all fields will be returned. Fields the record does not
          store are left out, so a record can come back as an empty object.
    price:
      credits: 1
      per: success
      note: collect and enrich cost credits per record; searches return ids
  company-base-by-name:
    title: Find Base Company
    request: GET /v2/company_base/collect/{shorthand_name}
    params:
      shorthand_name:
        in: path
        required: true
      fields:
        type: array
        about: List of fields to return. If not specified, all fields will be returned. Fields the record does not
          store are left out, so a record can come back as an empty object.
    price:
      credits: 1
      per: success
      note: collect and enrich cost credits per record; searches return ids
  company-base-search-filter:
    title: Search Base Companies
    request: POST /v2/company_base/search/filter
    params:
      items_per_page:
        type: integer
        about: Limit the number of results returned per page from 1 to 1000. By default, 1000 results are returned.
      sort:
        about: Sort results by a field, currently accepts a list with either id or last_updated value
      after:
        about: Next page of IDs (see x-next-page-after in response header)
      name:
        in: body
        about: 'Full name (as input in Linkedin’s public profile) of a company. E.g.: ''Tesla'', (''Microsoft''
          OR ''Labs'')'
      website:
        in: body
        about: 'Search based on company''s website domain. E.g.: ''microsoft.com''; ''tesla.com'''
      exact_website:
        in: body
        about: 'Search based on the exact company''s website URL. E.g.: ''https://www.microsoft.com''; ''https://www.tesla.com'''
      size:
        in: body
        about: 'Company size as seen in LinkedIn. E.g.: ''1-10 employees''; ''1,001-5,000 employees'''
      industry:
        in: body
        about: 'Industry, company operates in. E.g.: ''(Information Technology) OR Agriculture''; ''Internet'''
      country:
        in: body
        about: 'Country of the company as parsed by our in-house country parser. E.g.: ''(United States) OR Germany'';
          ''France'''
      location:
        in: body
        about: 'Location of the company as input by the company on Linkedin. E.g.: ''London''; ''Denver, Colorado'''
      created_at_gte:
        in: body
        about: 'Date and time when the company record was created in Coresignal''s database. Greater (or equal)
          than {value}. E.g.: 2021-06-26 12:21:01'
      created_at_lte:
        in: body
        about: 'Data and time when the company record was created in Coresignal''s database. Less (or equal) than
          {value}. E.g.: 2021-06-26 12:21:01'
      last_updated_gte:
        in: body
        about: 'Data and time when the company record was last updated. Greater (or equal) than {value}. E.g.: 2021-02-26
          12:41:01'
      last_updated_lte:
        in: body
        about: 'Data and time when the company record was last updated. Less (or equal) than {value}. E.g.: 2021-02-26
          12:41:01'
      deleted:
        in: body
        type: boolean
        about: Company's profile is deleted. True/False
      employees_count_gte:
        in: body
        type: integer
        about: 'Employees on Linkedin, who associated their experience with a company. Greater (or equal) than {value}.
          E.g.: 20'
      employees_count_lte:
        in: body
        type: integer
        about: 'Employees on Linkedin, who associated their experience with a company. Less (or equal) than {value}.
          E.g.: 50'
      source_id:
        in: body
        type: integer
        about: Unique ID on Linkedin database
      founded_year_gte:
        in: body
        type: integer
        about: 'Year when the company was founded. Greater (or equal) than {value}. E.g.: 2000'
      founded_year_lte:
        in: body
        type: integer
        about: 'Year when the company was founded. Less (or equal) than {value}. E.g.: 2020'
      funding_total_rounds_count_gte:
        in: body
        type: integer
        about: 'Number of funding rounds. Greater (or equal) than {value}. E.g.: 20'
      funding_total_rounds_count_lte:
        in: body
        type: integer
        about: 'Number of funding rounds. Less (or equal) than {value}. E.g.: 50'
      funding_last_round_type:
        in: body
        about: 'Type of the last funding round. E.g.: ''Series A'''
      funding_last_round_date_gte:
        in: body
        about: 'Date of the last funding round. Greater (or equal) than {value}. E.g.: 2021-02-26'
      funding_last_round_date_lte:
        in: body
        about: 'Date of the last funding round. Less (or equal) than {value}. E.g.: 2021-02-26'
    price:
      credits: 1
      per: success
      note: collect and enrich cost credits per record; searches return ids
  company-base-search-es-dsl:
    title: Search Base Company Query
    request: POST /v2/company_base/search/es_dsl
    params:
      items_per_page:
        type: integer
        about: Limit the number of results returned per page from 1 to 1000. By default, 1000 results are returned.
      after:
        about: Next page of IDs (see x-next-page-after in response header)
      query:
        in: body
        type: object
        required: true
        about: Query written in Elasticsearch Query DSL
      sort:
        in: body
        type: array
        about: Sort results by a field, currently accepts a list with either _score or id value
    price:
      credits: 1
      per: success
      note: collect and enrich cost credits per record; searches return ids
  employee-base-by-id:
    title: Read Base Employee
    request: GET /v2/employee_base/collect/{employee_id}
    params:
      employee_id:
        in: path
        type: integer
        required: true
        about: Employee ID as mentioned in coresignal’s database
      fields:
        type: array
        about: List of fields to return. If not specified, all fields will be returned. Fields the record does not
