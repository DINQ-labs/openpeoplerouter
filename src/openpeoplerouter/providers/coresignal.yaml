    params:
      shorthand_name:
        in: path
        required: true
      fields:
        type: array
        about: List of fields to return. If not specified, all fields will be returned. Fields the record does not
          store are left out, so a record can come back as an empty object.
    price:
      credits: 1
      per: success
      note: collect and enrich cost credits per record; searches return ids
  employee-base-search-es-dsl:
    title: Search Base Employee Query
    request: POST /v2/employee_base/search/es_dsl
    params:
      items_per_page:
        type: integer
        about: Limit the number of results returned per page from 1 to 1000. By default, 1000 results are returned.
      after:
        about: Next page of IDs (see x-next-page-after in response header)
      query:
        in: body
        type: object
        required: true
        about: Query written in Elasticsearch Query DSL
      sort:
        in: body
        type: array
        about: Sort results by a field, currently accepts a list with either _score or id value
    price:
      credits: 1
      per: success
      note: collect and enrich cost credits per record; searches return ids
  employee-base-search-filter:
    title: Search Base Employees
    request: POST /v2/employee_base/search/filter
    params:
      items_per_page:
        type: integer
        about: Limit the number of results returned per page from 1 to 1000. By default, 1000 results are returned.
      sort:
        about: Sort results by a field, currently accepts a list with either id or last_updated value
      after:
        about: Next page of IDs (see x-next-page-after in response header)
      full_name:
        in: body
        about: 'Full name (as input in Linkedin''s public profile) of an employee. E.g.: ''John Doe'''
      headline:
        in: body
        about: 'Headline (Headline field in Linkedin''s public profile) of an employee. E.g.: ''Python developer'''
      location:
        in: body
        about: 'Employee''s location as input by the employee on Linkedin. E.g.: ''Berlin''; ''Greater Chicago Area'''
      industry:
        in: body
        about: 'Employee''s industry as input by the employee on Linkedin (not directly related to any particular
          work experience). E.g.: ''Information Technology'' OR ''Internet''. For exact match search, use escaped…'
      summary:
        in: body
        about: Text in employee’s profile summary field. E.g. 'python'; '(project manager) OR scrum'
      created_at_gte:
        in: body
        about: 'Date and time when the employee record was created in Coresignal''s database. Greater (or equal)
          than {value}. E.g.: 2021-01-26 12:41:10'
      created_at_lte:
        in: body
        about: 'Date and time when the employee record was created in Coresignal''s database. Less (or equal) than
          {value}. E.g.: 2021-01-26 12:41:10'
      updated_at_gte:
        in: body
        about: 'Date and time when the employee record was last updated. Greater (or equal) than {value}. E.g.:
          2021-02-26 12:41:01'
      updated_at_lte:
        in: body
        about: 'Date and time when the employee record was last updated. Less (or equal) than {value}. E.g.: 2021-02-26
          12:41:01'
      deleted:
        in: body
        type: boolean
        about: Employee's profile is deleted. True/False
      country:
        in: body
        about: 'The country of the employee (as parsed by us from the ''location'' value). E.g.: ''(United States)
          OR Germany''; France'
      certification_title:
        in: body
        about: 'Title of the certificate an employee holds. E.g.: ''Data Processing'''
      experience_title:
        in: body
        about: 'Job title. E.g.: ''(sales manager) OR (product manager)''; ''developer''; ''vice president''. For
          exact match search, use escaped double quotes in the query, e.g.: ''"Project manager"'''
      experience_company_name:
        in: body
        about: 'Name of the company a person worked for. E.g.: ''ibm OR (digital ocean)''; ''uber'''
      experience_company_exact_name:
        in: body
        about: 'Exact name of the company a person worked for. E.g.: ''Microsoft'''
      experience_company_website_url:
        in: body
        about: 'Search based on company''s website domain. E.g.: ''microsoft.com''; ''tesla.com'''
      experience_company_website_exact_url:
        in: body
        about: 'Search based on the exact company''s website URL. E.g.: ''https://www.microsoft.com''; ''https://www.tesla.com'''
      experience_company_linkedin_url:
        in: body
        about: 'Link to a company''s Linkedin page. E.g.: ''https://www.linkedin.com/company/rainbow-sushi'', ''rainbow-sushi'''
      experience_company_industry:
        in: body
        about: 'Industry, company operates in. E.g.: ''(Information Technology) OR Agriculture''; ''Internet'''
      experience_company_size:
        in: body
        about: 'Company size as seen in LinkedIn. E.g.: ''1-10 employees''; ''1,001-5,000 employees'''
      experience_company_employees_count_gte:
        in: body
        type: integer
        about: 'Employees on Linkedin, who associated their experience with a company. Greater (or equal) than {value}.
          E.g.: 20'
      experience_company_employees_count_lte:
        in: body
        type: integer
        about: 'Employees on Linkedin, who associated their experience with a company. Less (or equal) than {value}.
          E.g.: 50'
      experience_date_from:
        in: body
        about: 'Experience start date. Format: (B Y || Y); E.g.: ''January 2018’; ''2017’, ''1000''*; 1000 = NULL;
          1001 = NOT NULL'
      experience_date_to:
        in: body
        about: 'Experience end date. Format: (B Y || Y); E.g.: ''January 2018’; ''2017’, ''1000''*; 1000 = NULL;
          9999 = NOT NULL'
      experience_description:
        in: body
        about: 'Text in job experience description. E.g.: ''python'', ''data science'''
      experience_deleted:
        in: body
        type: boolean
        about: Whether to include outdated records. True/False
      experience_company_id:
        in: body
        type: integer
        about: 'Company ID (as registered in Coresignal''s company database) of a company which is mentioned in
          employee''s experience record. E.g.: 123; 787879'
      active_experience:
        in: body
        type: boolean
        about: Combo filter. When true, filters the experience records we identify as 'active' - employee is considered
          to be still working in this position. false - no effect.
      keyword:
        in: body
        about: 'Text in multiple employee''s profile fields. Fields included in search: summary; industry; skill;
          experience_title; experience_description. E.g. ''python''; ''(project manager) OR scrum'''
      inferred_skills:
        in: body
        about: Filter to search employees by inferred skill. E.g. 'Python', 'Data Engineering'
      education_institution_name:
        in: body
        about: 'Name of the school/university a person got education in for. E.g.: ''harvard OR (princeton university)'';
          ''yale'''
      education_institution_exact_name:
        in: body
        about: 'Exact name of the school/university a person got education in for. E.g.: ''Massachusetts Institute
          of Technology'''
      education_program_name:
        in: body
        about: 'Program of education. E.g.: ''(computer science) OR (business)''; ''physics''; ''masters''For exact
          match search, use escaped double quotes in the query, e.g.: ''"Applied Sciences"'''
      education_description:
        in: body
        about: 'Text in education entry description. E.g.: ''thesis'', ''publications'''
      education_date_from:
        in: body
        about: 'Education start date. Format: (B Y || Y); E.g.: ''2018’; ''2017’, ''1000''*; 1000 = NULL; 1001 =
          NOT NULL'
      education_date_to:
        in: body
        about: 'Education end date. Format: (B Y || Y); E.g.: ''January 2018’; ''2017’, ''1000''*; 1000 = NULL;
          1001 = NOT NULL'
      education_institution_linkedin_url:
        in: body
        about: 'Link to a school''s/university''s Linkedin page. E.g.: ''https://www.linkedin.com/school/harvard-university/'',''harvard-university'''
    price:
      credits: 1
      per: success
      note: collect and enrich cost credits per record; searches return ids
  job-base-search-filter:
    title: Search Base Jobs
    request: POST /v2/job_base/search/filter
    params:
      items_per_page:
        type: integer
        about: Limit the number of results returned per page from 1 to 1000. By default, 1000 results are returned.
      version:
        type: integer
        about: Job data structure version. 1 returns the current structure, 2 returns the new one. Defaults to 1
          for the duration of the migration window.
      sort:
        about: Sort results by a field, currently accepts a list with either id or last_updated value
      after:
        about: Next page of IDs (see x-next-page-after in response header)
      created_at_gte:
        in: body
        about: 'Date and time when the job record was created in Coresignal''s database. Greater (or equal) than
          {value}. E.g.: 2021-06-26 12:21:01'
      created_at_lte:
        in: body
        about: 'Date and time when the job record was created in Coresignal''s database. Less (or equal) than {value}.
          E.g.: 2021-06-26 12:21:01'
      last_updated_gte:
        in: body
        about: 'Date and time when the job record was last updated. Greater (or equal) than {value}. E.g.: 2021-02-26
          12:41:01'
      last_updated_lte:
        in: body
        about: 'Date and time when the job record was last updated. Less (or equal) than {value}. E.g.: 2021-02-26
          12:41:01'
      title:
        in: body
        about: Position title that the job record is intended for. E.g. ‘Python developer'
      keyword_description:
        in: body
        about: Keywords in the description of a job record. E.g. 'python'; '(project manager) OR scrum'
      employment_type:
        in: body
        about: Employment type that the employer company is offering. E.g. ‘Full-time'
      location:
        in: body
        about: 'Location that the employer company is hiring in. E.g.: ''Berlin''; ''Greater Chicago Area'''
      company_id:
        in: body
        type: integer
        about: Company ID of the employer company as referred to in Coresignal’s database. E.g. 12345
      company_name:
        in: body
        about: 'Full name (as input in LinkedIn) of the employer company. E.g.: ''Tesla'', (''Microsoft'' OR ''Labs'')'
      company_domain:
        in: body
        about: 'Website domain of the employer company. E.g.: ''microsoft.com'', ''tesla.com'''
      company_exact_website:
        in: body
        about: Exact website of the employer company. E.g. 'https://www.microsoft.com'; 'https://www.tesla.com'
      company_linkedin_url:
        in: body
        about: LinkedIn URL of the employer. E.g. 'https://www.linkedin.com/company/microsoft/'
      deleted:
        in: body
        type: boolean
        about: Marks whether historical records are included. E.g. 'True'
      application_active:
        in: body
        type: boolean
        about: Marks whether the job ad is active. E.g. 'False'
      country:
        in: body
        about: 'Country that the employer company is hiring in, as parsed by Coresignal’s in-house country parser.
          E.g.: ''(United States) OR Germany''; ''France'''
      industry:
        in: body
        about: 'Industry that the employer company is operating in. E.g.: ''(Information Technology) OR Agriculture'';
          ''Internet'''
      seniority:
        in: body
        about: 'Seniority of job. E.g.: ''Junior''; ''Mid-Senior'''
      function:
        in: body
        about: 'Function represents a type or category of job. E.g.: ''(Marketing) OR Management''; ''Human Resources'''
    price:
      credits: 1
      per: success
      note: collect and enrich cost credits per record; searches return ids
