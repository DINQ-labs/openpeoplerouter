      research_profile_urls:
        in: body
        type: array
        about: Google Scholar profile URLs, for example https://scholar.google.com/citations?user=VGjeKSMAAAAJ.
          Only Google Scholar is supported. 1 credit per match.
    price:
      per: call
      note: credits per result; see /account/endpoints for your prices
  person-search:
    title: Search people using filters and sorting
    about: Search the Crustdata person database using flexible filter conditions, sorting, and cursor-based pagination.
      Supports filtering on hundreds of fields including job title, company, location,…
    request: POST /person/search
    params:
      x-api-version:
        in: header
        required: true
        choices:
