      cursor:
        in: body
        about: Pagination cursor from a previous response's next_cursor. Omit on the first page.
      post_processing:
        in: body
        type: object
        about: Post-processing options applied to search results (e.g., exclusions).
      return_query:
        in: body
        type: boolean
        about: Debug flag - include search query in response
      preview:
        in: body
        type: boolean
        about: Preview mode - return only basic fields for faster response
      explain:
        in: body
        type: boolean
        about: Explain an empty result. When true and a filters-only request returns total_count 0, remarks names
          the condition whose removal recovers profiles. Not the search.explain flag on semantic search, which…
      fields:
        in: body
        type: array
        about: Optional list of field paths to include in each returned profile. When omitted, a default set of
          profile fields is returned. Use dot notation for a nested field (for example…
    price:
      credits: 0.03
      per: result
      note: plus premium field groups you filter on or receive
    jobs:
      find_people:
        needs:
        - - title
        - - company
        - - company_domain
        - - location
        - - keywords
        send:
          title:
            to: filters.conditions.0
            as:
              field: experience.employment_details.current.title
              type: (.)
              value: $
          company:
            to: filters.conditions.1
            as:
              field: experience.employment_details.current.name
              type: (.)
              value: $
          company_domain:
            to: filters.conditions.2
            as:
              field: experience.employment_details.current.company_website
              type: (.)
              value: $
          location:
            to: filters.conditions.3
            as:
              field: basic_profile.location.raw
              type: (.)
              value: $
          keywords:
            to: filters.conditions.4
            as:
              field: skills.professional_network_skills
              type: (.)
              value: $
        fixed:
          filters.op: and
          fields:
          - basic_profile
          - social_handles
          - experience.employment_details.current
        limit: limit
        result: profiles
        fields:
          name: basic_profile.name
          headline: basic_profile.headline
          title: basic_profile.current_title
          company: experience.employment_details.current[0].name
          company_domain: experience.employment_details.current[0].company_website
          location: basic_profile.location.raw
          country: basic_profile.location.country
          linkedin_url: social_handles.professional_network_identifier.profile_url
          image: basic_profile.profile_picture_permalink
  social-post-search:
