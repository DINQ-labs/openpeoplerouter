        in: body
        type: integer
        about: Unix timestamp (seconds since epoch) for the start date filter. Must be less than end_date if both
          are provided.
      end_date:
        in: body
        type: integer
        about: Unix timestamp (seconds since epoch) for the end date filter. Must be greater than start_date if
          both are provided.
      human_mode:
        in: body
        type: boolean
        about: Whether to use a browser-like retrieval path when standard access is blocked.
      page:
        in: body
        type: integer
        about: Number of search result pages to aggregate into a single response. Values above 15 are rejected with
          a 400. When greater than 1, sources must contain exactly one source.
    price:
      per: call
      note: credits per result; see /account/endpoints for your prices
