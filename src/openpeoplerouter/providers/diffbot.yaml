id: diffbot
title: Diffbot Knowledge Graph
about: A web-scale graph of organizations, people and articles, queried with DQL or matched (enhanced) from partial
  details.
site: https://www.diffbot.com
docs: https://docs.diffbot.com/kgapi
pricing: https://www.diffbot.com/pricing/
api: https://kg.diffbot.com
key:
  env: DIFFBOT_TOKEN
  query: token
operations:
  dql:
    title: Search with DQL
    about: Search the Knowledge Graph using DQL
    request: GET /dql
    params:
      type:
        choices:
        - query
        - crawl
        about: Query type
      query:
        required: true
        about: DQL Query
      col:
        about: Comma-delimited list of custom crawl collections to query. Specify all to query all collections for
          your token. This parameter is valid only when type=crawl and defaults to all
      from:
        type: integer
        about: Return results starting at from index. from+size <= 10_000 for facet queries. Please note that the
          from parameter is no longer applicable to Article queries and has been deprecated. In the future,…
      size:
        type: integer
        about: Maximum number of results to return. -1 to return all results. from+size <= 10_000 for facet queries.
      format:
        choices:
        - json
        - jsonl
        - csv
        - xls
        - xlsx
        about: Output format
      exportspec:
        about: The spec defines the columns to export. This is applicable for csv, xls and xslx formats. Export
          spec specifies how to export the entity JSON to a csv. A simple export spec looks like name;summary.…
      exportseparator:
        about: The export separator
      exportfile:
        about: For export endpoint, The file name of the export file
      filter:
        about: Semi-colon separated path filter to filter response json. You can use a simple dot notation skills.name
          or a JsonPath expression such as $.name;$.locations.country.name. For more advanced options,…
      filterExclude:
        about: Semi-colon separated path filter to filter and exclude data from response json. You can use a simple
          dot notation skills.name or a JsonPath expression such as $.name;$.locations.country.name. For…
      jsonmode:
        choices:
        - extended
        - id
        about: extended returns origin information for facts. id returns just the diffbotIds and origins.
      nonCanonicalFacts:
        type: boolean
        about: nonCanonicalFacts=true returns non-canonical facts.
      noDedupArticles:
        type: boolean
        about: noDedupArticles=true indicates that articles should not be deduplicated but all of them returned
      cluster:
        choices:
        - all
        - best
        - dedupe
        about: Articles only. Utilize Diffbot clustering algorithms to identify related or similar objects. - cluster=all
          to return each article with a clusterId identifying thematically-similar articles. -…
      report:
        type: boolean
        about: Generate coverage report. See Coverage Reports for more details on generating coverage reports for
          DQL queries.
      view: {}
    price:
      per: result
      note: credits per entity returned; see pricing
    jobs:
      find_people:
        needs:
        - - title
        - - company
        send:
          title:
            to: query
            as: employments.{title:"$" isCurrent:true}
          company:
            to: query
            as: employments.{employer.name:"$" isCurrent:true}
          location:
            to: query
            as: locations.address:"$"
        fixed:
          query: type:Person
        limit: size
        result: data[].entity
        fields:
          name: name
          title: employments[?isCurrent] | [0].title
          company: employments[?isCurrent] | [0].employer.name
          location: location.address
          linkedin_url: linkedInUri && join('', ['https://', linkedInUri])
          image: image
  post-dql:
    title: Search with DQL
    about: Search the Knowledge Graph using DQL
    request: POST /dql
    params:
      type:
        in: body
        choices:
        - query
        - text
        - queryTextFallback
        - crawl
        about: Query type
      query:
        in: body
