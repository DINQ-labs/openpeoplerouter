id: dropcontact
title: Dropcontact
about: GDPR-first enrichment of contacts with verified work emails, job titles, LinkedIn URLs and, for French companies, SIREN data. Batches run asynchronously.
site: https://www.dropcontact.com
docs: https://developer.dropcontact.com/
pricing: https://www.dropcontact.com/pricing
api: https://api.dropcontact.com/v1
key:
  env: DROPCONTACT_API_KEY
  header: X-Access-Token
operations:
  enrich:
    title: Start enriching up to 250 contacts
    about: "Each contact needs first_name + last_name + company (or website), a linkedin URL, or an email. Send data: [{}] to read your credits for free."
    request: POST /enrich/all
    params:
      data: {in: body, type: array, required: true, about: "[{first_name, last_name, full_name, company, website, linkedin, email, phone, country, job}]"}
      siren: {in: body, type: boolean, about: add French company registry data}
      language: {in: body, default: en}
      custom_callback_url: {in: body}
    price: {credits: 1, per: success, note: charged only for a verified email}
    jobs:
      find_contact:
        needs: [[first_name, last_name, company_domain], [first_name, last_name, company], [linkedin_url]]
        send: {first_name: data.0.first_name, last_name: data.0.last_name, company_domain: data.0.website,
               company: data.0.company, linkedin_url: data.0.linkedin}
        poll: {operation: result, send: {request_id: request_id}, until: success, every: 10, within: 240}
        result: data[0]
        fields:
          email: email[0].email
          email_status: email[0].qualification
          phone: phone
          name: full_name
          title: job
          company_domain: website
  result:
    title: The result of an enrichment batch
    about: success is false while the batch is still running; forceResults returns what is ready.
    request: GET /enrich/all/{request_id}
    params:
      request_id: {in: path, required: true}
      forceResults: {type: boolean}
    price: {usd: 0, per: call}
