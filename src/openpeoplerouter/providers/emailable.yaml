id: emailable
title: Emailable
about: Email verification with deliverability state, score and accept-all detection; test keys return sample answers for free.
site: https://emailable.com
docs: https://emailable.com/docs/api/
pricing: https://emailable.com/pricing
api: https://api.emailable.com/v1
key:
  env: EMAILABLE_API_KEY
  bearer: true
operations:
  verify:
    title: Whether an address accepts mail
    request: GET /verify
    docs: https://emailable.com/docs/api/emails/
    params:
      email: {required: true}
      smtp: {type: boolean, about: "false is faster and less accurate"}
      accept_all: {type: boolean, about: check whether the domain accepts every address (slower)}
      timeout: {type: integer, about: 2-10 seconds}
    price: {credits: 1, per: call}
    jobs:
      verify_email:
        needs: [[email]]
        send: {email: email}
        result: '@'
        fields:
          email: email
          status: state
          deliverable: state == 'deliverable'
          score: score
          catch_all: accept_all
          disposable: disposable
  batch:
    title: Start verifying a list of addresses
    request: POST /batch
    params:
      emails: {in: body, required: true, about: comma-separated addresses}
      url: {in: body, about: where the results are POSTed when done}
    price: {credits: 1, per: result}
  batch-status:
    title: Progress and results of a batch
    request: GET /batch
    params:
      id: {required: true}
    price: {usd: 0, per: call}
  account:
    title: Account owner and credits left
    request: GET /account
    price: {usd: 0, per: call}
