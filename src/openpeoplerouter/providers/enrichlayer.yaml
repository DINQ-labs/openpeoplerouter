id: enrichlayer
title: Enrich Layer
about: LinkedIn-sourced person and company profiles, person and company search, employee listings, work and personal
  emails and phones.
site: https://enrichlayer.com
docs: https://enrichlayer.com/docs/api/v2
pricing: https://enrichlayer.com/pricing
api: https://enrichlayer.com/api/v2
key:
  env: ENRICHLAYER_API_KEY
  bearer: true
operations:
  school:
    title: School Profile Endpoint
    about: 'Cost: 1 credit / successful request. Get structured data of a School Profile.'
    request: GET /school
    params:
      url:
        required: true
        about: URL of the School Profile to crawl.
      use_cache:
        about: if-present The default behavior.Fetches profile from cache regardless of age of profile. If profile
          is not available in cache, API will attempt to source profile externally. if-recent API will make a…
      live_fetch:
        about: 'Tweak the behavior of the API to fetch the fresh profile. This parameter accepts the following values:
          * force - Force the API to fetch the fresh profile. Costs an extra 9 credits on top of the cost…'
    price:
      credits: 1
      per: call
      note: see each endpoint's credit cost in the docs
  company:
    title: Company Profile Endpoint
    about: 'Cost: 1 credit / successful request. Get structured data of a Company Profile.'
    request: GET /company
    params:
      url:
        required: true
        about: URL Company Profile to crawl.
      categories:
        about: Appends categories data of this company. Default value is "exclude". The other acceptable value is
          "include", which will include these categories (if available) for 1 extra credit.
      funding_data:
        about: Returns a list of funding rounds that this company has received. Default value is "exclude". The
          other acceptable value is "include", which will include these categories (if available) for 1 extra…
      exit_data:
        about: Returns a list of investment portfolio exits. Default value is "exclude". The other acceptable value
          is "include", which will include these categories (if available) for 1 extra credit.
      acquisitions:
        about: Provides further enriched data on acquisitions made by this company from external sources. Default
          value is "exclude". The other acceptable value is "include", which will include these acquisition…
      extra:
        about: Enriches the Company Profile with extra details from external sources. Details include Crunchbase
          ranking, contact email, phone number, Facebook account, Twitter account, funding rounds and amount,…
      use_cache:
        about: if-present - Fetches profile from cache regardless of age of profile. If profile is not available
          in cache, API will attempt to source profile externally. if-recent (Default) - API will make a best…
      fallback_to_cache:
        about: 'Tweaks the fallback behavior if an error arises from fetching a fresh profile. This parameter accepts
          the following values: * on-error (default value) - Fallback to reading the profile from cache if…'
      live_fetch:
        about: 'Tweak the behavior of the API to fetch the fresh profile. This parameter accepts the following values:
          * force - Force the API to fetch the fresh profile. Costs an extra 9 credits on top of the cost…'
    price:
      credits: 1
      per: call
      note: see each endpoint's credit cost in the docs
    jobs:
      enrich_company:
        needs:
        - - linkedin_url
        send:
          linkedin_url: url
        result: '@'
        fields:
          name: name
          website: website
          description: description
          industry: industry
          employees: company_size_on_linkedin
          founded: founded_year
          location: join(', ', [hq.city, hq.country][?@])
          country: hq.country
          logo: profile_pic_url
  profile:
    title: Person Profile Endpoint
    about: 'Cost: 1 credit / successful request. Get structured data of a Person Profile.'
    request: GET /profile
    params:
      profile_url:
        about: The Profile URL from which you wish to extract. We support both raw UTF-8 input and URL-encoded input.
          For example, https://linkedin.com/in/rodríguez/ and https://linkedin.com/in/rodr%C3%ADguez/ are…
      twitter_profile_url:
        about: 'The Twitter/X Profile URL from which you wish to extract person profile URL should be in the format
          of https://x.com/ Include only one of: profile_url, twitter_profile_url, or facebook_profile_url.'
      facebook_profile_url:
        about: 'The Facebook Profile URL from which you wish to extract person profile URL should be in the format
          of https://facebook.com/ Include only one of: profile_url, twitter_profile_url, or…'
      extra:
        about: 'Enriches the Person Profile with extra details from external sources. Extra details include gender,
          birth date, industry and interests. This parameter accepts the following values: - exclude (default…'
      github_profile_id:
        about: 'Enriches the Person Profile with GitHub ID from external sources. This parameter accepts the following
          values: - exclude (default value) - Does not provide GitHub ID data field. - include - Append…'
      facebook_profile_id:
        about: 'Enriches the Person Profile with Facebook ID from external sources. This parameter accepts the following
          values: - exclude (default value) - Does not provide Facebook ID data field. - include -…'
      twitter_profile_id:
        about: 'Enriches the Person Profile with Twitter ID from external sources. This parameter accepts the following
          values: - exclude (default value) - Does not provide Twitter ID data field. - include - Append…'
      personal_contact_number:
        about: 'Enriches the Person Profile with personal numbers from external sources. This parameter accepts
          the following values: - exclude (default value) - Does not provide personal numbers data field. -…'
      personal_email:
        about: 'Enriches the Person Profile with personal emails from external sources. This parameter accepts the
          following values: - exclude (default value) - Does not provide personal emails data field. - include…'
      inferred_salary:
        about: 'Include inferred salary range from external sources. This parameter accepts the following values:
          - exclude (default value) - Does not provide inferred salary data field. - include - Append inferred…'
      skills:
        about: Include skills data from external sources. Skills are no longer available as part of public data,
          but we will show skills for historic profiles, or where skills are inferred or sourced by other…
      use_cache:
        about: if-present - Fetches profile from cache regardless of age of profile. If profile is not available
          in cache, API will attempt to source profile externally. if-recent (Default) - API will make a best…
      fallback_to_cache:
        about: 'Tweaks the fallback behavior if an error arises from fetching a fresh profile. This parameter accepts
          the following values: * on-error (default value) - Fallback to reading the profile from cache if…'
      live_fetch:
        about: 'Tweak the behavior of the API to fetch the fresh profile. This parameter accepts the following values:
          * force - Force the API to fetch the fresh profile. Costs an extra 9 credits on top of the cost…'
    price:
      credits: 1
      per: call
      note: see each endpoint's credit cost in the docs
    not_found: 404
    jobs:
      enrich_person:
        needs:
        - - linkedin_url
        send:
          linkedin_url: profile_url
        result: '@'
        fields:
          name: full_name
          first_name: first_name
          last_name: last_name
          headline: headline
          title: occupation
          company: experiences[?ends_at == null] | [0].company
          location: location_str
          country: country
          linkedin_url: public_identifier && join('', ['https://www.linkedin.com/in/', public_identifier])
          image: profile_pic_url
          experience: experiences
          education: education
  company-employees:
    title: Employee Listing Endpoint
    about: 'Cost: 3 credits / employee returned. Get a list of employees of a Company.'
    request: GET /company/employees/
    params:
      url:
        required: true
        about: URL of the Company Profile to target.
      coy_name_match:
        about: Include profiles that match the company name. The Employee Listing Endpoint works by identifying
          individual profiles with work experience that provides an exact match to the Company Profile URL…
      use_cache:
        about: 'Define the freshness guarantee on the results returned. This parameter accepts the following values:
          * if-present (default value) - Returns result as it is without any freshness guarantee * if-recent…'
      country:
        about: Limit the result set to the country locality of the profile. For example, set the parameter of country=us
          if you only want profiles from the US. Or you can set the parameter to country=us,sg if you…
      enrich_profiles:
        about: 'Get the full profile of employees instead of only their profile urls. Each request respond with
          a streaming response of profiles. The valid values are: * skip (default): lists employee''s profile url…'
      boolean_role_search:
        about: Filter employees by their title using boolean search expression. This parameter will take precedence
          over role_search parameter if both are provided. The default value of this parameter is null. The…
      role_search:
        about: Use boolean_role_search instead. Filter employees by their title by matching the employee's title
          against a *regular expression*. The default value of this parameter is null. The accepted value for…
      page_size:
        about: Limit the maximum results returned per API call. The default value of this parameter is 10. Accepted
          values for this parameter is an integer ranging from 1 to 9999. When enrich_profiles=enrich, this…
      employment_status:
        about: 'Parameter to tell the API to return past or current employees. Valid values are current, past, and
          all: * current (default) : lists current employees * past : lists past employees * all : lists…'
      sort_by:
        about: 'Sort employees by recency. Valid values are: * recently-joined - Sort employees by their join date.
          The most recent employee is on the top of the list. * recently-left - Sort employees by their…'
      resolve_numeric_id:
        about: 'Enable support for Company Profile URLs with numerical IDs. This parameter accepts the following
          values: - false (default value) - Will not resolve numerical IDs. - true - Enable support for Company…'
      after:
        about: The cursor for fetching the next page of results. Take the value of the after query parameter from
          the next_page URL of the previous response.
    price:
      credits: 1
      per: call
      note: see each endpoint's credit cost in the docs
  company-employees-count:
    title: Employee Count Endpoint
    about: 'Cost: 1 credit / successful request. Get the total number of employees of a company. Returns employee
      counts from various sources.'
    request: GET /company/employees/count
    params:
      url:
        required: true
        about: URL of the Company Profile to target.
      coy_name_match:
        about: Include profiles that match the company name. The Employee Count Endpoint works by identifying individual
          profiles with work experience that provides an exact match to the Company Profile URL…
      at_date:
        about: Time travel back in time and fetch the employee count of a company at any particular date. This parameter
          takes an ISO8601 timestamp with the representation of "YYYY-MM-DD". Costs 1 extra credit on…
      use_cache:
        about: 'if-present: The default behavior. Fetches data from cache regardless of age of profile. if-recent:
          API will make a best effort to return a fresh data no older than 29 days. Costs an extra 1 credit on…'
      estimated_employee_count:
        about: 'Option to include a retrieved employee count value from the target company''s profile. Valid values
