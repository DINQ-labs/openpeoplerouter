      page_size:
        about: Tune the maximum results returned per API call. The default value of this parameter is 100. Accepted
          values for this parameter is an integer ranging from 1 to 100. When enrich_profiles=enrich, this…
      enrich_profiles:
        about: 'Get the company''s complete profile data rather than just the URLs to their profiles. Each request
          respond with a streaming response of profiles. The valid values are: - skip (default): lists…'
      use_cache:
        about: 'Define the freshness guarantee on the results returned. This parameter accepts the following values:
