        needs:
        - - domain
        - - name
        send:
          domain: company_domain
          name: company_name
        fixed:
          enrich_profile: enrich
        result: profile
        fields:
          name: name
          website: website
          description: description
          industry: industry
          employees: company_size_on_linkedin
          founded: founded_year
          country: hq.country
  company-resolve-id:
    title: Company ID Lookup Endpoint
    about: 'Cost: 0 credit / successful request. Look up the vanity ID of a company by its numeric ID.'
