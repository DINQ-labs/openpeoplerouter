      employment_status:
        about: 'Parameter to tell the API to filter past or current employees. Valid values are current, past, and
          all: * current (default) : count current employees * past : count past employees * all : count…'
    price:
      credits: 1
      per: call
      note: see each endpoint's credit cost in the docs
  person-profile-picture:
    title: Person Profile Picture Endpoint
    about: 'Cost: 0 credit / successful request. Get the profile picture of a person. Returns profile pictures from
      cached people profiles.'
    request: GET /person/profile-picture
    params:
      person_profile_url:
        required: true
        about: Profile URL of the person that you are trying to get the profile picture of.
    price:
      credits: 1
      per: call
      note: see each endpoint's credit cost in the docs
  company-profile-picture:
    title: Company Profile Picture Endpoint
    about: 'Cost: 0 credit / successful request. Get the profile picture of a company. Returns profile pictures
      from cached company profiles.'
    request: GET /company/profile-picture
    params:
      company_profile_url:
        required: true
        about: Profile URL of the company that you are trying to get the profile picture of.
    price:
      credits: 1
      per: call
      note: see each endpoint's credit cost in the docs
  profile-resolve:
    title: Person Lookup Endpoint
    about: 'Cost: 2 credits / successful request. Look up a person with a name and company information. Credits
