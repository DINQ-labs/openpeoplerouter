      location:
        about: The location of this user. Name of country, city or state.
      title:
        about: Title that user is holding at his/her current job
      last_name:
        about: Last name of the user
    price:
      credits: 1
      per: call
      note: see each endpoint's credit cost in the docs
    jobs:
      enrich_person:
        needs:
        - - full_name
          - company_domain
        send:
          first_name: first_name
          last_name: last_name
          company_domain: company_domain
        fixed:
          enrich_profile: enrich
        result: '@'
        fields:
          name: profile.full_name
          headline: profile.headline
          title: profile.occupation
          location: profile.location_str
          country: profile.country
          linkedin_url: url
          image: profile.profile_pic_url
  find-company-role:
