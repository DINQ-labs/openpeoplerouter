      resolve_numeric_id:
        about: 'Enable support for Company Profile URLs with numerical IDs. This parameter accepts the following
          values: - false (default value) - Will not resolve numerical IDs. - true - Enable support for Company…'
    price:
      credits: 1
      per: call
      note: see each endpoint's credit cost in the docs
  profile-resolve-email:
    title: Reverse Email Lookup Endpoint
    about: 'Cost: 3 credits / successful request. Resolve a person profile from an email address. Works with both
      personal and work email addresses. Credits are charged by default (lookup_depth=deep) even when…'
    request: GET /profile/resolve/email
    params:
      email:
        required: true
        about: Email address of the user you want to look up.
      lookup_depth:
        about: This parameter describes the depth options for our API lookup function. This endpoint can execute
