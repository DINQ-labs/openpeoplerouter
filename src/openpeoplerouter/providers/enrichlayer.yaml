    request: GET /find/company/role/
    params:
      role:
        required: true
        about: Role of the profile that you are looking up
      company_name:
        required: true
        about: Name of the company that you are searching for
      enrich_profile:
        about: 'Enrich the result with a cached profile of the lookup result. The valid values are: * skip (default):
