    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  get-talent-flow:
    title: Get talent flow analysis for a company
    about: Visualizes talent movement at a company. Use 'joiners' to see where a company is hiring from — which
      competitors, universities, and regions it pulls talent from during the time window. Use 'leavers'…
    request: POST /v1/talent-flow
    params:
      company:
        in: body
        type: object
        required: true
        about: Company to analyze. Set identifier to 'linkedinUrl', 'linkedinSlug', 'linkedinOrgId', or 'domain'
          and provide the corresponding value.
      direction:
        in: body
        required: true
        choices:
        - joiners
        - leavers
        about: Direction of talent flow. 'joiners' finds people who started at the company within the window and
          reports where they came from. 'leavers' finds people who left the company within the window and…
      dateRange:
        in: body
        type: object
        required: true
      renderImage:
        in: body
        type: object
        about: Options for generating a shareable talent-flow graphic image. Omit to skip graphic generation.
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  get-talent-flow-rivals:
    title: Get top talent sources/destinations for a company
    about: Given a company, find the companies where most of its talent is heading to or coming from, in both directions.
