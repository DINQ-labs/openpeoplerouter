    params:
      company:
        in: body
        type: object
        required: true
        about: Company to analyze. Set identifier to 'linkedinUrl', 'linkedinSlug', 'linkedinOrgId', or 'domain'
          and provide the corresponding value.
      dateRange:
        in: body
        type: object
        required: true
      numCompaniesPerSide:
        in: body
        type: integer
        about: Number of top donor and acceptor companies to include. Donors are companies the analyzed company
          gained the most people from; acceptors are companies it lost the most people to. Overlapping companies…
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
