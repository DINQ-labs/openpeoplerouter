      patience:
        in: body
        choices:
        - MINIMUM
        - LOW
        - MEDIUM
        - HIGH
        - EXTREME
        - MAXIMUM
        - null
        about: How long to wait for email deliverability validation after a contact is found. Higher patience increases
          average response time but improves deliverability accuracy. MINIMUM is the least thorough…
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  basic-work-email-reveal:
    title: Find work email by name and company
    about: 'Finds a work email from a person''s name and company information without requiring a LinkedIn profile.
      Useful when the person is not on LinkedIn. ⚡ Rate limit: 30 requests per 1 minute 💰 Cost: 1…'
    request: POST /v1/contact-details/basic-work-email
    params:
      name:
        in: body
        type: object
        required: true
        about: Person name. Provide a full name, or first and last name separately.
      company:
        in: body
        type: object
        required: true
        about: Company to search. Provide a domain, or a company identifier.
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  instant-contact-reveal:
    title: Reveal contact details (instant)
    about: Fast contact lookup that returns emails and phone numbers already on file for the person. Does not perform
      additional discovery or re-verify addresses at request time, so yield is lower than other…
    request: POST /v1/contact-details/instant
    params:
      input:
        in: body
        type: object
        required: true
        about: Person lookup parameters. Use mode 'linkedin' or 'name-domain'.
      enrichmentType:
        in: body
        type: object
        about: Which email and phone types to look for.
      company:
        in: body
        type: object
        about: Optional current company of the person. When provided, work emails whose domain does not match this
          company are returned in unmatchedWorkEmails instead of emails. Set identifier to 'linkedinUrl',…
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  get-department-size:
    title: Count employees per department
    about: Counts how many current employees at a company fall into each department you define. Unlike the depth-chart
      endpoint, this Synchronous endpoint provides immediate results without waiting for…
    request: POST /v1/department-size
    params:
      company:
        in: body
        type: object
        required: true
        about: Company identifier. Set identifier to 'linkedinUrl', 'linkedinSlug', 'linkedinOrgId', or 'domain'
