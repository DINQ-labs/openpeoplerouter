id: fiberai
title: Fiber AI
about: Live people and company data — search, LinkedIn live fetch, contact reveals, email validation, talent flow
  and stealth founders.
site: https://fiber.ai
docs: https://docs.fiber.ai
pricing: https://fiber.ai/pricing
api: https://api.fiber.ai
key:
  env: FIBER_API_KEY
  body: apiKey
operations:
  get-org-credits:
    title: Get organization credits
    about: 'Get credits for an organization ⚡ Rate limit: 120 requests per 1 minute 💰 Cost: FREE! No credits are
      charged for this API.&nbsp;ⓘ'
    request: GET /v1/get-org-credits
    price:
      usd: 0
      per: call
  get-rate-limits:
    title: Get organization rate limits
    about: 'Returns the effective rate limits for all API endpoints for your organization. If your organization
      has custom rate limits on any endpoint, those are reflected here. ⚡ Rate limit: 20 requests per 1…'
    request: GET /v1/rate-limits
    price:
      usd: 0
      per: call
  get-regions:
    title: List countries and regions
    about: 'Get a list of all countries and regions supported by the API, along with their names, codes, and additional
      metadata. ⚡ Rate limit: 120 requests per 1 minute 💰 Cost: FREE! No credits are charged for…'
    request: GET /v1/enums/regions
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  get-languages:
    title: List languages
    about: 'Get a list of all languages that you can pass to our API ⚡ Rate limit: 120 requests per 1 minute 💰 Cost:
      FREE! No credits are charged for this API.&nbsp;ⓘ'
    request: GET /v1/enums/languages
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  get-industries:
    title: List industries
    about: 'Get lists of various industry categorizations. Useful for our company search API. ⚡ Rate limit: 120
      requests per 1 minute 💰 Cost: FREE! No credits are charged for this API.&nbsp;ⓘ'
    request: GET /v1/enums/industries
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  get-job-categories:
    title: List job functions, specialties, and seniorities
    about: Get the job-function and specialty taxonomy behind the jobCategories people-search filter, plus every
      value the seniority filter accepts. Each function lists the specialties nested under it, and…
    request: GET /v1/enums/job-categories
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  get-tags:
    title: List profile and company tags
    about: 'Get a list of all profile and company tags that you can use to filter searches in our API, along with
      their descriptions. ⚡ Rate limit: 120 requests per 1 minute 💰 Cost: FREE! No credits are charged…'
    request: GET /v1/enums/tags
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  get-naics-codes:
    title: List NAICS codes
    about: 'Get all NAICS (North American Industry Classification System) codes from the 2022 version. Returns each
      code and its corresponding title. ⚡ Rate limit: 120 requests per 1 minute 💰 Cost: FREE! No…'
    request: GET /v1/enums/naics-codes
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  get-technologies:
    title: List technologies
    about: 'Get all searchable technologies and platforms with their synonyms. Useful for the technology search
      API. ⚡ Rate limit: 50 requests per 1 minute 💰 Cost: FREE! No credits are charged for this…'
    request: GET /v1/enums/technologies
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  get-skills:
    title: List skills
    about: 'Get the most common professional skills across profiles. Returns up to 1,000 skill names sorted by popularity.
      Useful for building skill-based search filters. ⚡ Rate limit: 120 requests per 1 minute…'
    request: GET /v1/enums/skills
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  get-metro-areas:
    title: List preset metro areas
    about: List all preset metro area regions available for geographic filtering. Each region includes a slug (usable
      with the preset-region strategy in location-based search endpoints), geometry (center +…
    request: GET /v1/enums/metro-areas
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  company-search:
    title: Company search
    about: 'Search for companies using filters ⚡ Rate limit: 180 requests per 1 minute 💰 Cost: 1 credit per company
      found, plus 1 credit when includeCount=true&nbsp;ⓘ'
    request: POST /v1/company-search
    params:
      searchParams:
        in: body
        type: object
        required: true
        about: Search parameters for company search API.
      pageSize:
        in: body
        type: integer
        about: The number of companies to return per page.
      cursor:
        in: body
        about: A pagination cursor returned from a previous search response. Use this to fetch the next page of
          results.
      companyExclusionListIDs:
        in: body
        type: array
        about: The IDs of company exclusion lists to filter out matching companies.
      includeCount:
        in: body
        type: boolean
        about: When true, returns an estimated total count of matching companies in the response and charges one
          additional count credit. The count does not account for exclusion lists.
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  company-count:
    title: Company count
    about: 'Get count of companies matching search filters ⚡ Rate limit: 180 requests per 1 minute 💰 Cost: 1 credit
      per request&nbsp;ⓘ'
    request: POST /v1/company-count
    params:
      searchParams:
        in: body
        type: object
        required: true
        about: Search parameters for company search API.
      companyExclusionListIDs:
        in: body
        type: array
        about: The IDs of company exclusion lists to filter out matching companies.
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  job-posting-search:
    title: Job postings search
    about: 'Search for job postings with flexible filtering capabilities ⚡ Rate limit: 120 requests per 1 minute
      💰 Cost: 1 credit per job posting found&nbsp;ⓘ'
    request: POST /v1/job-search
    params:
      searchParams:
        in: body
        type: object
        required: true
        about: Job search filter parameters
      pageSize:
        in: body
        type: integer
        about: Number of jobs to return per page (max 1000)
      cursor:
        in: body
        about: Pagination cursor for fetching next page of results
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  job-posting-search-count:
    title: Job postings count
    about: 'Get count of job postings matching search filters ⚡ Rate limit: 120 requests per 1 minute 💰 Cost: 1
      credit per request&nbsp;ⓘ'
    request: POST /v1/job-search/count
    params:
      searchParams:
        in: body
        type: object
        required: true
        about: Job search filter parameters
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  people-search:
    title: People search
    about: 'Search for people using filters ⚡ Rate limit: 180 requests per 1 minute 💰 Cost: 1 credit per profile
      found, plus 1 credit when includeCount=true&nbsp;ⓘ'
    request: POST /v1/people-search
    params:
      searchParams:
        in: body
        type: object
        about: Search parameters for people search.
      pageSize:
        in: body
        type: integer
        about: The number of profiles to return, if you need to get more results, you can paginate.
      cursor:
        in: body
        about: A pagination cursor returned from a previous search response. Use this to fetch the next page of
          results.
      currentCompanies:
        in: body
        type: array
        about: Filter people by the companies they are currently working for. Results include people at every company
          that can be matched; companies that can't be matched are skipped. If none of the companies can…
      prospectExclusionListIDs:
        in: body
        type: array
        about: Filter out people which belong to the given prospect exclusion lists
      companyExclusionListIDs:
        in: body
        type: array
        about: Filter out people who work at companies which belong to the given company exclusion lists
      includeCount:
        in: body
        type: boolean
        about: When true, returns an estimated total count of matching prospects in the response and charges one
          additional count credit. The count does not account for exclusion lists.
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
    jobs:
      find_people:
        needs:
        - - keywords
        - - title
        - - query
        send:
          keywords:
            to: searchParams.keywords
            as:
              containsAny:
              - $
          title:
            to: searchParams.keywords
            as:
              containsAny:
              - $
          query:
            to: searchParams.keywords
            as:
              containsAny:
              - $
        limit: pageSize
        result: output.data
        fields:
          name: name
          first_name: first_name
          last_name: last_name
          headline: headline
          title: current_job.title
          company: current_job.company_name
          location: locality || inferred_location
          linkedin_url: url
          image: profile_pic
  people-search-count:
    title: People search count
    about: 'Get count of profiles matching search filters ⚡ Rate limit: 180 requests per 1 minute 💰 Cost: 1 credit
      per request&nbsp;ⓘ'
    request: POST /v1/people-search/count
    params:
      searchParams:
        in: body
        type: object
        about: Search parameters for people search.
      currentCompanies:
        in: body
        type: array
        about: Filter people by the companies they are currently working for. Results include people at every company
          that can be matched; companies that can't be matched are skipped. If none of the companies can…
      prospectExclusionListIDs:
        in: body
        type: array
        about: Filter out people which belong to the given prospect exclusion lists
      companyExclusionListIDs:
        in: body
        type: array
        about: Filter out people who work at companies which belong to the given company exclusion lists
      includeCount:
        in: body
        type: boolean
        about: When true, returns an estimated total count of matching prospects in the response and charges one
          additional count credit. The count does not account for exclusion lists.
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  paginated-combined-search:
    title: Combined people + company search
    about: Search for companies and profiles together. Returns results page by page using cursor-based pagination.
      Each entity type (companies, profiles) has its own cursor, so you can paginate them…
    request: POST /v1/combined-search/paginated
    params:
      companyConfig:
        in: body
        type: object
      profileConfig:
        in: body
        type: object
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  combined-search-count:
    title: Combined search count
    about: Get the total count of companies and people matching the provided search filters. People counts are scoped
      to those currently or previously working (based on the job status filter) at companies that…
    request: POST /v1/combined-search/count
    params:
      companyParams:
        in: body
        type: object
        required: true
        about: The company search parameters. Prospects are found from companies matching these filters.
      profileParams:
        in: body
        type: object
        about: The profile search parameters. Returns profiles matching these filters who work/used to work at companies
          satisfying companyParams.
      companyExclusionListIDs:
        in: body
        type: array
        about: The IDs of company exclusion lists to filter out matching companies.
      prospectExclusionListIDs:
        in: body
        type: array
        about: The IDs of prospect exclusion lists to filter out matching people.
      getFastEstimate:
        in: body
        type: boolean
        about: When true, the people count is estimated rather than counted exactly — much faster, but not perfectly
          accurate. Set to false if you need the exact count (slower).
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  quick-company-resolve:
    title: Quickly resolve company identifiers
    about: 'Resolves many company identifiers — LinkedIn slug, LinkedIn organization ID, LinkedIn company URL, or
      domain — to full company records in a single request. ⚡ Rate limit: 1500 requests per 1 minute 💰…'
    request: POST /v1/company-resolve
    params:
      companies:
        in: body
        type: array
        required: true
        about: Companies to resolve. Each entry is an { identifier, value } pair where identifier is "linkedinSlug",
          "linkedinOrgId", "linkedinUrl", or "domain". Max 100 per request. You are charged only for the…
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  quick-person-resolve:
    title: Quickly resolve person identifiers
    about: 'Resolves many person identifiers — LinkedIn slug, numeric LinkedIn user ID, LinkedIn profile URL, or
      LinkedIn entity URN — to full profile records in a single request. ⚡ Rate limit: 1500 requests per…'
    request: POST /v1/person-resolve
    params:
      people:
        in: body
        type: array
        required: true
        about: People to resolve. Each entry is an { identifier, value } pair where identifier is "linkedinSlug",
          "linkedinUserId", "linkedinUrl", or "entityUrn". Max 100 per request. You are charged only for the…
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  stealth-founders-search:
    title: Search stealth/ex-stealth founders
    about: Find stealth founders — people currently at stealth-mode companies, or who recently left stealth (launched).
      Supports profile search filters to narrow results by location, keywords, job history,…
    request: POST /v1/stealth-founders/search
    params:
      stealthConfig:
        in: body
        type: object
        required: true
        about: Stealth mode configuration. Use in-stealth for current stealth founders, or left-stealth for exited
          stealth founders.
      searchParams:
        in: body
        type: object
        about: Profile search filters to narrow results within the stealth population. All fields are optional —
          omit to search all stealth founders.
      pageSize:
        in: body
        type: integer
        about: Number of profiles to return per page.
      cursor:
        in: body
        about: Opaque cursor from the previous response. Omit for the first page.
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  stealth-founders-count:
    title: Count stealth/ex-stealth founders
    about: 'Count profiles matching stealth founder filters. Uses the same filters as the stealth founders search
      endpoint but returns only the total count. ⚡ Rate limit: 120 requests per 1 minute 💰 Cost: 1…'
    request: POST /v1/stealth-founders/count
    params:
      stealthConfig:
        in: body
        type: object
        required: true
        about: Stealth mode configuration. Use in-stealth for current stealth founders, or left-stealth for exited
          stealth founders.
      searchParams:
        in: body
        type: object
        about: Profile search filters to narrow results within the stealth population. All fields are optional —
          omit to search all stealth founders.
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  sync-turbo-contact-enrichment:
    title: Reveal contact details (turbo)
    about: Fastest synchronous contact reveal — optimized for speed at a higher credit cost. Uses a premium enrichment
      stack for the lowest possible latency. For a cheaper option with slightly longer response…
    request: POST /v1/contact-details/turbo/sync
    params:
      linkedinUrl:
        in: body
        required: true
        about: The person's LinkedIn identifier. Accepts a full LinkedIn profile URL (e.g. 'https://www.linkedin.com/in/williamhgates/'),
          a bare slug (e.g. 'williamhgates'), a Sales Navigator URN (e.g.…
      enrichmentType:
        in: body
        type: object
        about: The enrichment types to request. Credits are charged per selected type.
      patience:
        in: body
        choices:
        - MINIMUM
        - LOW
        - MEDIUM
        - HIGH
        - EXTREME
        - MAXIMUM
        - null
        about: How long to wait for email deliverability validation after a contact is found. Higher patience increases
          average response time but improves deliverability accuracy. MINIMUM is the least thorough…
      company:
        in: body
        type: object
        about: Optional current company of the person. When provided, work emails whose domain does not match this
          company are returned in unmatchedWorkEmails instead of emails. Set identifier to 'linkedinUrl',…
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  premium-phone-reveal:
    title: Premium phone number lookup
    about: 'Find and verify phone numbers for a LinkedIn profile using multiple data sources. ⚡ Rate limit: 120
      requests per 1 minute 💰 Cost: 5 credits per request&nbsp;ⓘ ⏱ Recommended timeout: 1 minute&nbsp;ⓘ'
    request: POST /v1/contact-details/premium-phone/sync
    params:
      linkedinUrl:
        in: body
        required: true
        about: LinkedIn profile identifier. Accepts a full URL, a bare slug, or a LinkedIn entity URN.
      patience:
        in: body
        choices:
        - MINIMUM
        - LOW
        - MEDIUM
        - HIGH
        - EXTREME
        - MAXIMUM
        - null
        about: 'How long to wait for phone-number verification after a number is found: LOW waits up to 15 seconds,
          MEDIUM 30 seconds, HIGH 60 seconds, EXTREME 2 minutes, and MAXIMUM 10 minutes. Higher patience…'
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  sync-quick-contact-reveal:
    title: Reveal contact details (standard)
    about: Standard synchronous contact reveal — the best balance of speed, cost, and coverage. Accepts a LinkedIn
      profile URL, slug, Sales Navigator URN, or numeric LinkedIn user ID; profile details are…
    request: POST /v1/contact-details/single
    params:
      linkedinUrl:
        in: body
        required: true
        about: The person's LinkedIn identifier. Accepts a full LinkedIn profile URL (e.g. 'https://www.linkedin.com/in/williamhgates/'),
          a bare slug (e.g. 'williamhgates'), a Sales Navigator URN (e.g.…
      enrichmentType:
        in: body
        type: object
        about: The enrichment types to request. Credits are charged per selected type.
      patience:
        in: body
        choices:
        - MINIMUM
        - LOW
        - MEDIUM
        - HIGH
        - EXTREME
        - MAXIMUM
        - null
        about: How long to wait for email deliverability validation after a contact is found. Higher patience increases
          average response time but improves deliverability accuracy. MINIMUM is the least thorough…
      validateEmails:
        in: body
        type: boolean
        about: 'Deprecated — use patience instead. When false, maps to patience: MINIMUM. Ignored if patience is
          also provided.'
      company:
        in: body
        type: object
        about: Optional current company of the person. When provided, work emails whose domain does not match this
          company are returned in unmatchedWorkEmails instead of emails. Set identifier to 'linkedinUrl',…
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
    jobs:
      find_contact:
        needs:
        - - linkedin_url
        send:
          linkedin_url: linkedinUrl
        fixed:
          enrichmentType:
            getWorkEmails: true
            getPersonalEmails: false
            getPhoneNumbers: true
        result: output.profile
        fields:
          email: emails[?type == 'work'] | [0].email || emails[0].email
          email_status: emails[0].status
          phone: phoneNumbers[0].number
          name: name
