          Sales Navigator URN, or LinkedIn user ID (e.g. '443105112').
      getDetailedEducation:
        in: body
        type: boolean
        about: Whether to include deep details about each educational item, like the school's LinkedIn URL, website,
          location, etc. That'll be put in the detailedEducation array. This slows down the API call, so…
      getDetailedWorkExperience:
        in: body
        type: boolean
        about: Whether to include deep details about each work experience item, like the company's LinkedIn URL,
          website, location, etc. That'll be put in the detailedWorkExperience array. This slows down the API…
    price:
      per: call
      note: credits charged are in chargeInfo.creditsCharged
  company-live-enrich:
    title: Live fetch LinkedIn company
    about: 'Returns an enriched company with details for a given LinkedIn company identifier ⚡ Rate limit: 600 requests
