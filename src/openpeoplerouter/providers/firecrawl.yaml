      note: credits per page; see the pricing page
  get-batch-scrape-status:
    title: Get the status of a batch scrape job
    request: GET /batch/scrape/{id}
    params:
      id:
        in: path
        required: true
        about: The ID of the batch scrape job
    price:
      per: call
      note: credits per page; see the pricing page
  cancel-batch-scrape:
    title: Cancel a batch scrape job
    request: DELETE /batch/scrape/{id}
    params:
      id:
        in: path
        required: true
        about: The ID of the batch scrape job
    price:
      per: call
      note: credits per page; see the pricing page
  get-batch-scrape-errors:
    title: Get the errors of a batch scrape job
    request: GET /batch/scrape/{id}/errors
    params:
      id:
        in: path
        required: true
        about: The ID of the batch scrape job
    price:
      per: call
      note: credits per page; see the pricing page
  get-crawl-status:
    title: Get the status of a crawl job
    request: GET /crawl/{id}
    params:
      id:
        in: path
        required: true
        about: The ID of the crawl job
    price:
      per: call
      note: credits per page; see the pricing page
  cancel-crawl:
    title: Cancel a crawl job
    request: DELETE /crawl/{id}
    params:
      id:
        in: path
        required: true
        about: The ID of the crawl job
    price:
      per: call
      note: credits per page; see the pricing page
  get-crawl-errors:
    title: Get the errors of a crawl job
    request: GET /crawl/{id}/errors
    params:
      id:
        in: path
        required: true
        about: The ID of the crawl job
    price:
      per: call
      note: credits per page; see the pricing page
  crawl:
    title: Crawl multiple URLs based on options
    request: POST /crawl
    params:
      url:
        in: body
        required: true
        about: The base URL to start crawling from
      prompt:
        in: body
        about: A prompt to use to generate the crawler options (all the parameters below) from natural language.
          Explicitly set parameters will override the generated equivalents.
      excludePaths:
        in: body
        type: array
        about: 'URL pathname regex patterns that exclude matching URLs from the crawl. For example, if you set "excludePaths":
          ["blog/.*"] for the base URL firecrawl.dev, any results matching that pattern will be…'
      includePaths:
        in: body
        type: array
        about: 'URL pathname regex patterns that include matching URLs in the crawl. Only the paths that match the
          specified patterns will be included in the response. Note: the starting URL is also checked against…'
      maxDiscoveryDepth:
        in: body
        type: integer
        about: 'Maximum depth to crawl based on discovery order. The root site and sitemapped pages has a discovery
          depth of 0. For example, if you set it to 1, and you set sitemap: ''skip'', you will only crawl the…'
      sitemap:
        in: body
        choices:
        - skip
        - include
        - only
        about: Sitemap mode when crawling. If you set it to 'skip', the crawler will ignore the website sitemap
          and only crawl the entered URL and discover pages from there onwards. If you set it to 'only', the…
      ignoreQueryParameters:
        in: body
        type: boolean
        about: Do not re-scrape the same path with different (or none) query parameters
      regexOnFullURL:
        in: body
        type: boolean
        about: When true, includePaths and excludePaths regex patterns are matched against the full URL (including
          query parameters) instead of just the URL pathname. Useful when you need to filter URLs based on…
      limit:
        in: body
        type: integer
        about: Maximum number of pages to crawl. Default limit is 10000.
      crawlEntireDomain:
        in: body
        type: boolean
        about: 'Allows the crawler to follow internal links to sibling or parent URLs, not just child paths. false:
          Only crawls deeper (child) URLs. → e.g. /features/feature-1 → /features/feature-1/tips ✅ → Won''t…'
      allowExternalLinks:
        in: body
        type: boolean
        about: Allows the crawler to follow links to external websites. External links are followed one hop (the
          links found on those external pages are not crawled). Links pointing to an external site's homepage…
      allowSubdomains:
        in: body
        type: boolean
        about: Allows the crawler to follow links to subdomains of the main domain.
      ignoreRobotsTxt:
        in: body
        type: boolean
        about: Ignore the website's robots.txt rules. Enterprise only — contact support@firecrawl.com to enable.
      robotsUserAgent:
        in: body
        about: Custom User-Agent string for robots.txt evaluation. When set, robots.txt is fetched with this User-Agent
          and allow/disallow rules are matched against it instead of the default. Enterprise only —…
      delay:
        in: body
        type: number
        about: Delay in seconds between scrapes. This helps respect website rate limits. Setting this forces concurrency
          to 1.
      maxConcurrency:
        in: body
        type: integer
        about: Maximum number of concurrent scrapes. This parameter allows you to set a concurrency limit for this
          crawl. If not specified, the crawl adheres to your team's concurrency limit.
      webhook:
        in: body
        type: object
        about: A webhook specification object.
      scrapeOptions:
        in: body
        type: object
      zeroDataRetention:
        in: body
        type: boolean
        about: If true, this will enable zero data retention for this crawl. To enable this feature, please contact
          help@firecrawl.dev
    price:
      per: call
      note: credits per page; see the pricing page
  crawl-params-preview:
    title: Preview crawl parameters generated from natural language prompt
    request: POST /crawl/params-preview
    params:
      url:
        in: body
        required: true
        about: The URL to crawl
      prompt:
        in: body
        required: true
        about: Natural language prompt describing what you want to crawl
    price:
      per: call
      note: credits per page; see the pricing page
  map:
    title: Map multiple URLs based on options
    request: POST /map
    params:
      url:
        in: body
        required: true
        about: The base URL to start crawling from
      search:
        in: body
        about: 'Specify a search query to order the results by relevance. Example: ''blog'' will return URLs that
          contain the word ''blog'' in the URL ordered by relevance.'
      sitemap:
        in: body
        choices:
        - skip
        - include
        - only
        about: Sitemap mode when mapping. If you set it to skip, the sitemap won't be used to find URLs. If you
          set it to only, only URLs that are in the sitemap will be returned. By default (include), the sitemap…
      includeSubdomains:
        in: body
        type: boolean
        about: Include subdomains of the website
      ignoreQueryParameters:
        in: body
        type: boolean
        about: Do not return URLs with query parameters
      ignoreCache:
        in: body
        type: boolean
        about: Bypass the sitemap cache to retrieve fresh URLs. Sitemap data is cached for up to 7 days; use this
          parameter when your sitemap has been recently updated.
      limit:
        in: body
        type: integer
        about: Maximum number of links to return
      timeout:
        in: body
        type: integer
        about: Timeout in milliseconds. There is no timeout by default.
      location:
        in: body
        type: object
        about: Location settings for the request. When specified, this will use an appropriate proxy if available
          and emulate the corresponding language and timezone settings. Defaults to 'US' if not specified.
      auditMetadata:
        in: body
        type: object
        about: User attribution included with SIEM logging events when SIEM Logging is enabled for the organization.
      threatProtection:
        in: body
        type: object
        about: Per-request Threat Protection override. Fields you provide replace the corresponding fields of your
          organization's policy for this request only; omitted fields keep their organization-level values.…
    price:
      per: call
      note: credits per page; see the pricing page
  extract:
    title: Extract structured data from pages using LLMs
    request: POST /extract
    params:
      urls:
        in: body
        type: array
        required: true
      prompt:
        in: body
        about: Prompt to guide the extraction process
      schema:
        in: body
        type: object
        about: Schema to define the structure of the extracted data. Must conform to JSON Schema.
      enableWebSearch:
        in: body
        type: boolean
        about: When true, the extraction will use web search to find additional data
      ignoreSitemap:
        in: body
        type: boolean
        about: When true, sitemap.xml files will be ignored during website scanning
      includeSubdomains:
        in: body
        type: boolean
        about: When true, subdomains of the provided URLs will also be scanned
      showSources:
        in: body
        type: boolean
        about: When true, the sources used to extract the data will be included in the response as sources key
      scrapeOptions:
        in: body
        type: object
      ignoreInvalidURLs:
        in: body
        type: boolean
        about: If invalid URLs are specified in the urls array, they will be ignored. Instead of them failing the
          entire request, an extract using the remaining valid URLs will be performed, and the invalid URLs…
      threatProtection:
        in: body
        type: object
        about: Per-request Threat Protection override. Fields you provide replace the corresponding fields of your
          organization's policy for this request only; omitted fields keep their organization-level values.…
    price:
      per: call
      note: credits per page; see the pricing page
  get-extract-status:
    title: Get the status of an extract job
    request: GET /extract/{id}
    params:
      id:
        in: path
        required: true
        about: The ID of the extract job
    price:
      per: call
      note: credits per page; see the pricing page
  list-agents:
    title: List agent runs
    request: GET /agent
    params:
      before:
        type: integer
        about: Only return agent runs created before this unix millisecond timestamp. Pages are fixed at 20 runs;
          use the before value from the previous page's next URL to fetch the next page.
    price:
      per: call
      note: credits per page; see the pricing page
  start-agent:
    title: Start an agent task for agentic data extraction
    request: POST /agent
    params:
      urls:
        in: body
        type: array
        about: Optional list of URLs to constrain the agent to
      prompt:
        in: body
        required: true
        about: The prompt describing what data to extract
      schema:
        in: body
        type: object
        about: Optional JSON schema to structure the extracted data
      maxCredits:
        in: body
        type: number
        about: Maximum credits to spend on this agent task. Defaults to 2500 if not set. Values above 2,500 are
          always billed as paid requests.
      strictConstrainToURLs:
        in: body
        type: boolean
        about: If true, agent will only visit URLs provided in the urls array
      model:
        in: body
        choices:
        - spark-2
        - spark-1-mini
        - spark-1-pro
        about: The model to use for the agent task. spark-2 is the default and the model every run executes on.
          The Spark 1 model names remain accepted for backwards compatibility but are deprecated and route to…
      effort:
        in: body
        choices:
        - low
        - medium
        - high
        about: Reasoning budget for the agent task. Every run executes on spark-2, so effort can be sent with or
          without model.
      webhook:
        in: body
        type: object
        about: A webhook specification object. Subscribes to agent lifecycle events (agent.started, agent.action,
          agent.completed, agent.failed, agent.cancelled).
      auditMetadata:
        in: body
        type: object
        about: User attribution included with SIEM logging events when SIEM Logging is enabled for the organization.
      threatProtection:
        in: body
        type: object
        about: Per-request Threat Protection override. Fields you provide replace the corresponding fields of your
          organization's policy for this request only; omitted fields keep their organization-level values.…
      threadId:
        in: body
        about: 'Continue an existing thread: pass the threadId an earlier run returned, and this request runs as
          that thread''s next turn. Omitted urls, schema, effort, mode and exchange settings carry over from the…'
      mode:
        in: body
        choices:
        - extract
        - chat
        about: extract returns the complete structured result in data every turn. chat lets a follow-up that asks
          for no new data get a short reply in message instead of a re-run. exchange.requireApproval needs…
      zeroDataRetention:
        in: body
        type: boolean
        about: 'Run the agent with Zero Data Retention: Firecrawl keeps no prompt, result or step content in logs
          or storage, only billing and status metadata. The result is kept for 24 hours for retrieval, then…'
      location:
        in: body
        type: object
        about: 'Proxy country for every request the agent makes during the run: scrapes, batch scrapes and browser
          sessions go out from this country, and the agent cannot change it. Search results are localized to…'
      safe:
        in: body
        type: boolean
        about: When true, every web search the agent makes during the run filters explicit content, the same filter
          as the search endpoint's safe option. Pages the agent scrapes or opens in a browser are not…
      exchange:
        in: body
        type: object
        about: Let the agent call your team's Alexandria data providers during the run. Without this object the
          run uses the web only (a follow-up turn inherits the previous turn's settings). See Use your connected…
    price:
      per: call
      note: credits per page; see the pricing page
  get-agent-status:
    title: Get the status of an agent job
    request: GET /agent/{jobId}
    params:
      jobId:
        in: path
        required: true
        about: The ID of the agent job
    price:
      per: call
      note: credits per page; see the pricing page
  cancel-agent:
    title: Cancel an agent job
    request: DELETE /agent/{jobId}
    params:
      jobId:
        in: path
        required: true
        about: The ID of the agent job
    price:
      per: call
      note: credits per page; see the pricing page
  get-agent-trace:
    title: Get the execution trace of an agent job
    request: GET /agent/{jobId}/trace
    params:
      jobId:
        in: path
        required: true
        about: The ID of the agent job
      liveView:
        choices:
        - 'true'
        - 'false'
        about: If "true", include the currently active browser sessions with live view URLs.
    price:
      per: call
      note: credits per page; see the pricing page
  get-agent-snapshot:
    title: Get an output snapshot of an agent job
    request: GET /agent/{jobId}/snapshots/{snapshotId}
    params:
      jobId:
        in: path
        required: true
        about: The ID of the agent job
      snapshotId:
        in: path
        required: true
        about: The ID of the snapshot, from an artifact.updated trace event
    price:
      per: call
