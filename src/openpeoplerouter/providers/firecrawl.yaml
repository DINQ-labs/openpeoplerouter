id: firecrawl
title: Firecrawl
about: Search, scrape, crawl and extract structured data from any website, including team, about and contact pages.
site: https://www.firecrawl.dev
docs: https://docs.firecrawl.dev
pricing: https://www.firecrawl.dev/pricing
api: https://api.firecrawl.dev/v2
key:
  env: FIRECRAWL_API_KEY
  bearer: true
operations:
  scrape:
    title: Scrape a single URL and optionally extract information using an LLM
    request: POST /scrape
    params:
      url:
        in: body
        required: true
        about: The URL to scrape
      formats:
        in: body
        type: array
        about: 'Output formats to include in the response. You can specify one or more formats, either as strings
          (e.g., ''markdown'') or as objects with additional options (e.g., { type: ''json'', schema: {...} }).…'
      onlyMainContent:
        in: body
        type: boolean
        about: Only return the main content of the page excluding headers, navs, footers, etc. This is a deterministic
          HTML-level filter applied before markdown is generated; no LLM is involved.
      onlyCleanContent:
        in: body
        type: boolean
        about: Beta. Run an additional LLM-based pass over the generated markdown to remove residual boilerplate
          that onlyMainContent can miss (cookie banners, ad blocks, social share widgets, breadcrumbs,…
      includeTags:
        in: body
        type: array
        about: Tags to include in the output.
      excludeTags:
        in: body
        type: array
        about: Tags to exclude from the output.
      maxAge:
        in: body
        type: integer
        about: Returns a cached version of the page if it is younger than this age in milliseconds. If a cached
          version of the page is older than this value, the page will be scraped. If you do not need extremely…
      minAge:
        in: body
        type: integer
        about: When set, the request only checks the cache and never triggers a fresh scrape. The value is in milliseconds
          and specifies the minimum age the cached data must be. If matching cached data exists, it…
      headers:
        in: body
        type: object
        about: Headers to send with the request. Can be used to send cookies, user-agent, etc.
      waitFor:
        in: body
        type: integer
        about: Specify a delay in milliseconds before fetching the content, allowing the page sufficient time to
          load. This waiting time is in addition to Firecrawl's smart wait feature.
      mobile:
        in: body
        type: boolean
        about: Set to true if you want to emulate scraping from a mobile device. Useful for testing responsive pages
          and taking mobile screenshots.
      skipTlsVerification:
        in: body
        type: boolean
        about: Skip TLS certificate verification when making requests.
      timeout:
        in: body
        type: integer
        about: Timeout in milliseconds for the request. Minimum is 1000 (1 second). Default is 60000 (60 seconds).
          Maximum is 300000 (300 seconds).
      parsers:
        in: body
        type: array
        about: 'Controls how files are processed during scraping. Each item is a parser name ("pdf" or "image")
          or a parser object. Both parsers are on by default. - pdf: PDF content is extracted and converted to…'
      actions:
        in: body
        type: array
        about: Actions to perform on the page before grabbing the content
      location:
        in: body
        type: object
        about: Location settings for the request. When specified, this will use an appropriate proxy if available
          and emulate the corresponding language and timezone settings. Defaults to 'US' if not specified.
      removeBase64Images:
        in: body
        type: boolean
        about: Removes all base 64 images from the markdown output, which may be overwhelmingly long. This does
          not affect html or rawHtml formats. The image's alt text remains in the output, but the URL is…
      blockAds:
        in: body
        type: boolean
        about: Enables ad-blocking and cookie popup blocking.
      proxy:
        in: body
        choices:
        - basic
        - enhanced
        - auto
        about: 'Specifies the type of proxy to use. - basic: Proxies for scraping sites with none to basic anti-bot
          solutions. Fast and usually works. - enhanced: Enhanced proxies for scraping sites with advanced…'
      storeInCache:
        in: body
        type: boolean
        about: If true, the page will be stored in the Firecrawl index and cache. Setting this to false is useful
          if your scraping activity may have data protection concerns. Using some parameters associated with…
      lockdown:
        in: body
        type: boolean
        about: If true, serves the request from Firecrawl's cache only and never makes an outbound request to the
          target URL. Designed for compliance-constrained or air-gapped environments where the scrape request…
      checkPromptInjection:
        in: body
        type: boolean
        about: When enabled, scans the page content for prompt injection attempts before any LLM-backed format (such
          as json, summary or question) runs. Works with any format except rawBase64. If an injection is…
      redactPII:
        in: body
        type: boolean
        about: Redact personally identifiable information from returned markdown. Pass true to use defaults, or
          an object to tune mode, entities, and replacement style.
      profile:
        in: body
        type: object
        about: Enable persistent browser storage across scrape and interact sessions. Pass a profile when scraping
          to preserve cookies, localStorage, and session data. Sessions with the same profile name share…
      threatProtection:
        in: body
        type: object
        about: Per-request Threat Protection override. Fields you provide replace the corresponding fields of your
          organization's policy for this request only; omitted fields keep their organization-level values.…
      auditMetadata:
        in: body
        type: object
        about: User attribution included with SIEM logging events when SIEM Logging is enabled for the organization.
      zeroDataRetention:
        in: body
        type: boolean
        about: If true, this will enable zero data retention for this scrape. To enable this feature, please contact
          help@firecrawl.dev
      alexandria:
        in: body
        type: object
        about: Execute one or more catalogued provider tools instead of scraping a URL. Cannot be combined with
          url, formats, or other scrape options (400); the only allowed sibling keys are timeout, origin, and…
      domainTools:
        in: body
        type: boolean
        about: When true on an ordinary URL scrape, data.tools lists tool contracts matched to the scraped page's
          domain (same DiscoveredTool shape as search). Requires the team's Alexandria access to be enabled…
      toolDetail:
        in: body
        choices:
        - compact
        - summary
        - full
        about: How much of each tool contract to return in data.tools when domainTools is true. compact returns
          only provider, capability, and description. summary returns the full tool entry without options and…
    price:
      per: call
      note: credits per page; see the pricing page
  batch-scrape:
    title: Scrape multiple URLs and optionally extract information using an LLM
    request: POST /batch/scrape
    params:
      urls:
        in: body
        type: array
        required: true
      webhook:
        in: body
        type: object
        about: A webhook specification object.
      maxConcurrency:
        in: body
        type: integer
        about: Maximum number of concurrent scrapes. This parameter allows you to set a concurrency limit for this
          batch scrape. If not specified, the batch scrape adheres to your team's concurrency limit.
      ignoreInvalidURLs:
        in: body
        type: boolean
        about: If invalid URLs are specified in the urls array, they will be ignored. Instead of them failing the
          entire request, a batch scrape using the remaining valid URLs will be created, and the invalid URLs…
      formats:
        in: body
        type: array
        about: 'Output formats to include in the response. You can specify one or more formats, either as strings
