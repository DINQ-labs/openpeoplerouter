id: justoneapi
title: Just One API
about: Public data from Xiaohongshu, Douyin, Weibo, Bilibili, Zhihu, Kuaishou, WeChat, TikTok, Instagram, YouTube,
  LinkedIn and more.
site: https://justoneapi.com
docs: https://docs.justoneapi.com
pricing: https://justoneapi.com/pricing
api: https://api.justoneapi.com
key:
  env: JUSTONEAPI_TOKEN
  query: token
operations:
  get-api-search:
    title: Cross-Platform Search
    about: Searches recent content across news, Weibo, WeChat, Zhihu, Douyin, Xiaohongshu, Bilibili, and Kuaishou
      with source and time filters. Use it to monitor a topic across multiple platforms.
    request: GET /api/search/v1
    params:
      keyword:
        about: 'Search query string. Supports these five syntax forms: - AND (&&): A && B matches content containing
          both A and B. - OR (||): A || B matches content containing A or B. - Exclusion (-): -A matches…'
      source:
        choices:
        - ALL
        - NEWS
        - WEIBO
        - WEIXIN
        - ZHIHU
        - DOUYIN
        - XIAOHONGSHU
        - BILIBILI
        - KUAISHOU
        about: 'Target social media platform for search filtering. Available Values: - ALL: All platforms - NEWS:
          News - WEIBO: Sina Weibo - WEIXIN: Weixin (WeChat) - ZHIHU: Zhihu - DOUYIN: Douyin (TikTok China) -…'
      start:
        about: Start time of the search period (yyyy-MM-dd HH:mm:ss). Required for initial request.
      end:
        about: End time of the search period (yyyy-MM-dd HH:mm:ss). Required for initial request.
      nextCursor:
        about: Pagination cursor provided by the 'nextCursor' field in the previous response.
    price:
      per: call
      note: billed per successful request; see pricing
  get-api-xiaohongshu-ask-dots:
    title: Ask Dots AI
    about: Queries Xiaohongshu (RedNote) Ask Dots AI with a keyword question. Use it to retrieve an AI answer for
      topic research and question exploration.
    request: GET /api/xiaohongshu/ask-dots
    params:
      keyword:
        required: true
        about: Question or keyword to submit to Ask Dots AI.
    price:
      per: call
      note: billed per successful request; see pricing
  get-api-xiaohongshu-hot-search:
    title: Hot Search
    about: Searches Xiaohongshu (RedNote) hot-content entries with optional keyword, content-category path, pagination,
      ranking metric, and time-range controls. Use it to support trend discovery, topic…
    request: GET /api/xiaohongshu/hot-search/v1
    params:
      searchWord:
        about: Search keyword.
      pageNum:
        type: integer
        about: Page number for pagination.
      orderBy:
        choices:
        - premium_imp_num
        - premium_good_read_rate
        - premium_read_num
        - premium_engage_num
        - premium_engage_rate
        - premium_like_num
        - premium_fav_num
        - premium_cmt_num
        about: 'Sort metric for the result set. Available Values: - premium_imp_num: Exposure - premium_good_read_rate:
          Read rate - premium_read_num: Read count - premium_engage_num: Engagement count -…'
      nd:
        choices:
        - DAY_3
        - DAY_7
        - DAY_14
        - DAY_30
        about: 'Time range in days. Available Values: - DAY_3: Last 3 days - DAY_7: Last 7 days - DAY_14: Last 14
          days - DAY_30: Last 30 days'
      noteContentCategory:
        about: 'Content category filter. Pass one complete Pugongying category path joined with # separators. You
          may pass a parent path or append one listed child with another #. Only one path is accepted.…'
    price:
      per: call
      note: billed per successful request; see pricing
  xiaohongshu-get-creator-hot-inspiration-feed:
    title: Hot Inspiration Feed
    about: Retrieves the Xiaohongshu (RedNote) creator center hot inspiration feed with cursor pagination. Use it
      to discover inspiration for content planning and explore further pages of creative ideas.
    request: GET /api/xiaohongshu/get-creator-hot-inspiration-feed/v1
    params:
      cursor:
        about: Leave empty for the first request. For the next page, pass the cursor value returned by the previous
          response.
    price:
      per: call
      note: billed per successful request; see pricing
  get-api-xiaohongshu-search-note:
    title: Keyword Note Search
    about: Searches Xiaohongshu (RedNote) notes by keyword with page-based pagination, sorting and note-type filters.
      The V2 noteTime filter may return notes outside the selected time range. This endpoint does…
    request: GET /api/xiaohongshu/search-note/v2
    params:
      keyword:
        required: true
        about: Search keyword.
      page:
        type: integer
        about: Page number for pagination. Start at 1, then increment page while keeping the keyword and filters
          unchanged.
      sort:
        choices:
        - general
        - popularity_descending
        - time_descending
        - comment_descending
        - collect_descending
        about: 'Sort order for the result set. Available Values: - general: General - popularity_descending: Popularity
          Descending - time_descending: Time Descending - comment_descending: Comment Descending -…'
      noteType:
        choices:
        - _0
        - _1
        - _2
        about: 'Note type filter. Available Values: - _0: General - _1: Video - _2: Normal'
      noteTime:
        choices:
        - ONE_DAY
        - ONE_WEEK
        - HALF_YEAR
        about: 'Note publish time filter. Results may include notes published outside the selected time range. Available
          Values: - ONE_DAY: Within one day - ONE_WEEK: Within a week - HALF_YEAR: Within half a year'
    price:
      per: call
      note: billed per successful request; see pricing
  get-api-xiaohongshu-search-note-2:
    title: Note Search
    about: Searches Xiaohongshu (RedNote) notes through the mobile-app search flow with pagination, sorting, note-type,
      and time filters. Use it to support iterative topic research and filtered content…
    request: GET /api/xiaohongshu/search-note/v4
    params:
      keyword:
        required: true
        about: Search keyword.
      page:
        type: integer
        about: Page number for pagination.
      sortType:
        choices:
        - general
        - popularity_descending
        - time_descending
        - comment_descending
        - collect_descending
        about: 'Sort order for the result set. Available Values: - general: General - popularity_descending: Popularity
          Descending - time_descending: Time Descending - comment_descending: Comment Descending -…'
      noteType:
        choices:
        - ALL
        - VIDEO_NOTE
        - NORMAL_NOTE
        about: 'Note type filter. Available Values: - ALL: No Limit - VIDEO_NOTE: Video Note - NORMAL_NOTE: Normal
          Note'
      timeFilter:
        choices:
        - ALL
        - ONE_DAY
        - ONE_WEEK
        - HALF_YEAR
        about: 'Publish time filter. Available Values: - ALL: No Limit - ONE_DAY: Within one day - ONE_WEEK: Within
          one week - HALF_YEAR: Within half a year'
    price:
      per: call
      note: billed per successful request; see pricing
  get-api-xiaohongshu-search-user:
    title: User Search
    about: Searches Xiaohongshu (RedNote) users by keyword with page-based pagination. Use it to support creator
      discovery, account research, and finding profiles related to a topic, name, or brand term.
    request: GET /api/xiaohongshu/search-user/v2
    params:
      keyword:
        required: true
        about: Search keyword.
      page:
        type: integer
        about: Page number for pagination.
    price:
      per: call
      note: billed per successful request; see pricing
  xiaohongshu-get-user-note-list:
    title: User Notes
    about: Reads a user's published public Xiaohongshu (RedNote) notes by user ID or supported profile URL, with
      lastCursor pagination. This endpoint does not create, upload or publish notes.
    request: GET /api/xiaohongshu/get-user-note-list/v4
    params:
      userId:
        required: true
        about: A Xiaohongshu user ID or a profile URL containing /user/profile/.
      lastCursor:
        about: Omit on the first request. For the next page, pass the last note's cursor value from the previous
          response.
    price:
      per: call
      note: billed per successful request; see pricing
  xiaohongshu-get-user-faved-note-list:
    title: User Favorited Notes
    about: Retrieves a Xiaohongshu (RedNote) user's favorited notes by user ID with cursor pagination. Use it to
      review a user's saved content and research content interests.
    request: GET /api/xiaohongshu/get-user-faved-note-list/v1
    params:
      userId:
        required: true
        about: Unique user identifier on Xiaohongshu.
      lastCursor:
        about: For the next page, pass the cursor from the previous response. Omit or pass an empty value for the
          first page.
    price:
      per: call
      note: billed per successful request; see pricing
  get-api-xiaohongshu-get-note-detail:
    title: Note Details
    about: Retrieves Xiaohongshu (RedNote) details for a note identified by a note ID or supported explore URL.
      Use it to perform direct note lookup and content review from stored identifiers or shared explore…
    request: GET /api/xiaohongshu/get-note-detail/v1
    params:
      noteId:
        required: true
        about: A Xiaohongshu note ID or an explore URL containing /explore/.
    price:
      per: call
      note: billed per successful request; see pricing
  get-api-xiaohongshu-get-note-detail-2:
    title: Note Details
    about: Retrieves Xiaohongshu (RedNote) video-note details by note ID. Use it to look up and process a known
      video note.
    request: GET /api/xiaohongshu/get-note-detail/v6
    params:
      noteId:
        required: true
        about: Unique note identifier on Xiaohongshu.
    price:
      per: call
      note: billed per successful request; see pricing
  get-api-xiaohongshu-get-note-comment:
    title: Note Comments
    about: Retrieves comments for a Xiaohongshu (RedNote) note with cursor pagination and normal, latest, or like-count
      sorting. Use it to support feedback review, discussion analysis, and comment moderation…
    request: GET /api/xiaohongshu/get-note-comment/v2
    params:
      noteId:
        required: true
        about: A Xiaohongshu note ID or an explore URL containing /explore/.
      lastCursor:
        about: Pagination cursor from the previous page (use the cursor value returned by the last response).
      sort:
        choices:
        - normal
        - latest
        - like_count
        about: 'Sort strategy for the result set. Available Values: - normal: Normal - latest: Latest - like_count:
          Like Count'
    price:
      per: call
      note: billed per successful request; see pricing
  get-api-xiaohongshu-get-note-sub-comment:
    title: Comment Replies
    about: Retrieves replies to a specific Xiaohongshu (RedNote) note comment with cursor pagination. Use it to
      inspect threaded discussions and continue through reply pages for feedback review or moderation.
    request: GET /api/xiaohongshu/get-note-sub-comment/v2
    params:
      noteId:
        required: true
        about: Unique note identifier on Xiaohongshu.
      commentId:
        required: true
        about: Unique comment identifier on Xiaohongshu.
      lastCursor:
        about: Pagination cursor from the previous page (use the cursor value returned by the last response).
    price:
      per: call
      note: billed per successful request; see pricing
  get-api-xiaohongshu-get-user:
    title: User Profile
    about: Retrieves a Xiaohongshu (RedNote) user profile from a user ID or supported profile URL. Use it to support
      creator discovery, account research, and reviewing a known profile before related content…
    request: GET /api/xiaohongshu/get-user/v3
    params:
      userId:
        required: true
        about: A Xiaohongshu user ID or a profile URL containing /user/profile/.
    price:
      per: call
      note: billed per successful request; see pricing
  get-api-xiaohongshu-search-recommend:
    title: Keyword Suggestions
    about: Returns Xiaohongshu (RedNote) search keyword suggestions for a submitted seed term. Use it to expand
      query sets, refine content-research searches, and plan SEO or programmatic SEO keyword coverage.
    request: GET /api/xiaohongshu/search-recommend/v1
    params:
      keyword:
        required: true
        about: Search keyword.
    price:
      per: call
      note: billed per successful request; see pricing
  xiaohongshu-get-topic-note-list:
    title: Topic Note List
    about: Retrieves Xiaohongshu (RedNote) notes associated with a topic ID, with hot or latest sorting and cursor
      pagination. Use it to support topic content discovery, trend review, and continuing through…
    request: GET /api/xiaohongshu/get-topic-note-list/v1
    params:
      topicId:
        required: true
        about: Unique topic identifier on Xiaohongshu.
      sort:
        choices:
        - time
        - hot
        about: 'Sort order for the result set. Available Values: - time: Latest - hot: Hot'
      cursor:
        about: Pagination cursor from the previous page.
    price:
      per: call
      note: billed per successful request; see pricing
  get-api-xiaohongshu-share-url-transfer:
    title: Share Link Resolution
    about: Resolve a supported Xiaohongshu (RedNote) short share link and return its public redirect URL. Use it
      to expand shared links before subsequent Xiaohongshu content lookup or processing.
    request: GET /api/xiaohongshu/share-url-transfer/v1
    params:
      shareUrl:
        required: true
        about: A Xiaohongshu (RedNote) short share URL beginning with http://xhslink.com/ or https://xhslink.com/.
    price:
      per: call
      note: billed per successful request; see pricing
  get-api-xiaohongshu-ec-search-products:
    title: Product Search
    about: Searches Xiaohongshu E-commerce (RedNote) products by keyword with page and search-ID pagination; pages
      after the first require the search ID returned by the initial search. Use it to discover…
    request: GET /api/xiaohongshu-ec/search-products/v1
    params:
      keyword:
        required: true
        about: Search keyword.
      page:
        about: Page number, starting from 1.
      searchId:
        about: Search ID returned by the first-page response; required when page is greater than 1.
    price:
      per: call
      note: billed per successful request; see pricing
  solar-cooperator-blogger:
    title: Creator Search
    about: Search Xiaohongshu Pugongying creators with campaign filters and sorting by followers, daily-note median
      reads or interactions, or quoted price. Use it to build a creator shortlist.
    request: GET /api/xiaohongshu-pgy/api/solar/cooperator/blogger/v2/v1
    params:
      searchType:
        choices:
        - NICKNAME
        - NOTE
        about: 'Search criteria type. Available Values: - NICKNAME: Search by nickname - NOTE: Search by note content'
      keyword:
        about: Search keyword.
      page:
        type: integer
        about: Page number.
      sort:
        choices:
        - DEFAULT
        - FANS
        - READ_MEDIAN
        - ENGAGEMENT_MEDIAN
        - PRICE_ASC
        - PRICE_DESC
        about: 'Creator search sorting. Values: FANS sorts by follower count descending; DEFAULT uses Pugongying
          intelligent ranking; READ_MEDIAN sorts by daily-note median reads descending; ENGAGEMENT_MEDIAN sorts…'
      fansNumberLower:
        type: integer
        about: Minimum number of fans.
      fansNumberUpper:
        type: integer
        about: Maximum number of fans.
      fansAge:
        choices:
        - ALL
        - LT_18
        - AGE_18_24
        - AGE_25_34
        - AGE_35_44
        - GT_44
        about: 'Target fans age group. Available Values: - ALL: All ages - LT_18: Under 18 - AGE_18_24: 18 to 24
          - AGE_25_34: 25 to 34 - AGE_35_44: 35 to 44 - GT_44: Above 44'
      fansGender:
        choices:
        - ALL
        - MALE_HIGH
        - FE_MALE_HIGH
        about: 'Target fans gender. Available Values: - ALL: All genders - MALE_HIGH: Mainly Male - FE_MALE_HIGH:
          Mainly Female'
      fansChildAgeInfo:
        about: 'Mother-and-baby audience stage filter. Pass Pugongying labels or numeric codes separated by English
          or Chinese commas. Available values:'
      gender:
        choices:
        - ALL
        - MALE
        - FEMALE
        about: 'KOL''s gender. Available Values: - ALL: All genders - MALE: Male - FEMALE: Female'
      location:
        about: Creator profile location filter. Pass Pugongying location labels separated by English or Chinese
          commas. Country, China province or region, city-level paths, and district Available country province…
      contentTag:
        about: 'Content category filter. Pass first-level or second-level category labels from Pugongying, separated
          by commas. Available values:'
      contentSceneLabel:
        about: 'Content scene label filter. Pass full Pugongying note category scene label paths separated by English
          or Chinese commas. Available values:'
      personalTags:
        about: 'Blogger persona tag filter. Pass one or more Pugongying persona labels separated by English or Chinese
          commas. Available values: - HR Example:'
      marketTarget:
        about: 'Marketing target filter. Pass one Pugongying marketing target value. Available values: - estimateAllCpm:
          Exposure - exposure performance - cost - mAccumImpNum: Exposure - exposure performance - scale…'
      audienceGroup:
        about: Audience target filter. Pass Pugongying audience group IDs (dmpGroupId) separated by English or Chinese
          commas. These IDs are dynamic and account-specific, so there is no fixed global value list. Use…
      top20CrowdsLabel:
        about: Top-20 audience filter. Pass top-level or child audience labels separated by commas; child labels
          are converted to Pugongying request values.
      industrySpecificCrowdsMotorDom:
        about: Industry-specific portrait filter. Pass Pugongying portrait value IDs or label values separated by
          commas.
      featureTags:
        about: Good-at content tag filter. Pass label values separated by commas.
      contentThemeLabel:
        about: Content theme filter. Pass Pugongying value IDs or label values separated by commas; labels are converted
          to value IDs.
      excludeLowActive:
        type: boolean
        about: Whether to exclude low-activity bloggers.
      fansNumUp:
        type: boolean
        about: Whether to exclude bloggers whose fan count is dropping.
      noteType:
        choices:
        - ALL
        - PHOTO_TEXT
        - VIDEO
        about: 'Note type filter. Values: ALL=all note types, PHOTO_TEXT=mainly photo-text notes, VIDEO=mainly video
          notes. Available Values: - ALL: All note types - PHOTO_TEXT: Mainly photo-text notes - VIDEO:…'
      industry:
        about: 'Pugongying industry preset for industry assistant style creator recommendations. Available Values:
          - BEAUTY_PERSONAL_CARE_BEAUTY: Beauty and personal care - beauty - BEAUTY_PERSONAL_CARE_SKINCARE:…'
      accumCommonImpMedinNum30d:
        about: Daily note exposure median range. Pass two comma-separated numeric bounds; use -1 or null for an
          open upper bound.
      readMidNor30:
        about: Daily note read median range. Pass two comma-separated numeric bounds; use -1 or null for an open
          upper bound.
      interMidNor30:
        about: Daily note interaction median range. Pass two comma-separated numeric bounds; use -1 or null for
          an open upper bound.
      thousandLikePercent30:
        about: Thousand-like note ratio range. Pass fractional ratios such as 0.4,null or percentage values such
          as 40,null.
      notePrice:
        about: Photo-text cooperation quote range. Pass two comma-separated numeric bounds; use -1 or null for an
          open upper bound.
      videoPrice:
        about: Video cooperation quote range. Pass two comma-separated numeric bounds; use -1 or null for an open
          upper bound.
      inviteReply48hNumRatio:
        about: 48-hour invite reply ratio range. Pass fractional ratios such as 0.9,0.95 or percentage values such
          as 90,95.
      progressOrderCnt:
        about: Current cooperation order count range. Pass two comma-separated numeric bounds.
      tradeType:
        about: Recent cooperation industry filter from Pugongying.
      tradeReportBrandIds:
        about: Recent cooperation brand IDs, separated by English or Chinese commas.
      excludeTradeReportBrandIds:
        type: boolean
        about: Whether to exclude creators who cooperated with the selected recent cooperation brands.
      accumCoopImpMedinNum30d:
        about: Cooperation note exposure median range. Pass two comma-separated numeric bounds.
      readMidCoop30:
        about: Cooperation note read median range. Pass two comma-separated numeric bounds.
      interMidCoop30:
        about: Cooperation note interaction median range. Pass two comma-separated numeric bounds.
      mCpuvNum30d:
        about: Cooperation note outer-store median range. Pass two comma-separated numeric bounds.
      estimatePictureCpm:
        about: Estimated photo-text CPM range. Pass two comma-separated numeric bounds.
      estimateVideoCpm:
        about: Estimated video CPM range. Pass two comma-separated numeric bounds.
      estimatePicReadPrice:
        about: Estimated photo-text read unit price range. Pass two comma-separated numeric bounds.
      estimateVideoReadPrice:
        about: Estimated video read unit price range. Pass two comma-separated numeric bounds.
      estimatePictureEngageCost:
        about: Estimated photo-text engagement unit price range. Pass two comma-separated numeric bounds.
      estimateVideoEngageCost:
        about: Estimated video engagement unit price range. Pass two comma-separated numeric bounds.
      estimateCpuv30d:
        about: Estimated outer-store visit unit price range. Pass two comma-separated numeric bounds.
      kliveCnt30d:
        about: Live count in the last 30 days range. Pass two comma-separated numeric bounds.
      avgLiveViewerNum:
        about: Average live viewer count range. Pass two comma-separated numeric bounds.
      avgAgmv90d:
        about: Average live sales amount range. Pass two comma-separated numeric bounds.
      similarUserId:
        about: Similar creator user ID. similarUserId and similarWord must be provided together.
      similarWord:
        about: Similar creator keyword shown by Pugongying. similarUserId and similarWord must be provided together.
      fansLocation:
        about: 'Follower audience location filter. Pass Pugongying follower-region labels separated by English or
          Chinese commas. Country, China province, and city-level paths are supported; district Examples:'
    price:
      per: call
      note: billed per successful request; see pricing
  user-blogger-userid:
    title: Creator Profile
    about: Retrieve a Xiaohongshu Pugongying creator profile and cooperation quote information for a known user
      ID. Use it to review a creator before campaign outreach or pricing comparison.
    request: GET /api/xiaohongshu-pgy/api/solar/cooperator/user/blogger/userId/v1
    params:
      userId:
        required: true
        about: Blogger's user ID.
    price:
      per: call
      note: billed per successful request; see pricing
  kol-datav3-datasummary:
    title: Data Summary
    about: Retrieve the Xiaohongshu Pugongying data summary for a creator's daily or cooperation notes. Use it to
      compare aggregate creator performance between business modes.
    request: GET /api/xiaohongshu-pgy/api/solar/kol/dataV3/dataSummary/v1
    params:
      userId:
        required: true
        about: KOL's user ID.
      business:
        choices:
        - DAILY_NOTE
        - COOPERATE_NOTE
        about: 'Business type. Available Values: - DAILY_NOTE: Daily notes - COOPERATE_NOTE: Cooperative notes'
    price:
      per: call
      note: billed per successful request; see pricing
  data-userid-fans-overall-new-history:
    title: Follower Growth History
    about: Retrieve Xiaohongshu Pugongying follower history for a creator over the selected 30- or 90-day period.
      Use it to track total followers or new-follower growth over time.
    request: GET /api/xiaohongshu-pgy/api/solar/kol/data/userId/fans_overall_new_history/v1
    params:
      userId:
        required: true
        about: KOL's user ID.
      dateType:
        choices:
        - DAY_30
        - DAY_90
        about: 'Time range for data. Available Values: - DAY_30: Last 30 days - DAY_90: Last 90 days'
      increaseType:
        choices:
        - FANS_TOTAL
        - FANS_INCREASE
        about: 'Type of growth data. Available Values: - FANS_TOTAL: Total fans - FANS_INCREASE: New fans increase'
    price:
      per: call
      note: billed per successful request; see pricing
  kol-datav3-fanssummary:
    title: Follower Summary
    about: Retrieve the Xiaohongshu Pugongying follower summary for a known creator. Use it to review the account's
      aggregate audience status before deeper demographic or trend analysis.
    request: GET /api/xiaohongshu-pgy/api/solar/kol/dataV3/fansSummary/v1
    params:
      userId:
        required: true
        about: KOL's user ID.
    price:
      per: call
      note: billed per successful request; see pricing
  solar-kol-get-similar-kol:
    title: Similar Creators
    about: Retrieve paginated Xiaohongshu Pugongying creators similar to a known creator. Use it to expand a campaign
      shortlist from an existing reference account.
    request: GET /api/xiaohongshu-pgy/api/solar/kol/get_similar_kol/v1
    params:
      userId:
        required: true
        about: KOL's user ID.
      pageNum:
        type: integer
        about: Page number for results.
    price:
      per: call
      note: billed per successful request; see pricing
  kol-datav2-kolfeaturetags:
    title: Creator Feature Tags
    about: Retrieve Xiaohongshu Pugongying feature tags assigned to a known creator. Use it to understand the creator's
      recognized formats, styles, or content strengths.
    request: GET /api/xiaohongshu-pgy/api/solar/kol/dataV2/kolFeatureTags/v1
    params:
      userId:
        required: true
        about: KOL's user ID.
    price:
      per: call
      note: billed per successful request; see pricing
  kol-datav2-kolcontenttags:
    title: Creator Content Tags
    about: Retrieve Xiaohongshu Pugongying content category tags associated with a known creator. Use it to understand
      the subjects and categories represented in the creator's published content.
    request: GET /api/xiaohongshu-pgy/api/solar/kol/dataV2/kolContentTags/v1
    params:
      userId:
        required: true
        about: KOL's user ID.
    price:
      per: call
      note: billed per successful request; see pricing
  kol-datav3-notesrate:
    title: Note Performance Metrics
    about: Retrieve Xiaohongshu Pugongying aggregate note performance metrics for a creator with business, note-type,
      date-range, and advertisement filters. Use it to compare content performance across selected…
