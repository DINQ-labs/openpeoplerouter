id: millionverifier
title: MillionVerifier
about: Low-cost real-time email verification.
site: https://www.millionverifier.com
docs: https://developer.millionverifier.com/
pricing: https://www.millionverifier.com/pricing
api: https://api.millionverifier.com/api/v3
key:
  env: MILLIONVERIFIER_API_KEY
  query: api
operations:
  verify:
    title: Whether an address accepts mail
    request: GET /
    params:
      email: {required: true}
      timeout: {type: integer, about: 2-60 seconds}
    price: {credits: 1, per: call}
    jobs:
      verify_email:
        needs: [[email]]
        send: {email: email}
        result: '@'
        fields:
          email: email
          status: result
          deliverable: result == 'ok'
          catch_all: result == 'catch_all'
          disposable: result == 'disposable'
  credits:
    title: Credits left
    request: GET /credits
    price: {usd: 0, per: call}
