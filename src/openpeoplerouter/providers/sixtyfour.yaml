    price:
      per: call
      note: credits charged are in cost_credits on each response
  qa-agent-async:
    title: QA Agent (Async)
    about: Run a research agent that answers a question about a person or company; returns a job ID to poll.
    request: POST /qa-agent-async
    params:
      data:
        in: body
        type: object
        required: true
        about: Lead or record to evaluate against the qualification criteria.
      qualification_criteria:
        in: body
        type: array
        required: true
        about: List of criteria the agent will score the data against.
      references:
        in: body
        type: array
        about: Optional reference URLs the agent may use as evidence.
      struct:
        in: body
        type: object
        about: Mapping of extra output fields and their descriptions.
      max_tool_calls:
        in: body
        type: integer
        about: Maximum tool calls the agent may make per evaluation.
      webhook_url:
        in: body
        about: HTTPS URL that receives the result payload when the async job completes.
      dispatch_id:
        in: body
        about: 'Async endpoints only: a client-generated idempotency key for the dispatch. Reusing the same key
          for the same organization returns the existing job instead of starting and billing a duplicate.'
    price:
      per: call
      note: credits charged are in cost_credits on each response
  qa-agent:
    title: QA Agent (Sync)
    about: Run a research agent that answers a question about a person or company.
    request: POST /qa-agent
    params:
