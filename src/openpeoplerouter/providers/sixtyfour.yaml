id: sixtyfour
title: Sixtyfour
about: Research agents that find emails and phones, enrich LinkedIn profiles and answer open questions about people
  and companies.
site: https://www.sixtyfour.ai
docs: https://docs.sixtyfour.ai
pricing: https://docs.sixtyfour.ai/guides/credits-and-pricing
api: https://api.sixtyfour.ai
key:
  env: SIXTYFOUR_API_KEY
  header: x-api-key
operations:
  check-balance:
    title: Check Balance
    about: Returns the current credit balance for the organization associated with the API key.
    request: GET /check-balance
    price:
      usd: 0
      per: call
  company-intelligence-async:
    title: Company Intelligence (Async)
    about: Find and enrich a single company; returns a job ID to poll.
    request: POST /company-intelligence-async
    params:
      struct:
        in: body
        type: object
        required: true
        about: Mapping of output field name to natural-language description of what to extract. A field that asks
          for an image (a headshot, a logo, a screenshot of a page) is returned as an image URL on…
      find_people:
        in: body
        type: boolean
        about: If true, also discover key people at the company.
      people_focus_prompt:
        in: body
        about: Natural-language description of which people to surface when find_people=true.
      lead_struct:
        in: body
        type: object
        about: Output schema for each discovered person when find_people=true.
      research_plan:
        in: body
        about: Optional natural-language plan that guides the research agent.
      tier:
        in: body
        about: Quality and cost tier for the research agent.
      full_org_chart:
        in: body
        type: boolean
        about: If true, return the full org chart instead of a focused list.
      webhook_url:
        in: body
        about: HTTPS URL that receives the result payload when the async job completes.
      field_confidence:
        in: body
        type: boolean
        about: If true, return each requested field's confidence (0-100), justification and source URLs, nested
          like the request.
      target_company:
        in: body
        type: object
        required: true
        about: Company identifiers (e.g. company_name, domain, linkedin).
    price:
      per: call
      note: credits charged are in cost_credits on each response
  company-intelligence:
    title: Company Intelligence (Sync)
    about: Find and enrich a single company.
    request: POST /company-intelligence
    params:
      struct:
        in: body
        type: object
        required: true
        about: Mapping of output field name to natural-language description of what to extract. A field that asks
          for an image (a headshot, a logo, a screenshot of a page) is returned as an image URL on…
      find_people:
        in: body
        type: boolean
        about: If true, also discover key people at the company.
      people_focus_prompt:
        in: body
        about: Natural-language description of which people to surface when find_people=true.
      lead_struct:
        in: body
        type: object
        about: Output schema for each discovered person when find_people=true.
      research_plan:
        in: body
        about: Optional natural-language plan that guides the research agent.
      tier:
        in: body
        about: Quality and cost tier for the research agent.
      full_org_chart:
        in: body
        type: boolean
        about: If true, return the full org chart instead of a focused list.
      webhook_url:
        in: body
        about: HTTPS URL that receives the result payload when the async job completes.
      field_confidence:
        in: body
        type: boolean
        about: If true, return each requested field's confidence (0-100), justification and source URLs, nested
          like the request.
      target_company:
        in: body
        type: object
        required: true
        about: Company identifiers (e.g. company_name, domain, linkedin).
    price:
      per: call
      note: credits charged are in cost_credits on each response
  enrich-linkedin:
    title: Enrich LinkedIn Profile
    about: Fetch a LinkedIn profile and extract structured fields in a single LLM call.
    request: POST /enrich-linkedin
    params:
      linkedin_url:
        in: body
        required: true
        about: Full LinkedIn profile or company URL to enrich.
      struct:
        in: body
        type: object
        about: Mapping of output field name to natural-language description of what to extract. A field that asks
          for an image (a headshot, a logo, a screenshot of a page) is returned as an image URL on…
    price:
      per: call
      note: credits charged are in cost_credits on each response
  find-email-async:
    title: Find Email (Async)
    about: Find a single person's email; returns a job ID to poll.
    request: POST /find-email-async
    params:
      lead:
        in: body
        type: object
        required: true
        about: Single lead to process. Provide any combination of name, email, company, linkedin, etc.
      verify_emails:
        in: body
        type: boolean
        about: SMTP-verify each discovered email before returning it.
      mode:
        in: body
        choices:
        - PROFESSIONAL
        - PERSONAL
        about: 'Email type to discover: ''PROFESSIONAL'' (work) or ''PERSONAL''.'
      webhook_url:
        in: body
        about: HTTPS URL that receives the result payload when the async job completes.
    price:
      per: call
      note: credits charged are in cost_credits on each response
  find-email:
    title: Find Email (Sync)
    about: Find a single person's email address.
    request: POST /find-email
    params:
      lead:
        in: body
        type: object
        required: true
        about: Single lead to process. Provide any combination of name, email, company, linkedin, etc.
      verify_emails:
        in: body
        type: boolean
        about: SMTP-verify each discovered email before returning it.
      mode:
        in: body
        choices:
        - PROFESSIONAL
        - PERSONAL
        about: 'Email type to discover: ''PROFESSIONAL'' (work) or ''PERSONAL''.'
      webhook_url:
        in: body
        about: HTTPS URL that receives the result payload when the async job completes.
    price:
      per: call
      note: credits charged are in cost_credits on each response
    jobs:
      find_contact:
        needs:
        - - linkedin_url
        - - full_name
          - company
        - - full_name
          - company_domain
        send:
          linkedin_url: lead.linkedin
          full_name: lead.name
          company: lead.company
          company_domain: lead.domain
        result: '[@][?email] | [0]'
        fields:
          email: email[0][0]
          email_status: email[0][1]
          name: name
  find-phone-async:
    title: Find Phone (Async)
    about: Find a single person's phone number; returns a job ID to poll.
    request: POST /find-phone-async
    params:
      lead:
        in: body
        type: object
        required: true
        about: Single lead to process. Provide any combination of name, email, company, linkedin, etc.
      webhook_url:
        in: body
        about: HTTPS URL that receives the result payload when the async job completes.
    price:
      per: call
      note: credits charged are in cost_credits on each response
  find-phone:
    title: Find Phone (Sync)
    about: Find a single person's phone number.
    request: POST /find-phone
    params:
      lead:
        in: body
        type: object
        required: true
        about: Single lead to process. Provide any combination of name, email, company, linkedin, etc.
      webhook_url:
        in: body
        about: HTTPS URL that receives the result payload when the async job completes.
    price:
      per: call
      note: credits charged are in cost_credits on each response
    jobs:
      find_contact:
        needs:
        - - linkedin_url
        - - full_name
          - company
        send:
          linkedin_url: lead.linkedin
          full_name: lead.name
          company: lead.company
        result: '[@][?phone] | [0]'
        fields:
          phone: phone
          name: name
  job-status:
    title: Job Status
    about: Poll an async job and retrieve results when complete. Authorized snapshots are cached for up to 10 seconds.
      API-key and OAuth machine callers share an organization polling budget of 300/minute with…
    request: GET /job-status/{job_id}
    params:
      job_id:
        in: path
        required: true
      cost_units:
        choices:
        - cents
        - credits
        about: Compatibility option. Both legacy cost fields and credit fields are returned for either value.
    price:
      usd: 0
      per: call
  people-intelligence-async:
    title: People Intelligence (Async)
    about: Find and enrich a single person; returns a job ID to poll.
    request: POST /people-intelligence-async
    params:
      struct:
        in: body
        type: object
        about: Mapping of output field name to natural-language description of what to extract. A field that asks
          for an image (a headshot, a logo, a screenshot of a page) is returned as an image URL on…
      research_plan:
        in: body
        about: Optional natural-language plan that guides the research agent.
      tier:
        in: body
        about: Quality and cost tier for the research agent.
      webhook_url:
        in: body
        about: HTTPS URL that receives the result payload when the async job completes.
      field_confidence:
        in: body
        type: boolean
        about: If true, return each requested field's confidence (0-100), justification and source URLs, nested
          like the request.
      lead_info:
        in: body
        type: object
        required: true
        about: Single lead to process. Provide any combination of name, email, company, linkedin, etc.
      graph:
        in: body
        type: boolean
        about: 'Only with tier "scout": set true to run Scout as an Atlas run. The run is saved as an Atlas investigation
          you can open in the Sixtyfour app, export, and continue later with investigation_id; the…'
      include_workspace:
        in: body
        type: boolean
        about: 'For Atlas runs (xhigh, or scout with graph), include workspace files alongside structured output
          (default: true). Set false to omit them. Job status reads them from the investigation, so it shows the…'
      investigation_id:
        in: body
        about: For Atlas runs (xhigh, or scout with graph), continue an existing investigation instead of creating
          one. The run reuses that investigation's graph and workspace, so a follow-up builds on the earlier…
      investigation_name:
        in: body
        about: For Atlas runs, the title of a newly created investigation. Ignored when resuming via investigation_id;
          when unset the title is derived from lead_info.
      private:
        in: body
        type: boolean
        about: 'Make the run visible only to you, not your team: its result, status and usage log. With an API key,
          the run is private to the person who created the key. Your team must allow private runs. Supported…'
      relentless:
        in: body
        type: boolean
        about: 'For Atlas runs with struct: research until the budget runs out. By default a run may stop once every
          requested field is answered, and is then charged for the research it used (at least one unit).'
      max_credits:
        in: body
        type: integer
        about: 'For Atlas runs, how much research to buy, in credits: one unit of the tier price by default, up
          to 10 units. A unit is 250 credits on xhigh and 50 on scout with graph. Research scales with the…'
      max_minutes:
        in: body
        type: integer
        about: 'For Atlas runs, the longest the run may research, in minutes of working time: time spent waiting
          to retry after a temporary failure does not count. When it is reached the run writes up what it found…'
      dispatch_id:
        in: body
        about: 'Async endpoints only: a client-generated idempotency key for the dispatch. Reusing the same key
          for the same organization returns the existing job instead of starting and billing a duplicate.'
      exclusive_run:
        in: body
        type: boolean
        about: 'Atlas runs on an existing investigation only: refuse with 409 while that investigation already has
          a run starting or running, instead of starting and billing a second one.'
    price:
      per: call
      note: credits charged are in cost_credits on each response
  people-intelligence:
