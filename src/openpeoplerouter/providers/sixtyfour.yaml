          for the same organization returns the existing job instead of starting and billing a duplicate.'
    price:
      per: call
      note: credits charged are in cost_credits on each response
  reverse-email-async:
    title: Reverse Email Lookup (Async)
    about: Resolve a person from their email address; returns a job ID to poll.
    request: POST /reverse-email-async
    params:
      lead:
        in: body
        type: object
        required: true
        about: Single lead with at least an email field to reverse-lookup.
      webhook_url:
        in: body
        about: HTTPS URL that receives the result payload when the async job completes.
    price:
      per: call
      note: credits charged are in cost_credits on each response
  reverse-email:
    title: Reverse Email Lookup (Sync)
    about: Resolve a person from their email address.
    request: POST /reverse-email
    params:
      lead:
        in: body
        type: object
        required: true
        about: Single lead with at least an email field to reverse-lookup.
      webhook_url:
        in: body
        about: HTTPS URL that receives the result payload when the async job completes.
    price:
      per: call
      note: credits charged are in cost_credits on each response
  reverse-phone-async:
    title: Reverse Phone Lookup (Async)
    about: Resolve a person from their phone number; returns a job ID to poll.
    request: POST /reverse-phone-async
    params:
      lead:
        in: body
        type: object
        required: true
        about: Single lead with at least a phone field to reverse-lookup.
      webhook_url:
        in: body
        about: HTTPS URL that receives the result payload when the async job completes.
    price:
      per: call
      note: credits charged are in cost_credits on each response
  reverse-phone:
    title: Reverse Phone Lookup (Sync)
    about: Resolve a person from their phone number.
    request: POST /reverse-phone
    params:
      lead:
        in: body
        type: object
        required: true
        about: Single lead with at least a phone field to reverse-lookup.
      webhook_url:
        in: body
        about: HTTPS URL that receives the result payload when the async job completes.
    price:
      per: call
      note: credits charged are in cost_credits on each response
  verify-email:
    title: Verify Email
    about: Check whether one email address can receive mail. Responds in under a second for most addresses and within
      about two seconds at most; UNKNOWN results are not charged.
    request: POST /verify-email
    params:
      email:
        in: body
        required: true
        about: The email address to check.
    price:
      per: call
      note: credits charged are in cost_credits on each response
    jobs:
      verify_email:
        needs:
        - - email
        send:
          email: email
        result: '@'
        fields:
          email: email
          status: status
          score: score
          deliverable: status == 'OK'
  search-download:
    title: Download Search Results
    about: Generate a 15-minute signed download URL for a search result.
    request: GET /search/download
    params:
      resource_handle_id:
        required: true
        about: Resource handle ID for the search result
    price:
      per: call
      note: credits charged are in cost_credits on each response
  search-filter-field-values:
    title: Filter Field Values
    about: Get the top values by count for a single filter-search field.
    request: POST /search/filter-field-values
    params:
      mode:
        in: body
        choices:
        - people
        - company
        about: 'Search mode: ''people'' or ''company''.'
      field:
        in: body
        required: true
        about: Canonical field path to aggregate values for.
      top_k:
        in: body
        type: integer
        about: Maximum number of top values to return.
      filters:
        in: body
        type: object
        about: Raw OpenSearch DSL filters that scope the aggregation.
      simple_filters:
        in: body
        type: object
        about: MongoDB-style filters that scope the aggregation.
    price:
      per: call
      note: credits charged are in cost_credits on each response
  search-filter-capabilities:
    title: Filter Search Capabilities
    about: Get the fields, operators, and limits supported by filter search.
    request: GET /search/filter-capabilities
    params:
      mode:
        about: 'Search mode: ''company'' or ''people''.'
      refresh:
        type: boolean
        about: Force a mapping refresh instead of using cached capabilities.
    price:
      per: call
      note: credits charged are in cost_credits on each response
  search-lookalike:
    title: Lookalike Search Status
    about: Poll lookalike progress and return generated filters on completion.
    request: GET /search/lookalike/{task_id}
    params:
      task_id:
        in: path
        required: true
      include_filters:
        type: boolean
      include_analysis:
        type: boolean
    price:
      per: call
      note: credits charged are in cost_credits on each response
  search-export:
    title: Search Export
    about: Export search results as a CSV file. Poll /search/status/{task_id} for a presigned download URL when
      complete.
    request: POST /search/export
    params:
      search_id:
        in: body
        about: Search history ID returned by a previous search. Replays only the query shape; pass exclusions again
          on this request if they should apply.
      parsed_query:
        in: body
        type: object
        about: Structured filter set returned by a previous search.
      mode:
        in: body
        choices:
        - people
        - company
        about: Search mode; inferred from DB when not set.
      max_results:
        in: body
        type: integer
        about: Maximum number of results to return across pages.
      exclude_public_ids:
        in: body
        type: array
        about: People-mode inline identifiers to exclude from results, applied as a post-filter. Accepts LinkedIn
          public IDs or profile URLs. For company searches, use exclude_entity_ids. Max 1000.
      exclude_entity_ids:
        in: body
        type: array
        about: 'Inline identifiers to exclude from results, applied as a post-filter. People mode: LinkedIn public
          IDs or profile URLs. Company mode: numeric LinkedIn company IDs, company URLs/slugs, or exact…'
      exclude_list_ids:
        in: body
        type: array
        about: Saved exclusion-list IDs to apply as a post-filter. Each list's entity type must match the search
          mode (person lists for people searches, company lists for company searches). Max 5 (10 for…
    price:
      per: call
      note: credits charged are in cost_credits on each response
  search-limits:
    title: Search Limits
    request: GET /search/limits
    price:
      per: call
      note: credits charged are in cost_credits on each response
  search-query:
    title: Search Query
    about: 'Run a search query. Provide exactly one query source: query, simple_filters, filters, parsed_query,
      or search_id. For pagination, pass cursor alone.'
    request: POST /search/query
    params:
      simple_filters:
        in: body
        type: object
        about: MongoDB-style filters; the API translates them to DSL.
      filters:
        in: body
        type: object
        about: Raw OpenSearch DSL filters.
      parsed_query:
        in: body
        type: object
        about: Structured filter set returned by a previous search.
      search_id:
        in: body
        about: Search history ID returned by a previous search. Replays only the query shape; pass exclusions again
          on this request if they should apply.
      query:
        in: body
        about: Natural-language query. Mutually exclusive with simple_filters / filters / parsed_query / search_id.
          Supported for people and company search.
      query_label:
        in: body
        about: Display label stored with a structured search. It does not affect the query or results. Oversized
          labels are truncated.
      persist_history:
        in: body
        type: boolean
        about: Set false to skip the canonical search-history write for this search (e.g. a page load that replays
          a search another surface already recorded). Replays via search_id never write history regardless.
      from_offset:
        in: body
        type: integer
        about: Company-mode page offset for page-numbered navigation (mirrors OpenSearch from). Offset pages return
          no cursor and are not persisted to history; page one (offset 0 or omitted) behaves exactly as…
      cursor:
        in: body
        about: Opaque pagination cursor returned by a previous response.
      mode:
        in: body
        choices:
        - people
        - company
        about: Search mode; inferred from DB when using search_id.
      page_size:
        in: body
        type: integer
        about: Maximum number of results per page (1-100). Pages may contain fewer rows while more results remain
          (e.g. with exclusion filtering); rely on has_more/next_cursor, never on page fullness.
      max_results:
        in: body
        type: integer
        about: 'Maximum number of results to return across pages. Omit to get the default for your credential: 1000
          for API keys, the platform ceiling for signed-in sessions. Values above your ceiling are rejected.'
      output_shape:
        in: body
        choices:
        - raw
        - workflow
        about: Return raw OpenSearch rows or canonical workflow LEAD/COMPANY rows. The selected shape is retained
          by cursor continuations.
      selected_company_names:
        in: body
        type: array
        about: Platform-only exact company selections. The backend resolves names to company IDs instead of trusting
          client-supplied OpenSearch IDs. Excess hints are ignored; parsed-query name matching still…
      selected_company_ids:
        in: body
        type: object
        about: Platform-only name -> company ID map from autocomplete. Each pair is verified against the company
          index before use; unverified pairs fall back to name resolution. Disambiguates companies sharing a…
      exclude_public_ids:
        in: body
