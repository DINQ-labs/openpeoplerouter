  post-search-lookalike:
    title: Start Lookalike Search (Async)
    about: Resolve seeds and start the async lookalike workflow.
    request: POST /search/lookalike
    params:
      csv_resource_handle_id:
        in: body
        about: Resource handle returned by POST /storage/csv/upload.
      linkedin_urls:
        in: body
        type: array
        about: LinkedIn profile URLs to seed from (max 1,000).
      guidance:
        in: body
        about: Optional natural-language guidance for cohort analysis.
      analysis_sample_size:
