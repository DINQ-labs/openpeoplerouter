id: theirstack
title: TheirStack
about: Companies by the technologies they use and the jobs they post, from millions of job listings.
site: https://theirstack.com
docs: https://theirstack.com/en/docs/api-reference
pricing: https://theirstack.com/en/pricing
api: https://api.theirstack.com
key:
  env: THEIRSTACK_API_KEY
  bearer: true
operations:
  get-teams-credits-consumption:
    title: Get Daily Credit Usage
    about: Retrieve daily API and UI credit consumption for your team, by charge date. Set group_by=search_pattern
      to group each day's credits by search patterns with the same stable filters. Charges without a…
    request: GET /v0/teams/credits_consumption
    params:
      start_datetime:
        about: Start datetime in ISO format (e.g., 2023-01-01T00:00:00)
      end_datetime:
        about: End datetime in ISO format (e.g., 2023-01-01T23:59:59)
      group_by: {}
      search_pattern_key:
        about: Only charges associated with this canonical search pattern.
      is_origin_app:
        type: boolean
      origin: {}
      types:
        type: array
        about: Filter by search type.
      endpoints:
        type: array
        about: Match any exact request URL path; unassigned selects charges without a recorded endpoint. Intersects
          the singular endpoint filter.
      status_codes:
        type: array
        about: Match any HTTP response status code.
      origins:
        type: array
        about: Match any recorded origin; webhook requires a linked webhook event and unassigned selects missing
          attribution. Intersects the singular origin filter.
      endpoint:
        about: Exact request URL path, e.g. /v1/jobs/search; host and query string are ignored.
      timezone:
        about: IANA timezone, such as Europe/Madrid.
    price:
      credits: 1
      per: result
      note: one API credit per company or job returned
  get-credit-consumption-facets:
    title: List Credit Usage Sources
    about: List the endpoints and origins that charged credits to the team in a date range (the last 30 days by
      default). Use it to pick values for the endpoint and origin filters of the daily credit…
    request: GET /v0/teams/credits_consumption/facets
    params:
      start_datetime: {}
      end_datetime: {}
    price:
      credits: 1
      per: result
      note: one API credit per company or job returned
  get-catalog-keywords:
    title: Find Technologies And Topics
    about: 'List all keywords tracked by TheirStack, including both technologies and buying intent topics. Search
      for any keyword and filter by one or more categories. Free: it doesn''t consume credits. - To get…'
    request: GET /v0/catalog/keywords
    params:
      keyword_type:
        about: Keyword type to filter by
      keyword_type_not:
        type: array
        about: Exclude keywords of these types
      name_pattern:
        about: Case-insensitive text to search for in the keyword name
      slug:
        type: array
        about: Keyword slug of a single keyword
      slugs:
        type: array
        about: Keyword slugs of one or many keywords
      category_pattern:
        about: Case-insensitive text to search for in the keyword category. For example, data to find 'data tools'.
      category_slug:
        about: Keyword category slug
      parent_category_slug:
        about: Keyword parent category slug
      parent_category_pattern:
        about: Case-insensitive text to search for in the keyword parent category name
      q:
        about: General search query. Searches across keyword name, keyword type, category, and parent category (case-insensitive).
          Results where the keyword name starts with the query are ranked first.
      starts_with:
        about: Filter keywords whose name starts with this string (e.g. 'A' for glossary). Special value '__other__'
          selects keywords whose name does not start with letters A-Z.
      include_metadata:
        type: boolean
        about: Deprecated, metadata is always included now
      page:
        type: integer
        about: Page number.
      limit:
        type: integer
        about: Number of results per page
    price:
      credits: 1
      per: result
      note: one API credit per company or job returned
  catalog-jobs-companies-per-job-country-code:
    title: Count Jobs By Country
    about: 'List every country code with the number of jobs located in that country and the number of companies
      hiring there. Search by country name in English. Free: it doesn''t consume credits.'
    request: GET /v0/catalog/jobs_companies_per_job_country_code
    params:
      country:
        about: Name of a country. Will return the country matching their name in English
      page:
        type: integer
        about: Page number.
      limit:
        type: integer
        about: Number of results per page
    price:
      credits: 1
      per: result
      note: one API credit per company or job returned
  catalog-companies-per-company-country-code:
    title: Count Companies By Country
    about: 'List every ISO country code with the number of companies headquartered in that country, for geographic
      distribution analysis. Free: it doesn''t consume credits.'
    request: GET /v0/catalog/companies_per_company_country_code
    params:
      country:
        about: Name of a country. Will return the country matching their name in English
      page:
        type: integer
        about: Page number.
      limit:
        type: integer
        about: Number of results per page
    price:
      credits: 1
      per: result
      note: one API credit per company or job returned
  get-catalog-locations:
    title: Find Locations
    about: Search for geographic locations by name or ID to retrieve standardized location data including city,
      region, and country. Use the location IDs in the job_location_or and job_location_not filters of a…
    request: GET /v0/catalog/locations
    params:
      id:
        type: integer
        about: The ids of the locations
      name:
        about: Search value for the location, this will be used to filter the locations by name
      country_code:
        about: The country code of the location, all the returned locations will be filtered by this country code
      feature_code:
        type: array
        about: GeoNames feature code(s) to filter by location type (e.g. PPL=populated place, ADM1=first-order admin
          division). See https://www.geonames.org/export/codes.html
      offset:
        type: integer
        about: The offset of the results
      limit:
        type: integer
        about: The limit of the results
    price:
      credits: 1
      per: result
      note: one API credit per company or job returned
  get-catalog-industries:
    title: List Industries
    about: 'List the industries and their IDs, with how many jobs and companies we have in each, and search them
      by name. Use the IDs in the industry filters of a job or company search. Free: it doesn''t consume…'
    request: GET /v0/catalog/industries
    params:
      industry:
        about: Name of an industry, case-insensitive. Will return industries that contain the given string either
          in their name, hierarchy or description
      page:
        type: integer
        about: Page number.
      limit:
        type: integer
        about: Number of results per page
    price:
      credits: 1
      per: result
      note: one API credit per company or job returned
  list-keyword-categories:
    title: List Keyword Categories
    about: Returns a list of main keyword categories (technologies and buying intents) with the number of keywords
      and companies in each. Optionally filters to return a specific category if category_slug is…
    request: GET /v1/catalog/keywords/categories
    params:
      category_slug:
        about: Optional category slug to filter and return only a specific category
    price:
      credits: 1
      per: result
      note: one API credit per company or job returned
  list-keyword-subcategories:
    title: List Keyword Subcategories
    about: 'Returns a list of keyword subcategories with their keywords. Behavior: returns all subcategories if
      no parameters are provided; returns all subcategories for a specific parent category if only…'
    request: GET /v1/catalog/keywords/subcategories
    params:
      subcategory_slug:
        about: Subcategory slug to filter by a specific subcategory. Must be used together with category_slug.
      category_slug:
        about: Parent category slug to filter subcategories. If provided with subcategory_slug, returns only that
          specific subcategory. If provided alone, returns all subcategories for that parent category.
      num_technologies_per_category:
        type: integer
        about: Number of keywords per category to include in the response
    price:
      credits: 1
      per: result
      note: one API credit per company or job returned
  search-jobs:
    title: Search Jobs
    about: Search and filter job postings collected from company career sites and job boards. Filter by job title,
      keywords in the job description, company (name, domain or LinkedIn URL), location and country,…
    request: POST /v1/jobs/search
    params:
      order_by:
        in: body
        type: array
        about: List of column objects. You can pass several columns to order by, in order of priority. Only field
          is required, desc is True by default.
      offset:
        in: body
        type: integer
        about: Number of results to skip. Required for offset-based pagination.
      page:
        in: body
        type: integer
        about: Page number. Required when using page-based pagination.
      limit:
        in: body
        type: integer
        about: Number of results per page
      cursor:
        in: body
        about: Cursor for pagination
      job_title_or:
        in: body
        type: array
        about: Keyword-based patterns to match job titles. Case-insensitive. Returns jobs whose title contains all
          the words in any of the patterns, in any order. For example, marketing vp matches titles such as VP…
      job_title_not:
        in: body
        type: array
        about: Keyword-based patterns to exclude job titles. Case-insensitive. Excludes jobs whose title contains
          all the words in any of the patterns, in any order. For example, marketing vp excludes titles such…
      job_title_pattern_and:
        in: body
        type: array
        about: Regex patterns to match job titles. Case-insensitive. Only jobs with title that match all of these
          patterns will be returned.
      job_title_pattern_or:
        in: body
        type: array
        about: Regex patterns to match job titles. Case-insensitive. Jobs whose job title matches any of the patterns
          will be returned.
      job_title_pattern_not:
        in: body
        type: array
        about: Regex patterns to match job titles. Case-insensitive. Jobs whose job title doesn't match any of the
          patterns will be returned.
      job_country_code_or:
        in: body
        type: array
        about: 2-letter ISO country code of the location of the job. Can pass more than 1
      job_country_code_not:
        in: body
        type: array
        about: 2-letter ISO country code of the location of the job. Can pass more than 1. Will exclude jobs from
          these countries
      posted_at_max_age_days:
        in: body
        type: integer
        about: Date posted max age in days. If 0, only return jobs posted today. If 1, from today and yesterday,
          etc.
      posted_at_gte:
        in: body
        about: ISO 8601 date string (yyyy-mm-dd). Only jobs published in this date or after will be returned.
      posted_at_lte:
        in: body
        about: ISO 8601 date string (yyyy-mm-dd). Only jobs published in this date or before will be returned.
      discovered_at_max_age_days:
        in: body
        type: integer
        about: If 0, only return jobs added to our database in the current day. If 1, from today and yesterday,
          etc. Does not satisfy the mandatory-filter rule; combine it with a posted_at_* filter.
      discovered_at_min_age_days:
        in: body
        type: integer
        about: If 1, only return jobs discovered by TheirStack until yesterday. If 2, until 2 days ago, etc. Does
          not satisfy the mandatory-filter rule; combine it with a posted_at_* filter.
      discovered_at_gte:
        in: body
        about: Only jobs discovered by TheirStack on this date or datetime or after will be returned. In UTC timezone.
          Does not satisfy the mandatory-filter rule; combine it with a posted_at_* filter.
      discovered_at_lte:
        in: body
        about: Only jobs discovered by TheirStack on this date or datetime or before will be returned. In UTC timezone.
          Does not satisfy the mandatory-filter rule; combine it with a posted_at_* filter.
      job_description_pattern_or:
        in: body
        type: array
        about: Regex patterns to look for in job descriptions. Case-sensitive. Results will include jobs whose description
          matches any of these patterns. Use (?i) at the start of a pattern to make it…
      job_description_pattern_not:
        in: body
        type: array
        about: Regex patterns to look for in job descriptions. Case-sensitive. Results will include jobs whose description
          doesn't match any of these patterns. Use (?i) at the start of a pattern to make it…
      job_description_pattern_and:
        in: body
        type: array
        about: Regex patterns that must ALL match the job description (AND logic). Use (?i) at the start of a pattern
          to make it case-insensitive. Results will only include jobs whose description matches every…
      job_description_pattern_is_case_insensitive:
        in: body
        type: boolean
        about: Deprecated. Has no effect.
      job_description_contains_or:
        in: body
        type: array
        about: Search for whole words in job descriptions using word boundaries (\b). Case-insensitive by default,
          except for the patterns that are uppercase - in that case we'll respect it. Only finds complete…
      job_description_contains_not:
        in: body
        type: array
        about: Exclude jobs whose description contains any of these whole words using word boundaries (\b). Case-insensitive
          by default, except for the patterns that are uppercase - in that case we'll respect it.…
      job_description_pattern_case_sensitive_or:
        in: body
        type: array
        about: Deprecated. Use job_description_pattern_or instead, which now behaves identically.
      remote:
        in: body
        type: boolean
        about: 'Deprecated. Use workplace_types_or instead. True: only show remote jobs. False: only show non-remote
          jobs. None: show all jobs.'
      workplace_types_or:
        in: body
        type: array
        about: Filter jobs by workplace type. Returns jobs that match any of the specified workplace types. on_site
          matches jobs that are neither hybrid nor remote. If no values are provided or an empty list is…
      only_jobs_with_reports_to:
        in: body
        type: boolean
        about: Only return jobs where we identified the role the hired person would report to. Deprecated field,
          use reports_to_exists instead.
      reports_to_exists:
        in: body
        type: boolean
        about: Only return jobs where we identified the role the hired person would report to. If True, only return
          jobs where we identified the role the hired person would report to. If False, only return jobs…
      final_url_exists:
        in: body
        type: boolean
        about: (Use property_exists_or / property_exists_and instead) Only return jobs with a final URL. Typically
          jobs that were originally posted on an ATS. If True, only return jobs with a final URL. If False,…
      only_jobs_with_hiring_managers:
        in: body
        type: boolean
        about: Only return jobs with a hiring manager. If True, only return jobs with a hiring manager. If False,
          only return jobs without a hiring manager. If None, return all jobs.
      hiring_managers_exists:
        in: body
        type: boolean
        about: (Use property_exists_or / property_exists_and instead) If True, only return jobs with a hiring manager.
          If False, only return jobs without a hiring manager. If None, return all jobs.
      job_id_or:
        in: body
        type: array
        about: Get jobs with these IDs only.
      job_id_not:
        in: body
        type: array
        about: Exclude jobs with these IDs.
      job_export_key_or:
        in: body
        type: array
        about: Internal export lookup keys for fetching a materialized job batch.
      job_ids:
        in: body
        type: array
        about: Get jobs with these IDs only. Deprecated parameter, use job_id_or instead.
      job_seniority_or:
        in: body
        type: array
        about: Will return jobs where the seniority is any of the ones passed here
      min_salary_usd:
        in: body
        type: number
        about: Minimum annual salary in USD. For example, 100000 means $100,000.
      max_salary_usd:
        in: body
        type: number
        about: Maximum annual salary in USD. For example, 150000 means $150,000.
      job_technology_slug_or:
        in: body
        type: array
        about: Will return jobs where any of these technologies appear. Case sensitive. Pass slugs. Check out all
          the technologies we track at GET /v0/catalog/keywords with keyword_type=technology. If you pass more…
      job_technology_slug_not:
        in: body
        type: array
        about: Will return jobs where none of these technologies appear. Case sensitive. Pass slugs. Check out all
          the technologies we track at GET /v0/catalog/keywords with keyword_type=technology.
      job_technology_slug_and:
        in: body
        type: array
        about: Will return jobs where all of these technologies appear. Case sensitive. Pass slugs. Check out all
          the technologies we track at GET /v0/catalog/keywords with keyword_type=technology.
      job_keyword_slug_or:
        in: body
        type: array
        about: Will return jobs where any of these keyword slugs appear. Case sensitive. Check out all the keywords
          we track at GET /v0/catalog/keywords
      job_keyword_slug_and:
        in: body
        type: array
        about: Will return jobs where all of these keyword slugs appear. Case sensitive. Check out all the keywords
          we track at GET /v0/catalog/keywords
      job_keyword_slug_not:
        in: body
        type: array
        about: Will return jobs where none of these keyword slugs appear. Case sensitive. Check out all the keywords
          we track at GET /v0/catalog/keywords
      job_location_pattern_or:
        in: body
        type: array
        about: Regex patterns to match job locations. Case-insensitive. Searches both the location field and the
          enhanced locations array (using normalized city and state name fields within each location element).…
      job_location_pattern_not:
        in: body
        type: array
        about: Regex patterns to exclude job locations. Case-insensitive. Searches both the location field and the
          enhanced locations array (using normalized city and state name fields within each location…
      job_location_or:
        in: body
        type: array
        about: Filter jobs by location. Returns jobs whose locations match ANY of the specified location criteria.
          Each location criteria is specified using a JobLocationFilter object. (You can find location IDs…
      job_location_not:
        in: body
        type: array
        about: Filter jobs by location. Returns jobs whose locations DO NOT match ANY of the specified location
          criteria. Each location criteria is specified using a JobLocationFilter object. (You can find location…
      url_domain_or:
        in: body
        type: array
        about: Include jobs only if their URL domain (from url or source_url) is in the provided case-insensitive
          list. For example, ['greenhouse.io', 'workable.com'] will match URLs containing 'greenhouse.io' or…
      url_domain_not:
        in: body
        type: array
        about: Exclude jobs if their URL domain (from url or source_url) is in the provided case-insensitive list.
          For example, ['greenhouse.io', 'workable.com'] will exclude URLs containing 'greenhouse.io' or…
      scraper_name_pattern_or:
        in: body
        type: array
        about: Regex patterns to match job sources. Case-insensitive.
      easy_apply:
        in: body
        type: boolean
        about: If True, only return jobs that can be applied directly through the job board. If False, only return
          jobs that require redirecting to the company's website.
      employment_statuses_or:
        in: body
        type: array
        about: Filter jobs by employment status. Returns jobs that match any of the specified employment types.
          If no values are provided or an empty list is sent, all jobs regardless of employment status will be…
      is_closed:
        in: body
        type: boolean
        about: If True, only return closed jobs (jobs where TheirStack detected the posting was closed). If False,
          only return open jobs. If None, return all jobs regardless of closure status.
      closed_at_gte:
        in: body
        about: ISO 8601 date string (yyyy-mm-dd). Only return jobs closed on this date or after.
      closed_at_lte:
        in: body
        about: ISO 8601 date string (yyyy-mm-dd). Only return jobs closed on this date or before.
      property_exists_or:
        in: body
        type: array
        about: Return jobs that have any of these fields not null. For example, if you pass ['final_url'], it will
          return jobs that have a final_url set. This field also supports chaining of fields. For example, if…
      property_exists_and:
        in: body
        type: array
        about: Return jobs that have all of these fields not null. For example, if you pass ['company_object.domain',
          'final_url'], it will only return jobs that have both a company domain and a final_url set.
      company_name_or:
        in: body
        type: array
        about: Only return companies that match these names exactly, case-sensitively. This filter acts as an OR
          filter, so if you pass more than one company name, it will return companies that match any of the…
      company_name_case_insensitive_or:
        in: body
        type: array
        about: Only return companies that match these names exactly, case-insensitively.
      company_id_or:
        in: body
        type: array
        about: Only return companies that match these IDs exactly. This filter acts as an OR filter, so if you pass
          more than one company ID, it will return companies that match any of the IDs.
      company_id_not:
        in: body
        type: array
        about: Exclude companies that match these IDs. This filter acts as a NOT filter, so if you pass more than
          one company ID, it will exclude companies that match any of the IDs.
      company_domain_or:
        in: body
        type: array
        about: Only return companies that match these domains exactly. It accepts full urls (https://www.google.com/)
          and emails (andrew@stripe.com). This filter acts as an OR filter, so if you pass more than one…
      company_domain_not:
        in: body
        type: array
        about: Only return companies that don't match these domains exactly. It accepts full urls (https://www.google.com/)
          and emails (andrew@stripe.com).
      company_name_not:
        in: body
        type: array
        about: Only return companies that don't match these names exactly, case-sensitively.
      company_name_partial_match_or:
        in: body
        type: array
        about: Company names. Will return companies whose name contains any of the substrings passed here, case-insensitively.
          For example, if you pass "google", it will return "Google", "Google LLC", "Google Inc",…
      company_name_partial_match_not:
        in: body
        type: array
        about: Company names. Will return companies whose name doesn't contain any of the substrings passed here,
          case-insensitively. For example, if you pass 'google', it will exclude 'Google', 'Google LLC',…
      company_linkedin_url_or:
        in: body
        type: array
        about: Return companies whose LinkedIn page matches any of the values passed here. Both forms of LinkedIn
          company URL work — the vanity slug (https://www.linkedin.com/company/google/) and the numeric…
      blur_company_data:
        in: body
        type: boolean
        about: 'Enable preview mode to return blurred data without consuming credits in the TheirStack app. Deprecated:
          preview mode is being retired and will stop working over the API. It still works on paid…'
      company_description_pattern_or:
        in: body
        type: array
        about: Case-insensitive patterns to match in the company description. Will return companies that match any
          of the patterns.
      company_description_pattern_not:
        in: body
        type: array
        about: Case-insensitive patterns to match in the company description. Will exclude companies that match
