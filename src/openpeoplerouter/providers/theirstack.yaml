      industry_not:
        in: body
        type: array
        about: 'Names of industries, case-insensitive. Results will exclude companies that belong to any of the
          industries specified in this parameter. Available values: GET /v0/catalog/industries WARNING:…'
      industry_id_or:
        in: body
        type: array
        about: Industry codes. You can use any of LinkedIn's Industry Codes V2 or GET /v0/catalog/industries
      industry_id_not:
        in: body
        type: array
        about: Industry ids to exclude. You can use any of LinkedIn's Industry Codes V2 or GET /v0/catalog/industries
      industry_id_not_or_null:
        in: body
        type: array
        about: Industry ids to exclude. Companies whose industry we don't know are returned as well. You can use
          any of LinkedIn's Industry Codes V2 or GET /v0/catalog/industries
      company_tags_or:
        in: body
        type: array
        about: Return companies that match any of these keywords
      company_type:
        in: body
        about: Filter by company type.
      company_investors_or:
        in: body
        type: array
        about: Investors of the company
      company_investors_partial_match_or:
        in: body
        type: array
        about: Investors of the company. Will return companies for which any of their investors contains any of
          the substrings passed here. For example, if you pass 'andree', all funds that match it (like…
      company_technology_slug_or:
        in: body
        type: array
        about: Return results from companies that have mentioned any of these technologies in their jobs (in job
          searches, not necessarily in the jobs returned). Case sensitive. Pass slugs. Check out all the…
      company_technology_slug_and:
        in: body
        type: array
        about: Return results from companies that have mentioned all of these technologies in their jobs (in job
