      company_description_pattern_accent_insensitive:
        in: body
        type: boolean
        about: Set to True to make company description searches accent insensitive. For example, "á" will match
          "a" as well.
      min_revenue_usd:
        in: body
        type: integer
        about: Minimum company revenue, in USD
      max_revenue_usd:
        in: body
        type: integer
        about: Maximum company revenue, in USD
      min_employee_count:
        in: body
        type: integer
        about: Minimum number of employees in a company
      max_employee_count:
        in: body
        type: integer
