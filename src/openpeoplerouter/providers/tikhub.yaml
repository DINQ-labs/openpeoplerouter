        in: body
        about: api v1 bilibili huahuo Creator gender from gender_info returned by api v1 bilibili huahuo square_static_info
      min_fans_num:
        in: body
        type: integer
        about: Minimum follower count, inclusive
      max_fans_num:
        in: body
        type: integer
        about: Maximum follower count, inclusive
