      sort:
        in: body
        about: 'Sort direction: desc=descending, asc=ascending'
      page:
        in: body
        type: integer
        about: One-based page number; each page returns 20 records
      request_id:
        in: body
        about: Search-session ID; reuse it across pages of the same filter set
