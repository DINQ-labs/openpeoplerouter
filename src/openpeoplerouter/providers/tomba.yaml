id: tomba
title: Tomba
about: Email finding and verification by domain, name, LinkedIn profile or article URL, plus phone, person and company enrichment.
site: https://tomba.io
docs: https://docs.tomba.io
pricing: https://tomba.io/pricing
api: https://api.tomba.io/v1
key:
  env: TOMBA_API_KEY
  header: X-Tomba-Key
  also:
  - {header: X-Tomba-Secret, env: TOMBA_SECRET}
operations:
  domain-search:
    title: Everyone with a known email at a company
    request: GET /domain-search
    docs: https://docs.tomba.io/api/finder#domain-search
    params:
      domain: {required: true}
      page: {type: integer}
      limit: {type: integer, about: 10, 20 or 50}
      department: {about: engineer, sales, finance, hr, it, marketing, operations, management, executive, legal, support, communication, software, security, pr, warehouse, diversity, administrative, facilities, accounting}
      country: {about: ISO alpha-2}
    price: {credits: 1, per: success, note: one search credit per page with results}
    jobs:
      find_people:
        needs: [[company_domain]]
        send: {company_domain: domain, country: country}
        result: data.emails
        fields: {name: full_name, first_name: first_name, last_name: last_name, title: position, country: country,
                 linkedin_url: linkedin, email: email, phone: phone_number}
  email-finder:
    title: Work email from a name and company domain
    request: GET /email-finder
    docs: https://docs.tomba.io/api/finder#email-finder
    params:
      domain: {required: true}
      first_name: {required: true}
      last_name: {required: true}
    price: {credits: 1, per: success}
    jobs:
      find_contact:
        needs: [[first_name, last_name, company_domain]]
        send: {first_name: first_name, last_name: last_name, company_domain: domain}
        result: data
        fields: {email: email, email_status: verification.status, confidence: score, phone: phone_number,
                 name: full_name, title: position, company_domain: website_url}
  linkedin-finder:
    title: Work email from a LinkedIn profile URL
    request: GET /linkedin
    docs: https://docs.tomba.io/api/finder#linkedin-finder
    params:
      url: {required: true}
    price: {credits: 1, per: success}
    jobs:
      find_contact:
        needs: [[linkedin_url]]
        send: {linkedin_url: url}
        result: data
        fields: {email: email, email_status: verification.status, confidence: score, phone: phone_number,
                 name: full_name, title: position, company_domain: website_url}
  author-finder:
    title: The author of an article and their email
    request: GET /author-finder
    params:
      url: {required: true, about: article URL}
    price: {credits: 1, per: success}
  email-verifier:
    title: Whether an address accepts mail
    request: GET /email-verifier
    docs: https://docs.tomba.io/api/verifier#email-verifier
    params:
      email: {required: true}
    price: {credits: 1, per: call, note: verification credits}
    jobs:
      verify_email:
        needs: [[email]]
        send: {email: email}
        result: data.email
        fields: {email: email, status: status, deliverable: result == 'deliverable', score: score, catch_all: accept_all,
                 disposable: disposable}
  enrich:
    title: A person's details from an email
    request: GET /enrich
    params:
      email: {required: true}
    price: {credits: 1, per: success}
  people-find:
    title: A person's profile from an email
    request: GET /people/find
    docs: https://docs.tomba.io/api/enrichment#person-api
    params:
      email: {required: true}
    price: {credits: 1, per: success}
    jobs:
      enrich_person:
        needs: [[email]]
        send: {email: email}
        result: data
        fields: {name: name.fullName, first_name: name.givenName, last_name: name.familyName, title: employment.title,
                 company: employment.name, company_domain: employment.domain, location: location, country: geo.countryCode,
                 linkedin_url: "linkedin.handle && join('', ['https://www.linkedin.com/', linkedin.handle])", email: email,
                 image: avatar}
  companies-find:
    title: A company's profile from its domain
    request: GET /companies/find
    docs: https://docs.tomba.io/api/enrichment#company-api
    params:
      domain: {required: true}
    price: {credits: 1, per: success}
    jobs:
      enrich_company:
        needs: [[domain]]
        send: {domain: domain}
        result: data
        fields: {name: name, domain: domain, description: description, industry: category.industry, employees: metrics.employees,
                 founded: foundedYear, location: location, country: geo.countryCode,
                 linkedin_url: "linkedin.handle && join('', ['https://www.linkedin.com/', linkedin.handle])", logo: logo,
                 technologies: tech, revenue: metrics.estimatedAnnualRevenue, funding: metrics.raised}
  combined-find:
    title: A person and their company from an email
    request: GET /combined/find
    params:
      email: {required: true}
    price: {credits: 1, per: success}
  phone-finder:
    title: Phone numbers for an email, domain or LinkedIn profile
    request: GET /phone-finder
    params:
      email: {}
      domain: {}
      linkedin: {about: LinkedIn profile URL}
      full: {type: boolean, about: every number found, not only the best}
    price: {credits: 1, per: success}
    jobs:
      find_contact:
        needs: [[linkedin_url]]
        send: {linkedin_url: linkedin}
        result: data
        fields: {phone: intl_format || local_format}
  phone-validator:
    title: Whether a phone number is valid, its carrier and line type
    request: GET /phone-validator
    params:
      phone: {required: true}
    price: {credits: 1, per: call}
  email-sources:
    title: Pages where an email address was found
    request: GET /email-sources
    params:
      email: {required: true}
    price: {usd: 0, per: call}
  email-count:
    title: How many emails Tomba has for a domain, by department and seniority
    request: GET /email-count
    params:
      domain: {required: true}
    price: {usd: 0, per: call}
  email-format:
    title: The email patterns a company uses
    request: GET /email-format
    params:
      domain: {required: true}
    price: {usd: 0, per: call}
  location:
    title: Where a company's employees are, by country
    request: GET /location
    params:
      domain: {required: true}
    price: {usd: 0, per: call}
  similar:
    title: Companies similar to a domain
    request: GET /similar
    params:
      domain: {required: true}
    price: {credits: 1, per: call}
  technology:
    title: Technologies a website uses
    request: GET /technology
    params:
      domain: {required: true}
    price: {credits: 1, per: call}
  domain-suggestions:
    title: Company domains matching a name
    request: GET /domain-suggestions
    params:
      query: {required: true}
    price: {usd: 0, per: call}
  search-companies:
    title: Companies by plain-language description or filters
    request: POST /reveal/search
    docs: https://docs.tomba.io/api/reveal#search-companies
    params:
      query: {in: body, about: a description of the companies, turned into filters}
      filters: {in: body, type: object, about: "include/exclude lists for industry, size, location_country, technologies, keywords, founded, revenue…"}
      page: {in: body, type: integer}
    price: {credits: 1, per: call}
    jobs:
      find_companies:
        needs: [[query]]
        send: {query: query}
        result: data.companies
        fields: {name: organization.organization || name, domain: domain || organization.website_url,
                 industry: organization.industries || industry, employees: organization.company_size || size,
                 country: organization.location.country || country}
  account:
    title: Your plan and remaining credits
    request: GET /me
    price: {usd: 0, per: call}
